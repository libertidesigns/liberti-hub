function jsonpCall(url,params){
  return new Promise(function(resolve,reject){
    var cbName='jcb_'+Math.random().toString(36).slice(2);
    var sc;
    var timer=setTimeout(function(){delete window[cbName];if(sc&&sc.parentNode)sc.parentNode.removeChild(sc);reject(new Error('Timeout'));},14000);
    window[cbName]=function(data){clearTimeout(timer);delete window[cbName];if(sc&&sc.parentNode)sc.parentNode.removeChild(sc);if(data.ok===false)reject(new Error(data.error||'API chyba'));else resolve(data);};
    var q=Object.keys(params).map(function(k){return k+'='+params[k];}).join('&');
    sc=document.createElement('script');sc.src=url+'?'+q+'&callback='+cbName;
    sc.onerror=function(){clearTimeout(timer);delete window[cbName];reject(new Error('Chyba načítání.'));};
    document.head.appendChild(sc);
  });
}
function apiRead(type){return jsonpCall(API_URL,{action:'read',type:type,t:Date.now()}).then(function(d){return d.data;});}
function apiWrite(type,data){var enc=encodeURIComponent(JSON.stringify(data));return jsonpCall(API_URL,{action:'write',type:type,data:enc,t:Date.now()});}

function calcInv(items, vatEnabled, vatRate, discount){
  const subtotal = (items||[]).reduce((s,i)=>(s+(i.qty||0)*(i.unitPrice||0)),0);
  let discountAmt = 0;
  if(discount && discount.enabled){
    discountAmt = discount.type==="pct" ? subtotal*(discount.value||0)/100 : (discount.value||0);
    discountAmt = Math.min(discountAmt, subtotal);
  }
  const base = subtotal - discountAmt;
  const vat = vatEnabled ? base*(vatRate||21)/100 : 0;
  return {subtotal, discountAmt, base, vat, tot: base+vat};
}

function useConfirm(){

function playIntroSound(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==="suspended")ctx.resume();
    const now=ctx.currentTime;
    const mk=(type,freq,start,end,gainPeak,gainStart,gainEnd)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type=type;o.frequency.setValueAtTime(freq,now+start);
      g.gain.setValueAtTime(gainStart||0,now+start);
      g.gain.linearRampToValueAtTime(gainPeak,now+start+0.15);
      g.gain.linearRampToValueAtTime(gainEnd||0,now+end);
      o.connect(g);g.connect(ctx.destination);
      o.start(now+start);o.stop(now+end+0.05);
    };
    mk("sine",42,0,2.8,0.18,0,0);           // sub drone
    mk("triangle",110,0.1,2.5,0.06,0,0);    // mid warmth
    mk("sine",880,0.75,1.9,0.035,0,0);      // shimmer
    mk("sine",528,2.55,3.8,0.08,0,0.001);   // chime
  }catch(e){}
}

function PinLogin({onSuccess}){
  const [pin,setPin]=useState("");
  const [phase,setPhase]=useState("intro"); // intro | pin | username
  const [username,setUsername]=useState(()=>localStorage.getItem("liberti_user")||"");
  const [usernameErr,setUsernameErr]=useState("");
  const [matchedRole,setMatchedRole]=useState(null);
  const [pinErr,setPinErr]=useState(false);
  const lastNumpadRef=useRef(0);
  const T300={fontFamily:"'Teko',sans-serif",fontWeight:300};

  const [prefetching,setPrefetching]=useState(false);

  // Zkontroluj kód - nejprve hardcoded PINy, pak cache
  const checkCode=code=>{
    // Admin PIN - vždy funguje
    if(code===ADMIN_PIN)return {v:"admin",l:"Admin",isAdmin:true,code:ADMIN_PIN};
    // Employee PIN - legacy fallback
    if(code===EMPLOYEE_PIN)return {v:"employee",l:"Zaměstnanec",isAdmin:false,code:EMPLOYEE_PIN};
    // Hledej v localStorage cache (role načtené z API nebo uložené adminem)
    try{
      const cached=JSON.parse(localStorage.getItem("liberti_roles")||"[]");
      const found=cached.find(r=>r.code&&r.code===code);
      if(found)return found;
    }catch(e){}
    return null;
  };

  // Pre-fetch rolí a lidí z API — potřebné pro non-admin přihlášení na novém zařízení
  useEffect(()=>{
    const prefetch=async()=>{
      setPrefetching(true);
      try{
        const [set,ppl]=await Promise.all([
          apiRead("settings").catch(()=>null),
          apiRead("people").catch(()=>null),
        ]);
        if(set){
          // Ulož VŠECHNY role (system i custom) pro offline přihlašování
          const allRoles=[...(Array.isArray(set.systemRoles)?set.systemRoles:[]),...(Array.isArray(set.customRoles)?set.customRoles:[])];
          if(allRoles.length>0)localStorage.setItem("liberti_roles",JSON.stringify(allRoles));
        }
        const people=Array.isArray(ppl)&&ppl.length>0?ppl:(set&&Array.isArray(set.people)&&set.people.length>0?set.people:[]);
        if(people.length>0)localStorage.setItem("liberti_people",JSON.stringify(people));
      }catch(e){}finally{setPrefetching(false);}
    };
    prefetch();
  },[]);

  // Auto-login ze session
  useEffect(()=>{
    const savedRole=localStorage.getItem("liberti_auth_role");
    const savedUser=localStorage.getItem("liberti_user");
    if(savedRole&&savedUser){
      const isAdm=savedRole==="admin";
      const defRoles=typeof DEF!=="undefined"?(DEF.systemRoles||[]):[];
      let role=isAdm?{v:"admin",l:"Admin",isAdmin:true}:null;
      if(!role)role=defRoles.find(r=>r.v===savedRole)||null;
      if(!role){
        try{
          const cached=JSON.parse(localStorage.getItem("liberti_roles")||"[]");
          role=cached.find(r=>r.v===savedRole)||null;
        }catch(e){}
      }
      if(role){onSuccess(role,savedUser);return;}
    }
    const sa=setTimeout(()=>{try{playIntroSound();}catch(e){}},300);
    const t=setTimeout(()=>setPhase("pin"),2600);
    return()=>{clearTimeout(sa);clearTimeout(t);}
  },[]);

  const handleDigit=d=>{
    const next=pin+d;
    setPin(next);
    if(next.length===7){
      const role=checkCode(next);
      if(role){
        setPinErr(false);
        if(role.isAdmin){
          localStorage.setItem("liberti_auth_role","admin");
          localStorage.setItem("liberti_user","admin");
          setPin("");
          onSuccess(role,"admin");
        } else {
          setMatchedRole(role);
          setPin("");
          setPhase("username");
        }
      } else {
        setPinErr(true);
        setTimeout(()=>{setPin("");setPinErr(false);},700);
      }
    }
  };

  const doLogin=()=>{
    const u=username.trim().toLowerCase();
    if(!u){setUsernameErr("Zadej přihlašovací jméno");return;}
    if(!matchedRole)return;
    // Normalizace: odstraní diakritiku, lowercase (pro porovnání jmen)
    const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,".");
    try{
      const cached=JSON.parse(localStorage.getItem("liberti_people")||"[]");
      if(cached.length>0){
        // Hledej osobu se správnou rolí; match: username = přesně, nebo jméno různými způsoby
        const found=cached.find(p=>{
          if(p.role!==matchedRole.v||p.active===false)return false;
          if(p.username&&p.username.toLowerCase()===u)return true; // přesný username
          if(p.name){
            const n=p.name.toLowerCase();
            const nn=norm(p.name);
            if(n===u||nn===norm(u))return true;       // celé jméno
            if(n.split(" ")[0]===u||nn.split(".")[0]===norm(u))return true; // křestní jméno
          }
          return false;
        });
        if(!found){setUsernameErr("Jméno nenalezeno nebo neodpovídá roli");return;}
        // Uložit person.id pro správné napojení na úkoly a docházku
        localStorage.setItem("liberti_person_id",found.id);
      }
    }catch(e){}
    localStorage.setItem("liberti_auth_role",matchedRole.v);
    localStorage.setItem("liberti_user",u);
    onSuccess(matchedRole,u);
  };

  const handleDigitRef=useRef(null);
  handleDigitRef.current=handleDigit;
  const doLoginRef=useRef(null);
  doLoginRef.current=doLogin;

  useEffect(()=>{
    const h=e=>{
      if(phase==="pin"){
        if(/^[0-9]$/.test(e.key)){e.preventDefault();handleDigitRef.current(e.key);}
        else if(e.key==="Backspace"){e.preventDefault();setPin(p=>p.slice(0,-1));}
      } else if(phase==="username"&&e.key==="Enter"){
        doLoginRef.current();
      }
    };
    window.addEventListener("keydown",h);
    return()=>window.removeEventListener("keydown",h);
  },[phase]);

  const isIntro=phase==="intro";
  return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",
        alignItems:"center",justifyContent:"center",position:"relative",overflowX:"hidden",overflowY:"auto"}}>
      <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.6) 100%)",pointerEvents:"none"}}/>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",
        transform:isIntro?"translateY(0)":"translateY(-32px)",marginBottom:isIntro?0:44,
        transition:"transform 0.9s cubic-bezier(.22,1,.36,1),margin 0.9s cubic-bezier(.22,1,.36,1)"}}>
        <div style={{...T300,fontSize:isIntro?"clamp(64px,12vw,96px)":"52px",
          letterSpacing:"0.26em",textIndent:"0.26em",color:C.ivory,lineHeight:1,textAlign:"center",
          animation:"revealLogo 1.1s cubic-bezier(.22,1,.36,1) both",
          transition:"font-size 0.9s cubic-bezier(.22,1,.36,1)"}}>LIBERTI</div>
        <div style={{display:"flex",alignItems:"center",
          width:isIntro?"clamp(240px,40vw,360px)":"220px",gap:14,marginTop:isIntro?18:12,
          transition:"width 0.9s cubic-bezier(.22,1,.36,1)",overflow:"hidden"}}>
          <div style={{height:1,flex:1,background:"rgba(139,26,26,.7)",transformOrigin:"left",animation:"lineGrow .8s cubic-bezier(.22,1,.36,1) .7s both"}}/>
          <div style={{...T300,fontSize:isIntro?22:16,letterSpacing:"0.44em",color:C.merlot,
            animation:"hubFade .6s cubic-bezier(.22,1,.36,1) 1s both",transition:"font-size 0.9s ease",flexShrink:0}}>HUB</div>
          <div style={{height:1,flex:1,background:"rgba(139,26,26,.7)",transformOrigin:"right",animation:"lineGrow .8s cubic-bezier(.22,1,.36,1) .7s both"}}/>
        </div>
      </div>

      {phase==="pin"&&<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:20,
        opacity:isIntro?0:1,transform:isIntro?"translateY(12px)":"translateY(0)",
        transition:"opacity 0.7s ease 0.1s,transform 0.7s cubic-bezier(.22,1,.36,1) 0.1s",
        pointerEvents:isIntro?"none":"auto"}}>
        <div style={{...T.m,fontSize:FS.s,letterSpacing:"0.32em",textTransform:"uppercase",color:C.hi}}>Zadej přístupový kód</div>
        {prefetching&&<div style={{...T.m,fontSize:9,color:C.dim,letterSpacing:"0.18em",opacity:0.6}}>načítání rolí…</div>}
        <div style={{display:"flex",gap:14}}>
          {Array.from({length:7}).map((_,i)=>(
            <div key={i} style={{width:13,height:13,borderRadius:"50%",
              background:pinErr?"#5a0a0a":i<pin.length?C.merlot:C.s2,
              border:`1px solid ${pinErr?C.merlot:i<pin.length?C.merlot:C.border}`,
              transition:"all .15s",
              boxShadow:i<pin.length&&!pinErr?"0 0 10px rgba(229,57,53,.4)":"none"}}/>
          ))}
        </div>
        {pinErr&&<div style={{...T.m,fontSize:FS.s,color:C.merlot,letterSpacing:"0.2em",textTransform:"uppercase",animation:"fadeIn .2s ease"}}>Nesprávný kód</div>}
        <div className="pin-numpad" style={{marginTop:8}}>
          {[[1,2,3],[4,5,6],[7,8,9],["","0","⌫"]].map((row,ri)=>(
            <div key={ri} style={{display:"flex",gap:12,justifyContent:"center",marginBottom:10}}>
              {row.map((d,di)=>{
                const act=()=>{
                  const now=Date.now();
                  if(now-lastNumpadRef.current<300)return;
                  lastNumpadRef.current=now;
                  if(d==="⌫")setPin(p=>p.slice(0,-1));else if(d!=="")handleDigit(String(d));
                };
                return(
                <button key={di} type="button"
                  onClick={d!==""?act:undefined}
                  disabled={d===""}
                  style={{width:64,height:64,borderRadius:"50%",
                    border:`1px solid ${d===""?"transparent":C.border}`,
                    background:d===""?"transparent":C.s2,cursor:d===""?"default":"pointer",
                    color:C.ivory,...T300,fontSize:26,display:"flex",alignItems:"center",justifyContent:"center",
                    WebkitTapHighlightColor:"transparent",touchAction:"manipulation",userSelect:"none"}}>
                  {d}
                </button>
              );})}
            </div>
          ))}
        </div>
      </div>}

      {phase==="username"&&<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16,
        animation:"fadeIn .4s ease",maxWidth:340,width:"90%"}}>
        {matchedRole&&<div style={{...T300,fontSize:22,letterSpacing:"0.2em",color:C.merlot,textAlign:"center"}}>
          {matchedRole.l}
        </div>}
        <div style={{...T.m,fontSize:FS.s,letterSpacing:"0.2em",textTransform:"uppercase",color:C.hi}}>Přihlašovací jméno</div>
        <div style={{...T.m,fontSize:FS.s,color:C.dim,textAlign:"center",lineHeight:1.7}}>
          bez diakritiky, např. <span style={{color:C.ivory}}>novak.jan</span>
        </div>
        <div style={{width:"100%"}}>
          <input value={username} onChange={e=>{setUsername(e.target.value.toLowerCase());setUsernameErr("");}}
            placeholder="novak.jan" autoFocus
            style={{width:"100%",boxSizing:"border-box",background:C.s2,
              border:`1px solid ${usernameErr?C.merlot:C.border}`,borderRadius:4,
              padding:"14px 18px",color:C.ivory,...T.m,fontSize:FS.b,outline:"none",textAlign:"center"}}/>
          {usernameErr&&<div style={{...T.m,fontSize:FS.s,color:C.merlot,marginTop:6,textAlign:"center"}}>{usernameErr}</div>}
        </div>
        <button onClick={doLogin}
          style={{...T300,fontSize:22,letterSpacing:"0.2em",background:C.merlot,color:C.ivory,border:"none",borderRadius:4,padding:"12px 40px",cursor:"pointer"}}>
          Vstoupit
        </button>
        <button onClick={()=>{setPhase("pin");setPin("");setMatchedRole(null);setUsernameErr("");}}
          style={{...T.m,fontSize:FS.s,color:C.dim,background:"transparent",border:"none",cursor:"pointer"}}>Zpět</button>
      </div>}

      <div style={{position:"absolute",bottom:28,opacity:isIntro?0:0.6,transition:"opacity 1s ease 1.2s"}}>
        <div style={{...T.m,fontSize:FS.s,letterSpacing:"0.22em",color:C.dim,textTransform:"uppercase"}}>{"Liberti Hub · "+new Date().getFullYear()}</div>
      </div>
    </div>
  );
}


function Lbl({c,s={}}){return <div style={{...T.m,fontSize:FS.s,letterSpacing:"0.14em",textTransform:"uppercase",color:C.dim,marginBottom:5,...s}}>{c}</div>;}
function Pill({s}){const st=ST[s]||ST.Koncept;return <span style={{...T.m,fontSize:FS.s,fontWeight:300,letterSpacing:"0.12em",textTransform:"uppercase",color:st.c,background:st.bg,border:`1px solid ${st.b}`,borderRadius:3,padding:"3px 9px",whiteSpace:"nowrap"}}>{s}</span>;}
function Spin({sz=18}){return <div style={{width:sz,height:sz,border:`2px solid ${C.border}`,borderTop:`2px solid ${C.merlot}`,borderRadius:"50%",animation:"spin .8s linear infinite",flexShrink:0}}/>;}
function Card({children,sx={},...rest}){return <div style={{background:C.s1,border:`1px solid ${C.border}`,borderRadius:4,...sx}} {...rest}>{children}</div>;}
function SH({c}){return <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}><span style={{...T.t,fontSize:17,fontWeight:600,letterSpacing:"0.16em",color:C.ivory,textTransform:"uppercase"}}>{c}</span><div style={{flex:1,height:1,background:C.border}}/></div>;}
function Sel({value,onChange,opts,sx={},lbl,ph}){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    if(!open)return;
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener("mousedown",h);
    return()=>document.removeEventListener("mousedown",h);
  },[open]);
  const strVal=value===null||value===undefined?"":String(value);
  const cur=(opts||[]).find(o=>String(o.v??o)===strVal);
  const label=cur?(cur.l??cur):(ph||"—");
  const base={width:"100%",background:C.s2,border:`1px solid ${open?C.merlot:C.border}`,borderRadius:3,padding:"11px 12px",color:cur?C.ivory:C.dim,...T.m,fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,transition:"border-color .15s",textAlign:"left",boxSizing:"border-box",...sx};
  return<div ref={ref} style={{position:"relative"}}>
    {lbl&&<Lbl c={lbl}/>}
    <button type="button" onClick={()=>setOpen(p=>!p)} style={base}>
      <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{label}</span>
      <span style={{fontSize:9,color:C.dim,flexShrink:0,transform:open?"rotate(180deg)":"",transition:"transform .2s",lineHeight:1}}>▾</span>
    </button>
    {open&&<div style={{position:"absolute",top:"calc(100% + 3px)",left:0,right:0,background:C.s1,border:`1px solid ${C.merlot}`,borderRadius:3,zIndex:500,maxHeight:220,overflowY:"auto",boxShadow:"0 8px 24px rgba(0,0,0,0.55)"}}>
      {(opts||[]).map(o=>{const v=o.v??o;const l=o.l??o;const sel=String(v)===strVal;return<div key={String(v)} onClick={()=>{onChange(String(v));setOpen(false);}}
        style={{padding:"9px 12px",...T.m,fontSize:13,color:sel?C.merlot:C.ivory,background:sel?C.merlot+"18":"transparent",cursor:"pointer",transition:"background .1s"}}
        onMouseEnter={e=>e.currentTarget.style.background=sel?C.merlot+"30":C.s2}
        onMouseLeave={e=>e.currentTarget.style.background=sel?C.merlot+"18":"transparent"}>
        {l}
      </div>;})}
    </div>}
  </div>;
}
function DatePicker({value,onChange,lbl,sx={}}){
  const [open,setOpen]=useState(false);
  const parsed=value?new Date(value+'T12:00:00'):null;
  const initV=()=>{const d=parsed||new Date();return{year:d.getFullYear(),month:d.getMonth()};};
  const [view,setView]=useState(initV);
  const ref=useRef(null);
  useEffect(()=>{if(!open)return;const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);},[open]);
  useEffect(()=>{if(parsed)setView({year:parsed.getFullYear(),month:parsed.getMonth()});},[value]);
  const disp=parsed?parsed.toLocaleDateString('cs-CZ',{day:'2-digit',month:'2-digit',year:'numeric'}):'';
  const todayD=new Date();todayD.setHours(0,0,0,0);
  const prevMo=()=>setView(v=>v.month===0?{year:v.year-1,month:11}:{...v,month:v.month-1});
  const nextMo=()=>setView(v=>v.month===11?{year:v.year+1,month:0}:{...v,month:v.month+1});
  const buildDays=()=>{
    const first=new Date(view.year,view.month,1);
    const last=new Date(view.year,view.month+1,0);
    let sd=first.getDay();sd=sd===0?6:sd-1;
    const days=[];
    for(let i=sd;i>0;i--)days.push({d:new Date(view.year,view.month,1-i),cur:false});
    for(let d=1;d<=last.getDate();d++)days.push({d:new Date(view.year,view.month,d),cur:true});
    let n=1;while(days.length%7!==0)days.push({d:new Date(view.year,view.month+1,n++),cur:false});
    return days;
  };
  const pick=d=>{const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');onChange(`${y}-${m}-${day}`);setOpen(false);};
  const MO=['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
  const DY=['po','út','st','čt','pá','so','ne'];
  const btnSx={width:"100%",background:C.s2,border:`1px solid ${open?C.merlot:C.border}`,borderRadius:3,padding:"11px 12px",color:disp?C.ivory:C.dim,...T.m,fontSize:13,boxSizing:"border-box",transition:"border-color .15s",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,...sx};
  return <div ref={ref} style={{position:"relative"}}>
    {lbl&&<Lbl c={lbl}/>}
    <button type="button" onClick={()=>setOpen(p=>!p)} style={btnSx}>
      <span style={{flex:1,textAlign:"left"}}>{disp||<span style={{color:C.dim}}>—</span>}</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={open?C.merlot:C.dim} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </button>
    {open&&<div style={{position:"absolute",top:"calc(100% + 4px)",left:0,zIndex:600,background:C.s1,border:`1px solid ${C.merlot}`,borderRadius:6,padding:"16px",boxShadow:"0 8px 32px rgba(0,0,0,0.7)",minWidth:276,animation:"scaleIn .15s ease"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <button onClick={e=>{e.stopPropagation();prevMo();}} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:3,color:C.dim,cursor:"pointer",padding:"5px 10px",...T.m,fontSize:14,lineHeight:1}}>‹</button>
        <span style={{...T.t,fontSize:15,fontWeight:600,letterSpacing:"0.1em",color:C.ivory,textTransform:"uppercase"}}>{MO[view.month]} {view.year}</span>
        <button onClick={e=>{e.stopPropagation();nextMo();}} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:3,color:C.dim,cursor:"pointer",padding:"5px 10px",...T.m,fontSize:14,lineHeight:1}}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>
        {DY.map(d=><div key={d} style={{...T.m,fontSize:10,color:C.dim,textAlign:"center",padding:"3px 0",letterSpacing:"0.06em"}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
        {buildDays().map((item,i)=>{
          const isSel=parsed&&item.d.toDateString()===parsed.toDateString();
          const isToday=item.d.toDateString()===todayD.toDateString();
          return <button key={i} onClick={e=>{e.stopPropagation();pick(item.d);}}
            style={{background:isSel?C.merlot:"transparent",border:isToday&&!isSel?`1px solid ${C.merlot}55`:"1px solid transparent",borderRadius:3,color:isSel?C.ivory:item.cur?C.ivory:C.dim,cursor:"pointer",padding:"7px 0",...T.m,fontSize:13,textAlign:"center",opacity:item.cur?1:0.4,transition:"background .1s"}}
            onMouseEnter={e=>{if(!isSel)e.currentTarget.style.background=C.s2;}}
            onMouseLeave={e=>{if(!isSel)e.currentTarget.style.background="transparent";}}>
            {item.d.getDate()}
          </button>;
        })}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:12,paddingTop:10,borderTop:`1px solid ${C.border}`}}>

/* ── Context Menu Hook ─────────────────────────────────────────── */
function useCtxMenu(){
  const [m,setM]=useState(null);
  const ref=useRef();
  useEffect(()=>{
    if(!m)return;
    const close=e=>{if(ref.current&&!ref.current.contains(e.target))setM(null);};
    const esc=e=>{if(e.key==="Escape")setM(null);};
    document.addEventListener("pointerdown",close,true);
    document.addEventListener("keydown",esc);
    return()=>{document.removeEventListener("pointerdown",close,true);document.removeEventListener("keydown",esc);};
  },[m]);
  const openMenu=(e,items,opts={})=>{
    e.preventDefault();e.stopPropagation();
    const width=opts.width||190;
    const x0=opts.x!==undefined?opts.x:e.clientX;
    const itemCount=items.filter(i=>!i.sep).length;
    const menuHeight=itemCount*42;
    const y0=opts.y!==undefined?opts.y:(e.clientY-menuHeight/2);
    const x=Math.max(8,Math.min(x0,window.innerWidth-width-16));
    const y=Math.max(8,Math.min(y0,window.innerHeight-menuHeight-16));
    setM({x,y,items});
  };
  const CtxMenu=m?<div ref={ref} style={{position:"fixed",left:m.x,top:m.y,zIndex:9000,background:C.s1,border:`1px solid ${C.bHi}`,borderRadius:4,minWidth:190,boxShadow:"0 20px 60px rgba(0,0,0,.92)",animation:"fadeDown .16s ease",overflow:"hidden"}}>
    {m.items.map((item,i)=>item.sep
      ?<div key={i} style={{height:1,background:C.border,margin:"2px 0"}}/>
      :<button key={i} onClick={()=>{item.a();setM(null);}} style={{display:"block",width:"100%",background:"none",border:"none",padding:"10px 16px",cursor:"pointer",textAlign:"left",...T.m,fontSize:FS.b,color:item.danger?C.merlot:C.ivory,touchAction:"manipulation"}}
        onMouseEnter={e=>e.currentTarget.style.background=C.s2}
        onMouseLeave={e=>e.currentTarget.style.background="none"}
      >{item.l}</button>
    )}
  </div>:null;
  return{openMenu,closeMenu:()=>setM(null),CtxMenu};
}

  const rolePerms=settings.rolePerms||{};

  const getPerms=(role,mod)=>rolePerms[role]?.[mod]||{read:[],write:[]};
  const togglePerm=(role,mod,id,type)=>{
    const curr=getPerms(role,mod);
    const arr=curr[type]||[];
    const next=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];
    const newRolePerms={...rolePerms,[role]:{...rolePerms[role],[mod]:{...curr,[type]:next}}};
    if(type==="read"&&arr.includes(id)){
      newRolePerms[role][mod].write=(newRolePerms[role][mod].write||[]).filter(x=>x!==id);
    }
    if(type==="write"&&!arr.includes(id)){
      newRolePerms[role][mod].read=[...new Set([...(newRolePerms[role][mod].read||[]),id])];
    }
    onSave({...settings,rolePerms:newRolePerms});
  };
  const toggleModule=(role,mod)=>{
    const key=mod+"_visible";
    const curr=(rolePerms[role]||{})[key];
    onSave({...settings,rolePerms:{...rolePerms,[role]:{...(rolePerms[role]||{}),[key]:curr===false}}});
  };
  const isModVisible=(role,mod)=>(rolePerms[role]||{})[mod+"_visible"]!==false;
  const setModulePerms=(role,mod,type)=>{
    const pages=MODULES.find(m=>m.id===mod)?.pages||[];
    const ids=pages.map(p=>p.id);
    const curr=rolePerms[role]||{};
    const newModPerms=type==="none"?{read:[],write:[]}:type==="read"?{read:ids,write:[]}:{read:ids,write:ids};
    onSave({...settings,rolePerms:{...rolePerms,[role]:{...curr,[mod]:newModPerms}}});
  };
  const toggleSpecial=(role,spId)=>{
    const cur=((rolePerms[role]||{}).special)||{};
    onSave({...settings,rolePerms:{...rolePerms,[role]:{...(rolePerms[role]||{}),special:{...cur,[spId]:!cur[spId]}}}});
  };

    {id:"editOutreachStrategy",l:"Outreach strategie",desc:"Může měnit strategické pokyny v Outreach"},

    {id:"viewReports",l:"Detailní reporty",desc:"Přístup k analytickým přehledům a statistikám"},
  ];

    <div style={{...T.m,fontSize:FS.b,color:C.dim,padding:"40px 0",textAlign:"center"}}>

    </div>
  </div>;

  return <div className="anim-fadein">
    {/* Header */}
    <div style={{marginBottom:20}}>
      <div style={{...T.t,fontSize:FS.h,fontWeight:700,letterSpacing:"0.15em",color:C.ivory}}>OPRÁVNĚNÍ</div>
      <div style={{...T.m,fontSize:FS.s,color:C.dim,marginTop:2}}>Nastavení přístupu a speciálních oprávnění pro každou roli</div>
    </div>

    {/* Role tabs */}
    <div style={{display:"flex",gap:6,marginBottom:18,flexWrap:"wrap"}}>
      {allRoles.map(r=>{
        const isSel=selRole===r.v;
        return <button key={r.v} onClick={()=>setSelRole(r.v)}
          style={{...T.m,fontSize:FS.b,padding:"7px 18px",borderRadius:20,cursor:"pointer",
            border:`1px solid ${isSel?C.merlot:C.border}`,
            background:isSel?C.merlot+"22":"transparent",
            color:isSel?C.ivory:C.hi,transition:"all .15s",display:"flex",alignItems:"center",gap:7}}>
          <div style={{width:7,height:7,borderRadius:"50%",background:isSel?C.merlot:C.dim,flexShrink:0,transition:"background .15s"}}/>
          {r.l}
        </button>;
      })}
    </div>

    {/* Legend */}
    <div style={{display:"flex",gap:16,marginBottom:16,alignItems:"center",flexWrap:"wrap"}}>
      <span style={{...T.m,fontSize:9,color:C.dim,letterSpacing:"0.1em",textTransform:"uppercase"}}>Legenda</span>
      {[{c:C.green,l:"Čtení"},{c:C.blue,l:"Úpravy"},{c:C.merlot,l:"Modul viditelný"}].map(it=>

/* ── Drag-and-drop hook ────────────────────────────────────────── */
function useDragSort(items, setItems){
  const [dragIdx, setDragIdx] = useState(null);
  const [overIdx, setOverIdx] = useState(null);
  const dragRef = useRef(null);

  const onDragStart = (e, idx) => {
    dragRef.current = idx;
    setDragIdx(idx);
    e.dataTransfer.effectAllowed = "move";
  };
  const onDragOver  = (e, idx) => { e.preventDefault(); e.dataTransfer.dropEffect="move"; setOverIdx(idx); };
  const onDrop      = (idx) => {
    const from = dragRef.current;
    setDragIdx(null); setOverIdx(null); dragRef.current = null;
    if(from === null || from === idx) return;
    const arr = [...items];
    const [moved] = arr.splice(from, 1);
    arr.splice(idx, 0, moved);
    setItems(arr);
  };
  const onDragEnd   = () => { dragRef.current = null; setDragIdx(null); setOverIdx(null); };

  const rowProps = (idx) => ({
    draggable: true,
    onDragStart: (e) => onDragStart(e, idx),
    onDragOver:  (e) => onDragOver(e, idx),
    onDrop:      () => onDrop(idx),
    onDragEnd:   onDragEnd,
  });

  return { rowProps, overIdx, dragIdx };
}

function VoucherGroupedList({vouchers,filtered,q,rowProps,overIdx,dragIdx,statusC,onEdit,onDup,onDel}){
  // Group by name prefix — everything before the last "-NN" suffix
  const getGroup=code=>{const m=code.match(/^(.*)-\d+$/);return m?m[1]:code;};
  const groups={};
  filtered.forEach(v=>{const g=getGroup(v.code);if(!groups[g])groups[g]=[];groups[g].push(v);});
  const groupNames=Object.keys(groups);
  const [collapsed,setCollapsed]=useState({});
  const toggleGroup=g=>setCollapsed(p=>({...p,[g]:!p[g]}));

  // If searching or all groups have 1 item, flat list
  const useGroups=!q&&groupNames.some(g=>groups[g].length>1);

  if(!useGroups){
    // Flat list
    return <Card>
      {filtered.length===0&&<div style={{padding:"28px 18px",textAlign:"center",...T.m,fontSize:12,color:C.dim}}>Žádná shoda</div>}
      {filtered.map(v=>{
        const idx=vouchers.findIndex(x=>x.id===v.id);
        return <VoucherRow key={v.id} v={v} idx={idx} q={q} rowProps={rowProps} overIdx={overIdx} dragIdx={dragIdx} statusC={statusC} onEdit={onEdit} onDup={onDup} onDel={onDel}/>;
      })}
    </Card>;
  }

  return <div style={{display:"flex",flexDirection:"column",gap:8}}>
    {groupNames.map(g=>{
      const items=groups[g];
      const isOpen=!collapsed[g];
      const isSingle=items.length===1;
      const activeCount=items.filter(v=>v.status==="Aktivní").length;
      if(isSingle){
        const v=items[0];
        const idx=vouchers.findIndex(x=>x.id===v.id);
        return <Card key={g}>
          <VoucherRow v={v} idx={idx} q={q} rowProps={rowProps} overIdx={overIdx} dragIdx={dragIdx} statusC={statusC} onEdit={onEdit} onDup={onDup} onDel={onDel}/>
        </Card>;
      }
      return <Card key={g}>
        {/* Group header */}
        <div onClick={()=>toggleGroup(g)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"13px 18px",cursor:"pointer",borderBottom:isOpen?`1px solid ${C.border}`:"none",userSelect:"none"}}
          onMouseEnter={e=>e.currentTarget.style.background=C.s0}
          onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <span style={{...T.t,fontSize:17,fontWeight:600,letterSpacing:"0.12em",color:C.ivory}}>{g}</span>
            <span style={{...T.m,fontSize:FS.s,color:C.dim,background:C.s2,border:`1px solid ${C.border}`,borderRadius:3,padding:"2px 8px",letterSpacing:"0.08em"}}>{items.length} ks</span>
            {activeCount>0&&<span style={{...T.m,fontSize:FS.s,color:C.green,letterSpacing:"0.08em"}}>{activeCount} aktivních</span>}
          </div>
          <span style={{color:C.dim,fontSize:14,transition:"transform .2s",display:"inline-block",transform:isOpen?"rotate(180deg)":"rotate(0)"}}>▾</span>
        </div>
        {/* Group rows */}
        {isOpen&&items.map(v=>{
          const idx=vouchers.findIndex(x=>x.id===v.id);
          return <VoucherRow key={v.id} v={v} idx={idx} q={q} rowProps={rowProps} overIdx={overIdx} dragIdx={dragIdx} statusC={statusC} onEdit={onEdit} onDup={onDup} onDel={onDel} indent/>;
        })}
      </Card>;
    })}
  </div>;
}

function VoucherRow({v,idx,q,rowProps,overIdx,dragIdx,statusC,onEdit,onDup,onDel,indent=false}){
  const {openMenu,CtxMenu}=useCtxMenu();
  return <><div {...(q?"":rowProps(idx))}
    onContextMenu={e=>openMenu(e,[{l:"Upravit",a:()=>onEdit(v)},{l:"Duplikovat",a:()=>onDup(v)},{sep:true},{l:"Smazat",a:()=>onDel(v.id),danger:true}])}
    style={{display:"flex",alignItems:"center",padding:`11px ${indent?"28px":"18px"}`,borderBottom:`1px solid ${C.border}`,background:dragIdx===idx?"#3a0a0a":overIdx===idx&&dragIdx!==idx&&!q?"#0d0d18":"transparent",opacity:dragIdx===idx?0.45:1,borderTop:overIdx===idx&&dragIdx!==idx&&!q?`2px solid ${C.merlot}`:"none",transition:"background .12s, opacity .12s",cursor:q?"default":"grab",gap:8}}>
    {!q&&<span style={{color:C.dim,fontSize:14,marginRight:8,cursor:"grab",userSelect:"none",flexShrink:0}}>⠿</span>}
    <div style={{flex:1,minWidth:0}}>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <div style={{...T.t,fontSize:15,fontWeight:600,letterSpacing:"0.1em",color:C.ivory}}>{v.code}</div>
        <span style={{...T.m,fontSize:FS.s,fontWeight:300,letterSpacing:"0.1em",textTransform:"uppercase",color:statusC[v.status]||C.hi,background:"transparent",border:`1px solid ${statusC[v.status]||C.border}`,borderRadius:3,padding:"1px 7px"}}>{v.status}</span>
        <span style={{...T.m,fontSize:FS.b,color:C.ivory,fontWeight:500}}>{v.type==="pct"?v.value+"%":new Intl.NumberFormat("cs-CZ",{style:"currency",currency:"CZK",maximumFractionDigits:0}).format(v.value)} sleva</span>
        {v.validTo&&<span style={{...T.m,fontSize:FS.b,color:C.dim}}>do {v.validTo.slice(0,7)}</span>}
      </div>
      {v.name&&<div style={{...T.m,fontSize:FS.b,color:C.dim,marginTop:2}}>{v.name}</div>}
    </div>
  </div>{CtxMenu}</>;
}

function ClientsView({clients,setClients,invoices,timeEntries,projects,settings,confirmFn,onNewInvoice,setIncomes}){
  const blank={id:uid(),name:"",company:"",street:"",city:"",zip:"",country:"Česká republika",ico:"",dic:"",email:"",phone:"",web:"",notes:"",startDate:toDay(),billingRate:0,budgetRate:0,budgetCurrency:"CZK",potential:50,komunikace:50};
  const [ed,setEd]=useState(null);
  const [f,setF]=useState(null);

  const [detail,setDetail]=useState(null);

    setClients(ed==="new"?[...clients,f]:clients.map(c=>c.id===ed?f:c));

  const toggleCl=id=>setClients(clients.map(c=>c.id===id?{...c,active:c.active===false?true:false}:c));
  const {rowProps,overIdx,dragIdx}=useDragSort(clients,setClients);
  const filtered=q?clients.filter(x=>(x.name+x.company+x.email).toLowerCase().includes(q.toLowerCase())):clients;

  // ── Client detail calculations ──
  const detailClient=detail?clients.find(c=>c.id===detail):null;
  const clientInv=detail?(invoices||[]).filter(i=>(i.client?.id===detail||i.clientId===detail)):[];
  const clientProjs=detail?(projects||[]).filter(p=>p.clientId===detail):[];
  const clientProjIds=clientProjs.map(p=>p.id);
  const clientEntries=detail?(timeEntries||[]).filter(e=>clientProjIds.includes(e.projectId)):[];
  const now=new Date(),yr=now.getFullYear();

  const totalInvoiced=clientInv.filter(i=>["Zaplaceno","Odesláno","Po splatnosti"].includes(i.status)).reduce((s,i)=>s+calcInv(i.items,i.vatEnabled,i.vatRate,i.discount).tot,0);
  const totalPaid=clientInv.filter(i=>i.status==="Zaplaceno").reduce((s,i)=>s+calcInv(i.items,i.vatEnabled,i.vatRate,i.discount).tot,0);
  const totalPending=clientInv.filter(i=>["Odesláno","Po splatnosti"].includes(i.status)).reduce((s,i)=>s+calcInv(i.items,i.vatEnabled,i.vatRate,i.discount).tot,0);
  const avgInv=clientInv.length>0?totalInvoiced/clientInv.length:0;
  const totalHours=clientEntries.reduce((s,e)=>s+(e.minutes||0),0);
  const totalHoursVal=clientEntries.reduce((s,e)=>s+calcEntryVal(e,settings.people||[]),0);
  const unbilledEntries=clientEntries.filter(e=>!e.billed);
  const unbilledVal=unbilledEntries.reduce((s,e)=>s+calcEntryVal(e,settings.people||[]),0);
  const unbilledMins=unbilledEntries.reduce((s,e)=>s+(e.minutes||0),0);

  // Collaboration duration
  const collabStart=detailClient?.startDate||clientInv.sort((a,b)=>a.issueDate>b.issueDate?1:-1)[0]?.issueDate;
  const collabMonths=collabStart?Math.max(1,Math.round((new Date()-new Date(collabStart))/(1000*60*60*24*30.4))):0;

  // Monthly revenue for this client (last 12 months)
  const moRev=Array.from({length:12},(_,i)=>{
    const d=new Date(now);d.setMonth(d.getMonth()-11+i);
    const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    return clientInv.filter(x=>["Zaplaceno","Odesláno"].includes(x.status)&&(x.issueDate||"").startsWith(k)).reduce((s,inv)=>s+calcInv(inv.items,inv.vatEnabled,inv.vatRate,inv.discount).tot,0);
  });
  const moLabels=Array.from({length:12},(_,i)=>{const d=new Date(now);d.setMonth(d.getMonth()-11+i);return MO_NAMES[d.getMonth()];});

  if(detail&&detailClient)return(
    <div className="anim-fadein">
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:24,flexWrap:"wrap"}}>

        <div style={{flex:1}}>
          <div style={{...T.t,fontSize:FS.h,fontWeight:700,letterSpacing:"0.12em",color:C.ivory}}>{detailClient.company||detailClient.name}</div>

        </div>
        <Btn ch="Upravit" onClick={()=>{setF({...detailClient});setEd(detailClient.id);}} v="g" sx={{padding:"7px 14px"}}/>
        {onNewInvoice&&<Btn ch="+ Faktura" onClick={()=>onNewInvoice(detailClient)} sx={{padding:"7px 14px"}}/>}
        <Btn ch="× Smazat" onClick={()=>del(detailClient.id)} v="d" sx={{padding:"7px 14px"}}/>
      </div>

      {/* ── Dluh klienta panel ── */}
      {(unbilledVal>0||totalPending>0)&&<div style={{marginBottom:16,padding:"14px 18px",borderRadius:6,
        background:"#120a06",border:`2px solid ${C.merlot}`,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
        <div>
          <div style={{...T.m,fontSize:FS.s,letterSpacing:"0.14em",textTransform:"uppercase",color:C.merlot,marginBottom:4}}>Dluh klienta</div>
          <div style={{...T.t,fontSize:"clamp(22px,4vw,34px)",fontWeight:300,color:C.merlot,lineHeight:1}}>{FMT(unbilledVal+totalPending)}</div>
        </div>
        <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
          {unbilledVal>0&&<div style={{textAlign:"center"}}>
            <div style={{...T.m,fontSize:FS.s,color:C.dim,marginBottom:2}}>Nevyfakturováno</div>
            <div style={{...T.t,fontSize:18,fontWeight:300,color:C.amber}}>{FMT(unbilledVal)}</div>

              {showDirectIncome

        const ltvScore=Math.min(100,Math.round((totalInvoiced+unbilledVal)/10000));
        // Aktivita: průměrná mezera mezi záznamy práce a faktur (nižší = lepší)
        const actDates=[...clientEntries.map(e=>e.date),...clientInv.map(i=>i.issueDate)].filter(Boolean).sort();
        let actScore=0;
        if(actDates.length>=2){
          const gaps=actDates.slice(1).map((d,i)=>Math.max(0,(new Date(d)-new Date(actDates[i]))/(86400000)));
          const avgGap=gaps.reduce((s,g)=>s+g,0)/gaps.length;
          actScore=Math.max(0,Math.min(100,Math.round((1-avgGap/30)*100)));
        } else if(actDates.length===1){
          const daysSince=(new Date()-new Date(actDates[0]))/86400000;
          actScore=Math.max(0,Math.round((1-daysSince/60)*100));
        }
        // Potenciál: manuální hodnota
        const potScore=detailClient.potential??50;
        // Věrnost: délka spolupráce / 420 dní
        const collabDays=collabStart?Math.floor((new Date()-new Date(collabStart))/86400000):0;
        const loyalScore=Math.min(100,Math.round(collabDays/420*100));
        // Komunikace: manuální hodnota
        const komScore=detailClient.komunikace??50;
        const axes=[
          {label:"Příjmy",score:ltvScore},
          {label:"Aktivita",score:actScore},
          {label:"Potenciál",score:potScore},
          {label:"Věrnost",score:loyalScore},
          {label:"Komunikace",score:komScore},
        ];
        const N=axes.length,sz=280,cx=sz/2,cy=sz/2,r=96;
        const ang=i=>(2*Math.PI*i/N)-Math.PI/2;
        const pt=(i,pct)=>[cx+Math.cos(ang(i))*r*pct,cy+Math.sin(ang(i))*r*pct];
        const poly=pts=>pts.map(p=>p.join(",")).join(" ");
        const gridLevels=[0.25,0.5,0.75,1];
        const dataPoints=axes.map((_,i)=>pt(i,axes[i].score/100));
        const overallScore=Math.round(axes.reduce((s,a)=>s+a.score,0)/N);
        const scoreLabel=overallScore>=70?"Výborný":overallScore>=40?"Průměrný":"Potřebuje pozornost";
        return <Card sx={{marginBottom:16,padding:"18px 20px"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
            <span style={{...T.t,fontSize:14,fontWeight:600,letterSpacing:"0.12em",color:C.ivory,textTransform:"uppercase"}}>Profil spolupráce</span>
            <span style={{...T.m,fontSize:10,color:C.merlot,background:C.merlot+"1a",border:`1px solid ${C.merlot}44`,borderRadius:3,padding:"2px 9px",letterSpacing:"0.1em",textTransform:"uppercase",marginLeft:"auto"}}>{scoreLabel}</span>
          </div>
          <div style={{display:"flex",gap:48,alignItems:"center"}}>
            <svg width={sz} height={205} viewBox="-30 5 340 248" style={{flexShrink:0,overflow:"visible"}}>
              {/* Outer grid rings */}
              {gridLevels.map(l=><polygon key={l}
                points={poly(Array.from({length:N},(_,i)=>pt(i,l)))}
                fill="none" stroke={C.merlot+(l===1?"30":"18")} strokeWidth={l===1?1:0.5} strokeDasharray={l===1?"none":"4,3"}/>)}
              {/* Axes */}
              {axes.map((_,i)=>{const[x,y]=pt(i,1);return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={C.merlot+"28"} strokeWidth="1"/>;} )}
              {/* Data fill polygon */}
              <polygon points={poly(dataPoints)} fill={C.merlot+"20"} stroke={C.merlot+"88"} strokeWidth="1.5" strokeLinejoin="round"/>
              {/* Data dots — only when score > 0 */}
              {dataPoints.map(([x,y],i)=>axes[i].score>0
                ?<circle key={i} cx={x} cy={y} r="4" fill={C.merlot} stroke={C.s1} strokeWidth="1.5"/>
                :null)}
              {/* Labels */}
              {axes.map((a,i)=>{
                const la=ang(i);const lx=cx+Math.cos(la)*(r+28);const ly=cy+Math.sin(la)*(r+28);
                const anchor=lx<cx-6?"end":lx>cx+6?"start":"middle";
                return <text key={i} x={lx} y={ly} textAnchor={anchor} dominantBaseline="middle" fontSize="11" fill={C.dim} fontFamily="Montserrat,sans-serif">{a.label}</text>;
              })}
              {/* Score pentagon on top of everything */}
              <polygon points={poly(Array.from({length:N},(_,i)=>pt(i,Math.max(0.04,overallScore/100))))}
                fill={C.merlot+"55"} stroke={C.merlot} strokeWidth="1.5" strokeLinejoin="round"/>
              {/* Score number centered — rendered last, always on top */}
              <text x={cx} y={cy} textAnchor="middle" dominantBaseline="central" fontSize="28" fontWeight="600" fill={C.merlot} fontFamily="Teko,sans-serif">{overallScore}</text>
            </svg>
            {/* Metric list + inline manual sliders */}
            <div style={{flex:1,display:"flex",flexDirection:"column",gap:12}}>
              {axes.map(a=>{
                const isManual=a.label==="Potenciál"||a.label==="Komunikace";
                const manualKey=a.label==="Potenciál"?"potential":"komunikace";
                return <div key={a.label}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <span style={{...T.m,fontSize:FS.s,color:C.dim}}>{a.label}</span>
                    <span style={{...T.m,fontSize:FS.s,color:C.merlot,fontWeight:600}}>{a.score}</span>
                  </div>
                  {isManual
                    ?<input type="range" min="0" max="100" value={a.score}
                        onChange={e=>setClients(cl=>cl.map(c=>c.id===detail?{...c,[manualKey]:Number(e.target.value)}:c))}
                        className="profile-slider"
                        style={{background:`linear-gradient(to right,${C.merlot}b3 0%,${C.merlot}b3 ${a.score}%,${C.s2} ${a.score}%,${C.s2} 100%)`}}/>
                    :<div style={{height:3,background:C.s2,borderRadius:2}}>
                        <div style={{height:"100%",width:a.score+"%",background:C.merlot,borderRadius:2,opacity:0.7,transition:"width .5s ease"}}/>
                      </div>}
                </div>;
              })}
            </div>
          </div>
        </Card>;
      })()}

      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}} className="grid-kpi">
        {[
          {l:"Celkem fakturováno",v:totalInvoiced,c:C.green},
          {l:"Zaplaceno",v:totalPaid,c:C.green},
          {l:"Čeká na platbu",v:totalPending,c:C.merlot},
          {l:"Průměrná faktura",v:avgInv,c:C.ivory},
          {l:"Odpracované hodiny",v:null,c:C.blue,txt:fmtMins(totalHours)},
          {l:"Hodnota hodin",v:totalHoursVal,c:C.blue},
        ].map(k=><Card key={k.l} sx={{padding:"12px 16px"}}>
          <Lbl c={k.l} s={{fontSize:FS.s,marginBottom:4}}/>
          <div style={{...T.t,fontSize:FS.h,fontWeight:300,color:k.c,lineHeight:1}}>{k.txt||FMT(k.v)}</div>
        </Card>)}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}} className="grid-fin-2">
        <Card sx={{padding:"16px 18px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <SH c="Fakturace posledních 12 měsíců"/>
            {collabMonths>0&&<span style={{...T.m,fontSize:FS.s,color:C.dim}}>Spolupráce: {collabMonths} měs.</span>}
          </div>
          {moRev.some(v=>v>0)
            ?<AreaChart series={[{label:"Fakturace",color:C.green,values:moRev}]} labels={moLabels} height={120}/>
            :<div style={{...T.m,fontSize:FS.s,color:C.dim,padding:"20px 0",textAlign:"center"}}>Zatím žádné faktury</div>}
        </Card>
        <Card sx={{padding:"16px 18px"}}>
          <SH c="Informace"/>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {[
              {l:"Firma",v:detailClient.company},
              {l:"Kontakt",v:detailClient.name},
              {l:"IČO",v:detailClient.ico},
              {l:"DIČ",v:detailClient.dic},
              {l:"Adresa",v:[detailClient.street,[detailClient.zip,detailClient.city].filter(Boolean).join(" ")].filter(Boolean).join(", ")},
              {l:"E-mail",v:detailClient.email},
              {l:"Telefon",v:detailClient.phone},
              {l:"Web",v:detailClient.web},
            ].filter(x=>x.v).map(x=><div key={x.l} style={{display:"flex",gap:12,alignItems:"baseline"}}>
              <span style={{...T.m,fontSize:FS.s,color:C.dim,minWidth:70,flexShrink:0}}>{x.l}</span>
              <span style={{...T.m,fontSize:FS.b,color:C.ivory}}>{x.v}</span>
            </div>)}
          </div>
        </Card>
      </div>

      {clientProjs.length>0&&<Card sx={{padding:"14px 18px",marginBottom:12}}>
        <SH c="Projekty"/>
        {clientProjs.map(p=>{
          const pEntries=clientEntries.filter(e=>e.projectId===p.id);
          const pMins=pEntries.reduce((s,e)=>s+(e.minutes||0),0);
          const pVal=pEntries.reduce((s,e)=>s+calcEntryVal(e,settings.people||[]),0);
          return <div key={p.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:p.color||C.merlot,flexShrink:0}}/>
            <div style={{flex:1}}>
              <div style={{...T.m,fontSize:FS.b,color:C.ivory}}>{p.name}</div>
              <div style={{...T.m,fontSize:FS.s,color:C.dim}}>{p.status}</div>
            </div>
            {pMins>0&&<span style={{...T.m,fontSize:FS.s,color:C.blue}}>{fmtMins(pMins)} · {FMT(pVal)}</span>}
          </div>;
        })}
      </Card>}

      {clientInv.length>0&&<Card sx={{padding:"14px 18px"}}>
        <SH c={"Faktury ("+clientInv.length+")"}/>
        {clientInv.sort((a,b)=>b.issueDate>a.issueDate?1:-1).slice(0,8).map(inv=>{
          const tot=calcInv(inv.items,inv.vatEnabled,inv.vatRate,inv.discount).tot;
          const col=inv.status==="Zaplaceno"?C.green:inv.status==="Po splatnosti"?C.merlot:C.hi;
          return <div key={inv.id} style={{display:"flex",alignItems:"center",gap:12,padding:"9px 0",borderBottom:`1px solid ${C.border}`}}>
            <div style={{flex:1}}>
              <span style={{...T.m,fontSize:FS.b,color:C.ivory}}>{inv.number}</span>
              <span style={{...T.m,fontSize:FS.s,color:C.dim,marginLeft:12}}>{fmtD(inv.issueDate)}</span>
            </div>
            <span style={{...T.m,fontSize:FS.s,padding:"2px 8px",borderRadius:10,background:col+"22",color:col}}>{inv.status}</span>
            <span style={{...T.t,fontSize:FS.b,fontWeight:300,color:col}}>{FMT(tot)}</span>
          </div>;
        })}
        {clientInv.length>8&&<div style={{...T.m,fontSize:FS.s,color:C.dim,marginTop:8,textAlign:"center"}}>+{clientInv.length-8} dalších faktur</div>}
      </Card>}

      {detailClient.notes&&<Card sx={{padding:"14px 18px",marginTop:12}}>
        <SH c="Interní poznámky"/>
        <div style={{...T.m,fontSize:FS.b,color:C.hi,lineHeight:1.7}}>{detailClient.notes}</div>
      </Card>}
    </div>
  );

  return <div className="anim-fadein">
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
      <div>
        <div style={{...T.t,fontSize:FS.h,fontWeight:700,letterSpacing:"0.15em",color:C.ivory}}>KLIENTI</div>
        <div style={{...T.m,fontSize:FS.s,color:C.dim,marginTop:2}}>Adresář a přehled klientů</div>
      </div>
      <Btn ch="+ Přidat klienta" onClick={()=>{setF({...blank});setEd("new");}}/>
    </div>
    {(()=>{
      const activeClients=clients.filter(c=>c.active!==false);
      const allClientProjIds=(projects||[]).map(p=>p.id);
      const totalMins=(timeEntries||[]).filter(e=>!e.isPause&&allClientProjIds.includes(e.projectId)).reduce((s,e)=>s+(e.minutes||0),0);
      const totalOwed=(invoices||[]).filter(i=>["Odesláno","Po splatnosti"].includes(i.status)).reduce((s,i)=>s+calcInv(i.items,i.vatEnabled,i.vatRate,i.discount).tot,0);
      const totalPaid=(invoices||[]).filter(i=>i.status==="Zaplaceno").reduce((s,i)=>s+calcInv(i.items,i.vatEnabled,i.vatRate,i.discount).tot,0);
      return <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:18}}>
        {[
          {l:"Klientů",v:String(activeClients.length),c:C.ivory,icon:<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>},
          {l:"Odpracováno",v:fmtMins(totalMins)||"—",c:C.blue,icon:<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>},
          {l:"Dluží nám",v:FMT(totalOwed),c:totalOwed>0?C.merlot:C.dim,icon:<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>},
          {l:"Zaplaceno celkem",v:FMT(totalPaid),c:C.green,icon:<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>},
        ].map(s=><div key={s.l} style={{background:C.s1,border:`1px solid ${C.border}`,borderRadius:6,overflow:"hidden",display:"flex"}}>
          <div style={{flex:1,padding:"14px 16px"}}>
            <div style={{...T.m,fontSize:8,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6}}>{s.l}</div>
            <div style={{...T.t,fontSize:26,fontWeight:700,color:s.c,lineHeight:1}}>{s.v}</div>
          </div>
          <div style={{width:50,display:"flex",alignItems:"center",justifyContent:"center",color:C.dim,borderLeft:`1px solid ${C.border}`,flexShrink:0}}>{s.icon}</div>
        </div>)}
      </div>;
    })()}
    <div style={{marginBottom:14}}><SearchBar value={q} onChange={setQ} ph="Hledat klienta…"/></div>
    {ed&&f&&<Card sx={{padding:20,marginBottom:18,borderColor:C.mBorder,animation:"scaleIn .22s cubic-bezier(.22,1,.36,1)"}}>
      <SH c={ed==="new"?"Nový klient":"Upravit klienta"}/>
      <div className="grid-2-inp">
        <Inp lbl="Jméno" val={f.name} onChange={u("name")} ph="Jan Novák"/>
        <Inp lbl="Firma" val={f.company} onChange={u("company")} ph="Firma s.r.o."/>
        <Inp lbl="Ulice" val={f.street} onChange={u("street")}/>
        <Inp lbl="Město" val={f.city} onChange={u("city")}/>
        <Inp lbl="PSČ" val={f.zip} onChange={u("zip")}/>
        <Inp lbl="Stát" val={f.country} onChange={u("country")}/>
        <Inp lbl="IČO" val={f.ico} onChange={u("ico")}/>
        <Inp lbl="DIČ" val={f.dic} onChange={u("dic")}/>
        <Inp lbl="E-mail" type="email" val={f.email} onChange={u("email")}/>
        <Inp lbl="Telefon" val={f.phone} onChange={u("phone")}/>
        <Inp lbl="Web" val={f.web} onChange={u("web")} ph="www.firma.cz"/>
        <Inp lbl="Datum začátku spolupráce" type="date" val={f.startDate} onChange={u("startDate")}/>
        <Inp lbl="Hodinová sazba klienta (Kč/h)" type="number" val={f.billingRate||0} onChange={v=>u("billingRate")(+v)} ph="0"/>
        <div style={{gridColumn:"1/-1"}}><Inp lbl="Interní poznámky" val={f.notes} onChange={u("notes")} ml ph="Poznámky pro interní potřebu…"/></div>
      </div>
      <div style={{display:"flex",gap:10,marginTop:16}}>
        <Btn ch="Uložit" onClick={save}/>
        <Btn ch="Zrušit" onClick={()=>{setEd(null);setF(null);}} v="g"/>
      </div>
    </Card>}
    {clients.length===0&&!ed
      ?<div style={{border:`1px dashed ${C.border}`,borderRadius:4,padding:"56px 0",textAlign:"center"}}>
        <div style={{...T.t,fontSize:FS.h,letterSpacing:"0.2em",color:C.dim,marginBottom:8}}>ŽÁDNÍ KLIENTI</div>
        <div style={{...T.m,fontSize:FS.b,color:C.dim,marginBottom:20}}>Ulož klienty pro rychlé vyplnění faktur</div>
        <Btn ch="+ Přidat klienta" onClick={()=>{setF({...blank});setEd("new");}}/>
      </div>
      :<>
        {filtered.length===0&&<div style={{...T.m,fontSize:FS.b,color:C.dim,padding:"28px 0",textAlign:"center"}}>Žádná shoda pro "{q}"</div>}
        {filtered.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}} className="grid-clients">
          {filtered.map((cl)=>{
            const clInvs=(invoices||[]).filter(i=>i.client?.id===cl.id||i.clientId===cl.id);
            const clInvCount=clInvs.length;
            const clRevenue=clInvs.filter(i=>["Zaplaceno","Odesláno"].includes(i.status)).reduce((s,i)=>s+calcInv(i.items,i.vatEnabled,i.vatRate,i.discount).tot,0);
            const paidCount=clInvs.filter(i=>i.status==="Zaplaceno").length;
            const payRate=clInvCount>0?Math.round(paidCount/clInvCount*100):null;
            const clPending=clInvs.filter(i=>["Odesláno","Po splatnosti"].includes(i.status)).reduce((s,i)=>s+calcInv(i.items,i.vatEnabled,i.vatRate,i.discount).tot,0);
            const lastInvDate=clInvs.sort((a,b)=>b.issueDate>a.issueDate?1:-1)[0]?.issueDate;
            const daysSince=lastInvDate?Math.floor((new Date()-new Date(lastInvDate))/(1000*60*60*24)):null;
            const actColor=daysSince===null?C.dim:daysSince<30?C.green:daysSince<90?C.amber:C.merlot;
            const clearNew=()=>setClients(clients.map(c=>c.id===cl.id?{...c,isNew:false}:c));
            const openDetail=()=>{setDetail(cl.id);if(cl.isNew)clearNew();};
            const openEdit=()=>{setEd(cl.id);setF({...cl});if(cl.isNew)clearNew();};
            const actLabel=daysSince===null?null:daysSince===0?"dnes":daysSince<30?daysSince+"d":daysSince<365?Math.floor(daysSince/30)+"m":Math.floor(daysSince/365)+"r";
            return <div key={cl.id}
              onClick={openDetail}
              onContextMenu={e=>openMenu(e,[{l:"Otevřít detail",a:openDetail},{l:"Upravit klienta",a:openEdit},{l:cl.active===false?"Aktivovat klienta":"Deaktivovat klienta",a:()=>toggleCl(cl.id)},{sep:true},{l:"Smazat klienta",a:()=>del(cl.id),danger:true}])}
              style={{background:C.s1,border:`1px solid ${C.border}`,borderRadius:4,cursor:"pointer",overflow:"hidden",transition:"border-color .15s",display:"flex",opacity:cl.active===false?0.5:1}}
              onMouseEnter={e=>e.currentTarget.style.borderColor=C.bHi}
              onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
              <div style={{width:3,background:actColor,flexShrink:0}}/>
              <div style={{flex:1,padding:"14px 16px 14px",minWidth:0}}>
                <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8,marginBottom:2}}>
                  <div style={{...T.t,fontSize:18,fontWeight:600,letterSpacing:"0.06em",color:C.ivory,lineHeight:1.2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cl.company||cl.name}</div>
                  {cl.isNew&&<span style={{...T.m,fontSize:9,fontWeight:600,letterSpacing:"0.12em",color:C.green,background:C.greenBg,border:`1px solid ${C.greenBorder}`,borderRadius:3,padding:"2px 6px",textTransform:"uppercase",flexShrink:0}}>Nový</span>}
                </div>
                {cl.company&&cl.name&&<div style={{...T.m,fontSize:FS.s,color:C.dim,marginBottom:8,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cl.name}</div>}
                {clRevenue>0&&<div style={{...T.t,fontSize:20,fontWeight:300,color:C.green,lineHeight:1,marginBottom:10}}>{FMT(clRevenue)}</div>}
                <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                  {clPending>0
                    ?<span style={{...T.m,fontSize:10,color:C.dim,textTransform:"uppercase",letterSpacing:"0.08em"}}>Příchozí&nbsp;<span style={{...T.t,fontSize:14,fontWeight:300,color:C.merlot}}>{FMT(clPending)}</span></span>
                    :clInvCount>0&&<span style={{...T.m,fontSize:10,color:C.green,letterSpacing:"0.06em"}}>Vyrovnáno</span>}
                </div>
              </div>
            </div>;
          })}
        </div>}
      </>}
  {CtxMenu}</div>;
}


function EditorView({inv:init,clients,templateItems,vouchers,settings,onSave,onCancel,onPrint}){
  const [inv,setInv]=useState(init);
  const [clientOpen,setClientOpen]=useState(false);
  const [tplOpen,setTplOpen]=useState(false);
  const u=k=>v=>setInv(p=>({...p,[k]:v}));
  const uc=k=>v=>setInv(p=>({...p,client:{...p.client,[k]:v}}));
  const ui=(id,k,v)=>setInv(p=>({...p,items:p.items.map(i=>i.id===id?{...i,[k]:v}:i)}));
  const ai=()=>setInv(p=>({...p,items:[...p.items,{id:uid(),description:"",qty:1,unit:"ks",unitPrice:0}]}));
  const addTpl=tpl=>setInv(p=>({...p,items:[...p.items,{id:uid(),description:tpl.description,qty:1,unit:tpl.unit,unitPrice:tpl.unitPrice}]}));
  const di=id=>setInv(p=>({...p,items:p.items.filter(i=>i.id!==id)}));
  const disc=inv.discount||{enabled:false,type:"pct",value:0};
  const c=calcInv(inv.items,inv.vatEnabled,inv.vatRate,disc);

  return <div className="anim-fadein">

              {/* Voucher picker */}

          <div style={{gridColumn:"1/-1"}}><Inp lbl="Telefon" val={inv.client?.phone} onChange={uc("phone")} ph="+420"/></div>

    {/* Items */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>

    <div className="tbl-wrap" style={{marginBottom:18}}>
      <div style={{minWidth:500}}>
        <Card sx={{overflow:"hidden"}}>

            {["Popis","Počet","Jednotka","Cena/ks","Celkem",""].map((h,i)=><div key={i} style={{...T.m,fontSize:FS.s,letterSpacing:"0.14em",textTransform:"uppercase",color:C.dim}}>{h}</div>)}
          </div>
          {inv.items.length===0&&<div style={{padding:20,textAlign:"center",...T.m,fontSize:12,color:C.dim}}>Zatím žádné položky</div>}
          {inv.items.map(item=>{
            const total=(item.qty||0)*(item.unitPrice||0);
            return <div key={item.id} style={{display:"grid",gridTemplateColumns:"1fr 64px 80px 110px 90px 32px",padding:"8px 12px",borderBottom:`1px solid ${C.border}`,alignItems:"center",gap:6}}>

              <input type="number" min="0" step="0.5" value={item.qty} onChange={e=>ui(item.id,"qty",+e.target.value)} style={{background:C.s0,border:`1px solid ${C.border}`,borderRadius:3,padding:"8px 6px",color:C.ivory,...T.m,fontSize:12,outline:"none",width:"100%",textAlign:"center"}}/>
              <Sel value={item.unit} onChange={v=>ui(item.id,"unit",v)} opts={UNITS.map(u=>({v:u,l:u}))} sx={{background:C.s0,borderRadius:3,padding:"8px 6px",fontSize:12}}/>
              <input type="number" min="0" value={item.unitPrice} onChange={e=>ui(item.id,"unitPrice",+e.target.value)} style={{background:C.s0,border:`1px solid ${C.border}`,borderRadius:3,padding:"8px 6px",color:C.ivory,...T.m,fontSize:12,outline:"none",width:"100%",textAlign:"right"}}/>

    {/* Totals box */}
    {inv.items.length>0&&<div style={{display:"flex",justifyContent:"flex-end",marginBottom:22}}>
      <Card sx={{padding:"18px 22px",minWidth:270}}>
        {/* Rows */}
        <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:12}}>
          {c.discountAmt>0&&<>
            <div style={{display:"flex",justifyContent:"space-between",...T.m,fontSize:FS.b,color:C.hi}}><span>Mezisoučet</span><span>{fmt(c.subtotal)}</span></div>
            <div style={{display:"flex",justifyContent:"space-between",...T.m,fontSize:FS.b,color:C.amber}}><span>Sleva {disc.type==="pct"?`(${disc.value}%)`:`(${fmt(disc.value)})`}</span><span>−{fmt(c.discountAmt)}</span></div>
          </>}

            <div style={{display:"flex",justifyContent:"space-between",...T.m,fontSize:FS.b,color:C.hi}}><span>Základ DPH {inv.vatRate??21}%</span><span>{fmt(c.base)}</span></div>

    <div style={{display:"flex",gap:8,paddingTop:18,borderTop:`1px solid ${C.border}`,flexWrap:"wrap"}}>
      <Btn ch="Uložit" onClick={()=>{onSave(inv);onCancel();}}/>

      <Btn ch="Náhled PDF" onClick={()=>onPrint(inv)} v="g"/>
      <Btn ch="← Zpět" onClick={onCancel} v="g" sx={{marginLeft:"auto"}}/>

  </div>;
}

/* ── Archive ───────────────────────────────────────────────────── */
function ArchiveView({invoices,settings,onNew,onEdit,onView,onDup,onStatus,onDelete,confirmFn}){
  const [filter,setFilter]=useState("Vše");
  const {openMenu,CtxMenu}=useCtxMenu();
  const yr=new Date().getFullYear();
  const yI=invoices.filter(i=>i.issueDate?.startsWith(String(yr)));
  const geff=inv=>inv.status==="Odesláno"&&inv.dueDate&&new Date(inv.dueDate)<new Date()?"Po splatnosti":inv.status;
  const getC=inv=>calcInv(inv.items,inv.vatEnabled,inv.vatRate,inv.discount);
  const stats=[
    {l:`Fakturováno ${yr}`,v:yI.reduce((s,i)=>s+getC(i).tot,0),c:C.ivory},
    {l:"Zaplaceno",v:yI.filter(i=>i.status==="Zaplaceno").reduce((s,i)=>s+getC(i).tot,0),c:C.green},
    {l:"Čeká",v:yI.filter(i=>["Odesláno","Po splatnosti"].includes(i.status)).reduce((s,i)=>s+getC(i).tot,0),c:C.blue},
    {l:"Koncepty",v:yI.filter(i=>i.status==="Koncept").length,c:C.dim,cnt:true}
  ];
  const filtered=filter==="Vše"?invoices:filter==="Po splatnosti"?invoices.filter(i=>geff(i)==="Po splatnosti"):invoices.filter(i=>i.status===filter);
  const del=async id=>{
    const inv=invoices.find(i=>i.id===id);
    const ok=await confirmFn(`Smazat fakturu ${inv?.number||""}?\nTato akce je nevratná.`);
    if(ok)onDelete(id);
  };
  return <div className="anim-fadein">
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
      <div style={{...T.t,fontSize:28,fontWeight:700,letterSpacing:"0.14em",color:C.ivory}}>FAKTURY</div>
      <Btn ch="+ Nová faktura" onClick={onNew} sx={{padding:"9px 18px"}}/>
    </div>
    <div className="grid-4" style={{marginBottom:24}}>
      {stats.map(s=><Card key={s.l} sx={{padding:"14px 18px"}}>
        <Lbl c={s.l} s={{marginBottom:6}}/>
        <div style={{...T.t,fontSize:s.cnt?28:26,fontWeight:600,color:s.c,lineHeight:1.1}}>{s.cnt?s.v+" ks":fmt(s.v)}</div>
      </Card>)}
    </div>
    <div style={{display:"flex",gap:4,overflowX:"auto",paddingBottom:4,WebkitOverflowScrolling:"touch",marginBottom:12}}>
      {["Vše","Koncept","Odesláno","Zaplaceno","Po splatnosti","Storno"].map(f=>(
        <button key={f} onClick={()=>setFilter(f)} style={{background:filter===f?C.merlot:"transparent",border:`1px solid ${filter===f?C.merlot:C.border}`,borderRadius:3,padding:"7px 12px",cursor:"pointer",...T.m,fontSize:FS.s,fontWeight:filter===f?500:400,letterSpacing:"0.12em",textTransform:"uppercase",color:filter===f?C.ivory:C.dim,whiteSpace:"nowrap",transition:"all .15s",touchAction:"manipulation"}}>{f}</button>
      ))}
    </div>
    {filtered.length===0
      ?<div style={{border:`1px dashed ${C.border}`,borderRadius:4,padding:"64px 0",textAlign:"center"}}>
        <div style={{...T.t,fontSize:22,letterSpacing:"0.2em",color:C.dim,marginBottom:8}}>ŽÁDNÉ FAKTURY</div>
        <div style={{...T.m,fontSize:FS.b,color:C.dim,marginBottom:20}}>{filter==="Vše"?"Začni vytvořením první faktury":"Žádná faktura neodpovídá filtru"}</div>
        {filter==="Vše"&&<Btn ch="+ Nová faktura" onClick={onNew}/>}
      </div>
      :<Card>
        {filtered.map((inv,idx)=>{
          const c2=getC(inv);const eff=geff(inv);const past=eff==="Po splatnosti";
          const ctxItems=[
            {l:"Otevřít / PDF",a:()=>onView(inv)},
            {l:"Upravit fakturu",a:()=>onEdit(inv)},
            {l:"Duplikovat",a:()=>onDup(inv)},
            {sep:true},
            ...STATUSES.filter(s=>s!==inv.status).map(s=>({l:`→ ${s}`,a:()=>onStatus(inv.id,s)})),
            {sep:true},
            {l:"Smazat fakturu",a:async()=>del(inv.id),danger:true},
          ];
          const amtColor=eff==="Zaplaceno"?C.green:eff==="Po splatnosti"?C.merlot:eff==="Odesláno"?C.blue:C.dim;
          return <div key={inv.id} onClick={()=>onView(inv)} onContextMenu={e=>openMenu(e,ctxItems)}
            onMouseEnter={e=>e.currentTarget.style.background=C.s0}
            onMouseLeave={e=>e.currentTarget.style.background="transparent"}
            style={{display:"grid",gridTemplateColumns:"90px 1fr auto",alignItems:"center",gap:16,padding:"13px 18px",borderBottom:idx<filtered.length-1?`1px solid ${C.border}`:"none",cursor:"context-menu",transition:"background .1s",animation:`fadeIn .22s ease ${Math.min(idx,8)*0.04}s both`}}>
            <div style={{...T.m,fontSize:FS.s,color:C.dim}}>{fmtD(inv.issueDate)}</div>
            <div style={{minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:2}}>
                <div style={{...T.t,fontSize:15,fontWeight:600,letterSpacing:"0.08em",color:C.ivory}}>{inv.number}</div>
                <Pill s={eff}/>
              </div>
              <div style={{...T.m,fontSize:FS.b,color:C.ivory,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{inv.client?.company||inv.client?.name||<span style={{color:C.dim}}>—</span>}</div>
              <div style={{...T.m,fontSize:FS.s,color:past?C.merlot:C.dim,marginTop:1}}>Splatnost: {fmtD(inv.dueDate)}</div>
            </div>
            <div style={{...T.t,fontSize:20,fontWeight:300,color:amtColor,textAlign:"right"}}>{fmt(c2.tot)}</div>
          </div>;
        })}
      </Card>
    }
  {CtxMenu}</div>;
}

function filterByPeriod(items,dateKey,period){
  const now=new Date(),yr=now.getFullYear(),mo=now.getMonth();
  return items.filter(it=>{
    const d=new Date(it[dateKey]||"");if(isNaN(d))return false;
    if(period==="month")return d.getFullYear()===yr&&d.getMonth()===mo;
    if(period==="quarter"){const q=Math.floor(mo/3);return d.getFullYear()===yr&&Math.floor(d.getMonth()/3)===q;}
    if(period==="year")return d.getFullYear()===yr;
    return true;
  });
}
function fmtMins(m){if(!m||m===0)return"—";if(m<60)return m+"m";return Math.floor(m/60)+"h"+(m%60?" "+m%60+"m":"");}
function calcEntryVal(e,people,projects){
  // Příjem = čas × hodinová sazba PROJEKTU (ne osobní sazba!)
  // Pokud e.billingRate > 0 → použij ho, jinak vezmi sazbu z projektu
  const projRate=(projects||[]).find(p=>p.id===e.projectId)?.billingRate??0;
  const rate=(e.billingRate>0)?e.billingRate:projRate;
  return Math.round((rate*(e.minutes||0)/60)*10)/10;
}
function calcEntryCost(e,people){
  // Person cost rate — what the company pays the person
  const p=(people||[]).find(x=>x.id===e.personId);
  const rate=e.rate??p?.rate??0;
  return Math.round((rate*(e.minutes||0)/60)*10)/10;
}

function DonutChart({segments,size=120,thickness=16,label,sublabel}){
  const vals=segments.filter(s=>s.value>0);
  const total=vals.reduce((s,d)=>s+d.value,0);
  if(!total)return <div style={{width:size,height:size,display:"flex",alignItems:"center",justifyContent:"center",...T.m,fontSize:9,color:C.dim}}>—</div>;
  const r=(size-thickness)/2,cx=size/2,cy=size/2;
  let angle=-Math.PI/2;
  const paths=vals.map(s=>{
    const sweep=(s.value/total)*2*Math.PI;
    const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
    const a2=angle+sweep;
    const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const d=`M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r},0,${sweep>Math.PI?1:0},1,${x2.toFixed(2)},${y2.toFixed(2)}`;
    angle=a2;
    return {d,color:s.color};
  });
  return <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
    <svg width={size} height={size}><circle cx={cx} cy={cy} r={r} fill="none" stroke={C.s2} strokeWidth={thickness}/>
      {paths.map((p,i)=><path key={i} d={p.d} fill="none" stroke={p.color} strokeWidth={thickness} strokeLinecap="butt"/>)}</svg>
    {label&&<div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
      <div style={{...T.t,fontSize:Math.round(size/8),fontWeight:300,color:C.ivory,lineHeight:1}}>{label}</div>
      {sublabel&&<div style={{...T.m,fontSize:7,color:C.dim,marginTop:1,letterSpacing:"0.08em"}}>{sublabel}</div>}
    </div>}
  </div>;
}

function AreaChart({series,labels,height,chartType="area",barW}){
  const H=height||160;
  const W=600;
  const PAD={t:18,b:28,l:40,r:12};
  const [hover,setHover]=useState(null);
  const n=labels.length;
  const allVals=series.flatMap(s=>s.values);
  const maxV=Math.max(...allVals,1);
  const xc=i=>PAD.l+(i/(Math.max(n-1,1)))*(W-PAD.l-PAD.r);
  const yc=v=>PAD.t+(1-v/maxV)*(H-PAD.t-PAD.b);
  const colW=barW||(W-PAD.l-PAD.r)/(n)*0.7;
  function makePath(vals){
    if(vals.length<2)return "";
    let d="M"+xc(0)+","+yc(vals[0]);
    for(let i=1;i<vals.length;i++){const cx=(xc(i-1)+xc(i))/2;d+=" C"+cx+","+yc(vals[i-1])+" "+cx+","+yc(vals[i])+" "+xc(i)+","+yc(vals[i]);}
    return d;
  }
  function makeArea(vals){const p=makePath(vals);if(!p)return "";return p+" L"+xc(vals.length-1)+","+(H-PAD.b)+" L"+xc(0)+","+(H-PAD.b)+" Z";}
  const fmtK=v=>v>=1000?Math.round(v/1000)+"k":Math.round(v)+"";
  const NSER=series.length;
  const BAR_SLOT=(W-PAD.l-PAD.r)/n;
  return <div style={{position:"relative",width:"100%"}}>
    <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height:H,display:"block"}} onMouseLeave={()=>setHover(null)}>
      <defs>
        {series.map((s,si)=><linearGradient key={si} id={"ag"+si} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={s.color} stopOpacity={0.22}/>
          <stop offset="100%" stopColor={s.color} stopOpacity={0}/>
        </linearGradient>)}
      </defs>
      {Array.from({length:4},(_,i)=>{
        const v=maxV*(1-i/3);const y=yc(v);
        return <g key={i}>
          <line x1={PAD.l} y1={y} x2={W-PAD.r} y2={y} stroke={C.border} strokeWidth={1}/>
          <text x={PAD.l-4} y={y+3} textAnchor="end" fontSize={7} fill="#5c5650">{fmtK(v)}</text>
        </g>;
      })}
      {chartType==="area"&&<>
        {series.map((s,si)=><g key={si}>
          <path d={makeArea(s.values)} fill={"url(#ag"+si+")"} strokeWidth={0}/>
          <path d={makePath(s.values)} fill="none" stroke={s.color} strokeWidth={1.5} strokeLinejoin="round"/>
        </g>)}
        {labels.map((l,i)=><text key={i} x={xc(i)} y={H-PAD.b+11} textAnchor="middle" fontSize={7} fill="#5c5650">{l}</text>)}
        {Array.from({length:n},(_,i)=><rect key={i} x={xc(i)-colW/2} y={PAD.t} width={colW} height={H-PAD.t-PAD.b} fill="transparent" onMouseEnter={()=>setHover(i)}/>)}
      </>}
      {chartType==="bar"&&<>
        {labels.map((l,i)=>{
          const bw=BAR_SLOT/NSER*0.75;
          return <g key={i}>
            <text x={PAD.l+i*BAR_SLOT+BAR_SLOT/2} y={H-PAD.b+11} textAnchor="middle" fontSize={7} fill="#5c5650">{l}</text>
            {series.map((s,si)=>{
              const bx=PAD.l+i*BAR_SLOT+(si-(NSER-1)/2)*bw;
              const bh=Math.max(1,(s.values[i]||0)/maxV*(H-PAD.t-PAD.b));
              return <rect key={si} x={bx-bw/2} y={H-PAD.b-bh} width={bw} height={bh} fill={s.color} opacity={hover===i?1:0.8} rx={1} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}/>;
            })}
          </g>;
        })}
      </>}
      {chartType==="scatter"&&<>
        {labels.map((l,i)=><text key={i} x={xc(i)} y={H-PAD.b+11} textAnchor="middle" fontSize={7} fill="#5c5650">{l}</text>)}
        {series.map((s,si)=><g key={si}>
          {s.values.map((v,i)=>v>0&&<circle key={i} cx={xc(i)} cy={yc(v)} r={hover===i?4:3} fill={s.color} opacity={0.85} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}/>)}
          {s.values.map((v,i)=>i>0&&s.values[i-1]>0&&v>0?<line key={i} x1={xc(i-1)} y1={yc(s.values[i-1])} x2={xc(i)} y2={yc(v)} stroke={s.color} strokeWidth={1} strokeOpacity={0.4}/>:null)}
        </g>)}
        {Array.from({length:n},(_,i)=><rect key={i} x={xc(i)-colW/2} y={PAD.t} width={colW} height={H-PAD.t-PAD.b} fill="transparent" onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}/>)}
      </>}
      {hover!==null&&<g>
        <line x1={chartType==="bar"?PAD.l+hover*BAR_SLOT+BAR_SLOT/2:xc(hover)} y1={PAD.t} x2={chartType==="bar"?PAD.l+hover*BAR_SLOT+BAR_SLOT/2:xc(hover)} y2={H-PAD.b} stroke="#5c5650" strokeWidth={1} strokeDasharray="3,3"/>
        <rect x={Math.min((chartType==="bar"?PAD.l+hover*BAR_SLOT+BAR_SLOT/2:xc(hover))+6,W-110)} y={PAD.t} width={100} height={NSER*16+8} fill={C.s1} stroke={C.border} strokeWidth={1} rx={3}/>
        {series.map((s,si)=><text key={si} x={Math.min((chartType==="bar"?PAD.l+hover*BAR_SLOT+BAR_SLOT/2:xc(hover))+12,W-104)} y={PAD.t+14+si*16} fontSize={9} fill={s.color}>{s.label+": "+FMT(s.values[hover]||0)}</text>)}
      </g>}
    </svg>
  </div>;
}


function exportAccounting(invoices,incomes,expenses,year){
  const BOM="\uFEFF";
  const rows=[["Datum","Typ","Popis","Castka","Kategorie","Poznámka"]];
  (invoices||[]).filter(i=>(i.issueDate||"").startsWith(String(year))).forEach(i=>{
    rows.push([i.issueDate,"Faktura","Faktura "+(i.number||"")+" - "+(i.clientName||""),
      calcInv(i.items,i.vatEnabled,i.vatRate,i.discount).tot,"Fakturace",i.status||""]);
  });
  (incomes||[]).filter(i=>(i.date||"").startsWith(String(year))).forEach(i=>{
    rows.push([i.date,"Prijem",i.source||"",i.amount,i.category||"",i.note||""]);
  });
  (expenses||[]).filter(e=>(e.date||"").startsWith(String(year))).forEach(e=>{
    rows.push([e.date,"Vydaj",e.supplier||"","-"+(e.amount||0),e.category||"",e.note||""]);
  });
  rows.sort((a,b)=>a[0]>b[0]?1:-1);
  const csv=BOM+rows.map(r=>r.map(v=>'"'+String(v||"").replace(/"/g,'""')+'"').join(";")).join("\r\n");
  const a=document.createElement("a");
  a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
  a.download="LIBERTI-ucetnictvi-"+year+".csv";
  a.click();
}

function IncomesView({incomes,setIncomes,confirmFn,clients}){
  const CATS=["Faktura","Přímý příjem","Záloha","Provize","Kapitál","Ostatní"];
  const blank={id:uid(),category:CATS[1],amount:"",date:toDay(),source:"",note:""};

  const u=k=>v=>setF(p=>({...p,[k]:v}));
  const {openMenu,CtxMenu}=useCtxMenu();

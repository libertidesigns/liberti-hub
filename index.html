  const [importOpen,setImportOpen]=useState(false);
  const [importText,setImportText]=useState("");
  const [importErr,setImportErr]=useState("");
  const [importPreview,setImportPreview]=useState([]);

  const parseImport=txt=>{
    setImportErr("");setImportPreview([]);
    if(!txt.trim())return;
    try{
      // Try JSON first
      const json=JSON.parse(txt);
      const arr=Array.isArray(json)?json:[json];
      const mapped=arr.map(r=>({
        id:uid(),
        category:r.category||r.kategorie||r.typ||CATS[1],
        amount:parseFloat(r.amount||r.castka||r.částka||r.price||0)||0,
        date:r.date||r.datum||toDay(),
        source:r.source||r.zdroj||r.from||r.od||"",
        note:r.note||r.poznamka||r.poznámka||r.description||"",
      })).filter(r=>r.amount>0);
      setImportPreview(mapped);
    } catch(e){
      // Try CSV
      const lines=txt.trim().split(/\r?\n/);
      if(lines.length<2){setImportErr("Nepodařilo se rozpoznat formát. Vlož JSON nebo CSV s hlavičkou.");return;}
      const header=lines[0].split(/[,;	]/);
      const findCol=(hs,keys)=>{const i=hs.findIndex(h=>keys.some(k=>h.toLowerCase().includes(k)));return i>=0?i:-1;};
      const ci={amount:findCol(header,["amount","castka","částka","price","cena"]),
        date:findCol(header,["date","datum"]),category:findCol(header,["category","kategorie","typ"]),
        source:findCol(header,["source","zdroj","od","from","klient"]),note:findCol(header,["note","poznamka","popis"])};
      const rows=lines.slice(1).map(l=>{
        const cols=l.split(/[,;	]/);
        return {id:uid(),
          amount:parseFloat(ci.amount>=0?cols[ci.amount]||0:0)||0,
          date:ci.date>=0?(cols[ci.date]||toDay()):toDay(),
          category:ci.category>=0?(cols[ci.category]||CATS[1]):CATS[1],
          source:ci.source>=0?(cols[ci.source]||""):"",
          note:ci.note>=0?(cols[ci.note]||""):"",
        };
      }).filter(r=>r.amount>0);
      if(rows.length===0){setImportErr("Nenalezeny žádné platné řádky. Zkontroluj sloupec 'amount'/'castka'.");return;}
      setImportPreview(rows);
    }
  };
  const confirmImport=()=>{
    if(!importPreview.length)return;
    setIncomes(prev=>[...importPreview,...(prev||[])]);
    setImportOpen(false);setImportText("");setImportPreview([]);
    setImportErr("");
  };
  const now=new Date(),cutoff=new Date(now);cutoff.setDate(cutoff.getDate()-ivDays);
  const cutStr=cutoff.toISOString().slice(0,10);
  const filtered=(incomes||[]).filter(i=>(i.date||"")>=cutStr).sort((a,b)=>b.date.localeCompare(a.date));
  const total=filtered.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
  const save=()=>{
    if(!f||!f.amount||!f.date)return;
    const next=ed==="new"
      ?[{...f,id:uid()},...(incomes||[])]
      :(incomes||[]).map(i=>i.id===ed?{...f}:i);
    setIncomes(next);
    setEd(null);setF(null);
  };
  const startEdit=item=>{setF({...item});setEd(item.id);};
  const del=async id=>{
    const ok=await confirmFn("Smazat tento příjem?");
    if(ok)setIncomes((incomes||[]).filter(i=>i.id!==id));
  };
  return <div className="anim-fadein">
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}}>
      <div>
        <div style={{...T.t,fontSize:FS.h,fontWeight:700,letterSpacing:"0.15em",color:C.ivory}}>PŘÍJMY</div>
        <div style={{...T.m,fontSize:FS.s,color:C.dim,marginTop:2}}>Příjmy mimo fakturaci</div>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{display:"flex",gap:4}}>
          {[{d:7,l:"7 dní"},{d:30,l:"30 dní"},{d:365,l:"365 dní"}].map(p=><button key={p.d} onClick={()=>setIvDays(p.d)}
            style={{...T.m,fontSize:FS.s,padding:"5px 10px",borderRadius:4,border:"none",cursor:"pointer",
              background:ivDays===p.d?C.merlot:C.s2,color:ivDays===p.d?C.ivory:C.dim}}>{p.l}</button>)}
        </div>
        <Btn ch="↓ Import" onClick={()=>setImportOpen(v=>!v)} v="g"/>
        <Btn ch="+ Příjem" onClick={()=>{setF({...blank,id:uid()});setEd("new");}}/>
      </div>
    </div>

    {importOpen&&<Card sx={{padding:18,marginBottom:14,borderColor:C.border}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <SH c="Import příjmů"/>
        <span style={{...T.m,fontSize:FS.s,color:C.dim,marginLeft:4}}>— vlož JSON nebo CSV (z Coda, Sheets…)</span>
      </div>
      <textarea value={importText} onChange={e=>{setImportText(e.target.value);parseImport(e.target.value);}}
        placeholder={"JSON: [{\"datum\":\"2024-01-15\",\"castka\":5000,\"zdroj\":\"Klient X\"}]\nCSV: datum,castka,zdroj\n2024-01-15,5000,Klient X"}
        rows={6} style={{width:"100%",background:C.s2,border:`1px solid ${C.border}`,borderRadius:4,padding:"10px 12px",color:C.ivory,...T.m,fontSize:FS.s,resize:"vertical",outline:"none",fontFamily:"monospace"}}/>
      {importErr&&<div style={{...T.m,fontSize:FS.s,color:C.merlot,marginTop:8}}>{importErr}</div>}
      {importPreview.length>0&&<>
        <div style={{...T.m,fontSize:FS.s,color:C.green,marginTop:8,marginBottom:8}}>✓ Nalezeno {importPreview.length} záznamů:</div>
        <div style={{maxHeight:160,overflowY:"auto",background:C.bg,borderRadius:4,padding:"8px 12px",marginBottom:12}}>
          {importPreview.slice(0,10).map((r,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",borderBottom:`1px solid ${C.border}`}}>
            <span style={{...T.m,fontSize:FS.s,color:C.dim}}>{r.date} · {r.source||r.category}</span>

        <div style={{gridColumn:"1/-1"}}><Inp lbl="Poznámka" val={f.note} onChange={u("note")} ph="Volitelný popis…"/></div>
      </div>
      <div style={{display:"flex",gap:10,marginTop:14}}>
        <Btn ch="Uložit" onClick={save}/>
        <Btn ch="Zrušit" onClick={()=>{setEd(null);setF(null);}} v="g"/>

// Vrátí finType osoby: "owner" | "employee" | "freelancer"
function getPersonFinType(person, allRoles){
  if(!person)return "employee";
  const role=[...(allRoles||[])].find(r=>r.v===person.role);
  return role?.finType||"employee";
}

function buildFinEntries(invoices,incomes,expenses,timeEntries,settings,projects){
  const people=settings?.people||[];
  const entries=[];

  // ── FAKTURY ──────────────────────────────────────────────────
  // Faktura vystavena = pending income (fakturováno ≠ příjem)
  // Faktura zaplacena = confirmed income (skutečný příjem)
  // Storno = přeskočit
  (invoices||[]).forEach(inv=>{
    const amt=calcInv(inv.items||[],inv.vatEnabled,inv.vatRate,inv.discount).tot;
    if(!amt||inv.status==="Storno")return;
    const paid=inv.status==="Zaplaceno";
    const client=inv.client?.company||inv.client?.name||"";
    entries.push({
      id:"inv_"+inv.id, ref:inv.id,
      type:"income",
      category:"fakturováno",
      amount:amt,
      date:inv.issueDate||inv.dueDate||"",
      status:paid?"confirmed":"pending",
      source:"faktura",
      note:"Faktura "+inv.number+(client?" — "+client:""),
    });
  });

  // ── MANUÁLNÍ PŘÍJMY ─────────────────────────────────────────
  // Skutečné přijaté peníze mimo fakturaci → confirmed income
  (incomes||[]).forEach(inc=>{
    const amt=parseFloat(inc.amount)||0;
    if(!amt)return;
    // Networth auto-záznamy z hodin přeskočíme (vznikají z timeEntries)
    if(inc.category==="Networth odměna")return;
    entries.push({
      id:"inc_"+inc.id, ref:inc.id,
      type:"income",
      category:inc.category||"ostatní",
      amount:amt,
      date:inc.date||"",
      status:"confirmed",
      source:"manuální",
      note:inc.source||inc.category||"Příjem",
    });
  });

  // ── VÝDAJE ──────────────────────────────────────────────────
  // Každý výdaj = expense s kategorií náklad
  (expenses||[]).forEach(exp=>{
    const amt=parseFloat(exp.amount)||0;
    if(!amt)return;
    const today=toDay();
    entries.push({
      id:"exp_"+exp.id, ref:exp.id,
      type:"expense",
      category:"náklad",
      amount:amt,
      date:exp.date||"",
      status:(exp.date||"")<=today?"confirmed":"pending",
      source:"výdaj",
      note:exp.name||exp.category||"Výdaj",
      expCategory:exp.category||"Ostatní",
    });
  });

  // ── HODINY ──────────────────────────────────────────────────────────────────
  // owner      → internal / interní kapitál
  // employee   → expense / mzda
  // freelancer → expense / faktura dodavatele
  const allRolesForTE=[...(settings?.systemRoles||[]),...(settings?.customRoles||[])];
  (timeEntries||[]).forEach(te=>{
    const person=people.find(p=>p.id===te.personId);
    const ft=getPersonFinType(person,allRolesForTE);
    const isOwner=ft==="owner";
    const val=isOwner?calcEntryVal(te,people,projects||[]):calcEntryCost(te,people);
    if(!val)return;
    entries.push({
      id:"te_"+te.id,ref:te.id,
      type:isOwner?"internal":"expense",
      category:isOwner?"interní kapitál":ft==="freelancer"?"faktura dodavatele":"mzda",
      amount:val,date:te.date||"",status:"confirmed",source:"hodiny",
      note:(person?.name||"Neznámý")+(te.description?" — "+te.description:""),
      personId:te.personId||"",projectId:te.projectId||"",finType:ft,
    });
  });

  return entries.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}
// Helpers pro Finance Entry model
// ═══════════════════════════════════════════════════════════════
function finByType(entries,type){return (entries||[]).filter(e=>e.type===type);}
function finByCategory(entries,cat){return (entries||[]).filter(e=>e.category===cat);}
function finConfirmed(entries){return (entries||[]).filter(e=>e.status==="confirmed");}
function finPending(entries){return (entries||[]).filter(e=>e.status==="pending");}
function finSum(entries){return Math.round((entries||[]).reduce((s,e)=>s+(e.amount||0),0)*10)/10;}
function finByPeriod(entries,period){
  if(!Array.isArray(entries))return [];
  const now=new Date(),yr=now.getFullYear(),mo=now.getMonth();
  if(!period||period==="all")return entries;
  if(period==="year")return entries.filter(e=>(e.date||"").startsWith(String(yr)));
  if(period==="quarter"){
    const q=Math.floor(mo/3),ms=q*3,me=ms+2;
    return entries.filter(e=>{const m=parseInt((e.date||"").slice(5,7))-1;return (e.date||"").startsWith(String(yr))&&m>=ms&&m<=me;});
  }
  if(period==="month")return entries.filter(e=>(e.date||"").startsWith(yr+"-"+String(mo+1).padStart(2,"0")));
  return entries;
}
// Balance = reálné peníze (confirmed income - confirmed expense)
function finBalance(entries){
  const inc=finSum(finConfirmed(finByType(entries,"income")));
  const exp=finSum(finConfirmed(finByType(entries,"expense")));
  return Math.round((inc-exp)*10)/10;
}
// Internal kapitál = nevyplacené odměny ve firmě
function finInternal(entries){return finSum(finByType(entries,"internal"));}
// Networth = Balance + Internal kapitál
function finNetworth(entries){return Math.round((finBalance(entries)+finInternal(entries))*10)/10;}
// Fakturováno = pending income (vystaveno, čeká na platbu)
function finFakturovano(entries){return finSum(finPending(finByType(entries,"income")));}

function buildAchievementMilestones(track,saved){
  const base=(DEF.achievements[track]?.milestones||[]).slice();
  const list=(Array.isArray(saved)&&saved.length>0?saved.slice():base.slice());
  if(list.length>=50) return list;
  let last=list[list.length-1]?.value||1;
  while(list.length<50){
    const inc=track==="networth"?Math.max(100000,Math.round(last*0.18)):
              track==="dosah"?Math.max(1,Math.round(last*0.12)):
              Math.max(1,Math.round(last*0.15));
    last=last+inc;
    list.push({id:`${track}_auto_${list.length+1}`,value:last,label:`Milník ${list.length+1}`,celebText:`Oslavujeme milestone ${list.length+1}!`});
  }
  return list;
}

    const next={...ach,[activeTrack]:{milestones:[...existing,nextMilestone]}};
    onSaveSettings({...settings,achievements:next});
  };

  const saveEdit=()=>{
    if(!editMs)return;
    const upd={value:Number(editMs.value),label:editMs.label,celebText:editMs.celebText};
    if(editMs.iconRank!==undefined)upd.iconRank=editMs.iconRank;
    const next={...ach,[editMs.track]:{...ach[editMs.track],milestones:(ach[editMs.track]?.milestones||[]).map(m=>m.id===editMs.id?{...m,...upd}:m)}};
    onSaveSettings({...settings,achievements:next});
    setEditMs(null);
  };
  const deleteMs=(track,id)=>{
    const next={...ach,[track]:{...ach[track],milestones:(ach[track]?.milestones||[]).filter(x=>x.id!==id)}};
    onSaveSettings({...settings,achievements:next});
    setEditMs(null);
  };

  const CONF_COLORS=["#E53935","#FFD700","#22C55E","#2563EB","#c084fc","#f0d060","#e08040","#3aaa5a"];
  const tr=tracks.find(t=>t.key===activeTrack)||tracks[0];
  const ms=(ach[tr.key]?.milestones||[]).slice().sort((a,b)=>a.value-b.value);
  const cur=currentVals[tr.key];
  const roadMs=ms;
  const lastAchievedIdx=ms.reduce((acc,m,i)=>cur>=m.value?i:acc,-1);
  const curMsId=lastAchievedIdx>=0?ms[lastAchievedIdx]?.id:ms[0]?.id;
  const nextMs=ms.filter(m=>cur<m.value);

  return <div className="anim-fadein" onClick={()=>{setEditMs(null);setEditMode(false);}}>

    {/* ── 3 STAT CARDS ──────────────────────────────────────────── */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:12,marginBottom:28}}>
      {tracks.map(t=>{
        const cv=currentVals[t.key];
        const tMs=ach[t.key]?.milestones||[];
        const maxV=tMs[tMs.length-1]?.value||1;
        const pct=Math.min(100,maxV>0?cv/maxV*100:0);
        const achCnt=tMs.filter(m=>cv>=m.value).length;
        const isAct=activeTrack===t.key;
        return <Card key={t.key} onClick={()=>setActiveTrack(t.key)} sx={{padding:"20px 22px",cursor:"pointer",border:`1px solid ${isAct?t.color:C.border}`,background:isAct?t.color+"12":C.s1,transition:"all .2s"}}>
          <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:12}}>
            <div style={{width:42,height:42,borderRadius:"50%",background:t.color+"22",border:`1px solid ${t.color+"44"}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,color:t.color}}>{t.icon}</div>
            <div style={{minWidth:0}}>
              <div style={{...T.m,fontSize:9,letterSpacing:"0.14em",color:C.dim,textTransform:"uppercase",marginBottom:4}}>{t.label}</div>
              <div style={{...T.t,fontSize:24,fontWeight:300,color:t.color,lineHeight:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.valLabel(cv)}</div>
            </div>
          </div>
          <div style={{...T.m,fontSize:10,color:C.dim,marginBottom:8,letterSpacing:"0.08em"}}>{achCnt} / {tMs.length} milníků</div>
          <div style={{height:6,background:C.s0,borderRadius:3,overflow:"hidden"}}>
            <div style={{height:"100%",width:pct+"%",background:t.color,borderRadius:3,transition:"width .6s"}}/>
          </div>
        </Card>;
      })}
    </div>

    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,marginBottom:18}}>
      <div>
        <div style={{...T.t,fontSize:30,fontWeight:700,letterSpacing:"0.18em",color:C.ivory,lineHeight:1}}>TROPHY ROAD</div>
        <div style={{...T.m,fontSize:FS.s,color:C.dim,marginTop:4}}>Milníky vaší firmy — cesta k úspěchu.</div>
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        {canEdit&&<Btn ch="Přidat milestone" onClick={addMilestone} v="g" sx={{padding:"8px 16px",fontSize:11}} />}
        {canEdit&&<Btn ch={editMode?"Ukončit úpravy":"Nastavení úspěchů"} onClick={e=>{e.stopPropagation();setEditMode(prev=>!prev);setEditMs(null);setEditAnchor(null);}} v="g" sx={{padding:"8px 16px",fontSize:11}} />}

    <Card sx={{padding:"24px",borderColor:C.border}}>
      <div style={{position:"relative"}}>

        {roadMs.map((m,i)=>{
          const achieved=cur>=m.value;
          const isCurrent=m.id===curMsId;
          const isEditing=editMs?.id===m.id;
          const total=roadMs.length;

          return <div key={m.id} style={{display:"grid",gridTemplateColumns:"minmax(170px,1fr) 120px minmax(170px,1fr)",alignItems:"center",gap:8,marginBottom:14,position:"relative",zIndex:isEditing?2:1}}>
            <div />

                  } else if(achieved){

    {celebration&&<div style={{position:"fixed",inset:0,zIndex:9000,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.78)",backdropFilter:"blur(4px)"}} onClick={()=>setCelebration(null)}>

function GoalsView({goals,setGoals,movements,setMovements,settings,confirmFn}){
  const blank={id:uid(),name:"",description:"",needsFunding:false,targetAmount:"",deadline:"",status:"active"};
  const [f,setF]=useState(null);
  const [detail,setDetail]=useState(null);
  const u=k=>v=>setF(p=>({...p,[k]:v}));

  const save=()=>{
    if(!f.name)return;
    const item={...f,targetAmount:parseFloat(f.targetAmount)||0,id:f.id||uid()};
    setGoals(prev=>{const ex=(prev||[]).find(g=>g.id===item.id);return ex?(prev||[]).map(g=>g.id===item.id?item:g):[item,...(prev||[])];});
    setF(null);
  };
  const del=async id=>{
    if(await confirmFn("Smazat cíl?"))setGoals(prev=>(prev||[]).filter(g=>g.id!==id));
  };
  const funded=g=>(movements||[]).filter(m=>m.goalId===g.id&&m.status==="done").reduce((s,m)=>s+m.amount,0);
  const pct=g=>g.targetAmount>0?Math.min(100,Math.round(funded(g)/g.targetAmount*100)):0;
  const STATUS_C={active:C.blue,done:C.green,paused:C.dim};
  const STATUS_L={active:"Aktivní",done:"Splněno",paused:"Pozastaveno"};

  return <div className="anim-fadein">
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20,flexWrap:"wrap"}}>
      <div style={{...T.t,fontSize:FS.h,fontWeight:700,letterSpacing:"0.12em",color:C.ivory}}>CÍLE</div>

    </div>

    {f&&<Card sx={{padding:18,marginBottom:16,borderColor:C.mBorder}}>
      <SH c={f.id&&(goals||[]).find(g=>g.id===f.id)?"Upravit cíl":"Nový cíl"}/>
      <div className="grid-2-inp" style={{marginBottom:14}}>
        <div style={{gridColumn:"1/-1"}}><Inp lbl="Název cíle" val={f.name} onChange={u("name")} ph="Nové auto, marketing…"/></div>
        <div style={{gridColumn:"1/-1"}}><Inp lbl="Popis" val={f.description} onChange={u("description")} ml ph="Volitelný popis cíle…"/></div>
        <div style={{gridColumn:"1/-1",display:"flex",alignItems:"center",gap:12}}>
          <div onClick={()=>setF(p=>({...p,needsFunding:!p.needsFunding}))}
            style={{width:18,height:18,borderRadius:3,border:`2px solid ${f.needsFunding?C.merlot:C.border}`,background:f.needsFunding?C.merlot:"transparent",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,transition:"all .15s"}}>
            {f.needsFunding&&<span style={{color:"#fff",fontSize:12,lineHeight:1,fontWeight:700}}>✓</span>}
          </div>
          <span onClick={()=>setF(p=>({...p,needsFunding:!p.needsFunding}))} style={{...T.m,fontSize:FS.b,color:C.ivory,cursor:"pointer"}}>Cíl vyžaduje finanční prostředky</span>
        </div>
        {f.needsFunding&&<Inp lbl="Cílová částka (Kč)" type="number" val={f.targetAmount} onChange={u("targetAmount")} ph="0"/>}
        <Inp lbl="Deadline" type="date" val={f.deadline} onChange={u("deadline")}/>
        <div><Lbl c="Stav" s={{marginBottom:6}}/><Sel value={f.status} onChange={v=>setF(p=>({...p,status:v}))} opts={[{v:"active",l:"Aktivní"},{v:"paused",l:"Pozastaveno"},{v:"done",l:"Splněno"}]}/></div>
      </div>
      <div style={{display:"flex",gap:10}}>
        <Btn ch="Uložit" onClick={save}/>
        <Btn ch="Zrušit" onClick={()=>setF(null)} v="g"/>
      </div>
    </Card>}

    {(goals||[]).length===0
      ?<Card sx={{padding:"40px 20px",textAlign:"center"}}>
          <div style={{...T.t,fontSize:22,letterSpacing:"0.2em",color:C.dim,marginBottom:8}}>ŽÁDNÉ CÍLE</div>
          <div style={{...T.m,fontSize:FS.b,color:C.dim,marginBottom:16}}>Nastav firemní cíle — s financováním i bez</div>
          <Btn ch="+ Nový cíl" onClick={()=>setF({...blank})}/>
        </Card>
      :<div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}} className="grid-fin-2">
        {(goals||[]).map(g=>{
          const fd=funded(g);const pc=pct(g);const sc=STATUS_C[g.status]||C.dim;
          const daysLeft=g.deadline?Math.ceil((new Date(g.deadline)-new Date())/86400000):null;
          return <Card key={g.id} sx={{padding:"16px 18px",cursor:"pointer"}} onClick={()=>setDetail(detail===g.id?null:g.id)}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8,marginBottom:8}}>
              <div style={{...T.t,fontSize:18,fontWeight:600,letterSpacing:"0.08em",color:C.ivory,lineHeight:1.1}}>{g.name}</div>
              <span style={{...T.m,fontSize:10,color:sc,background:sc+"15",border:`1px solid ${sc}33`,borderRadius:3,padding:"2px 8px",letterSpacing:"0.1em",textTransform:"uppercase",flexShrink:0}}>{STATUS_L[g.status]||g.status}</span>
            </div>
            {g.description&&<div style={{...T.m,fontSize:FS.s,color:C.dim,marginBottom:10}}>{g.description}</div>}
            {g.needsFunding&&g.targetAmount>0&&<>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                <span style={{...T.m,fontSize:FS.s,color:C.dim}}>Naspořeno</span>
                <span style={{...T.m,fontSize:FS.s,color:pc>=100?C.green:C.ivory,fontWeight:600}}>{FMT(fd)} / {FMT(g.targetAmount)}</span>
              </div>
              <div style={{height:4,background:C.s2,borderRadius:2,marginBottom:10}}>
                <div style={{height:"100%",width:pc+"%",background:pc>=100?C.green:C.merlot,borderRadius:2,transition:"width .4s"}}/>
              </div>
            </>}
            {daysLeft!==null&&<div style={{...T.m,fontSize:FS.s,color:daysLeft<7?C.merlot:daysLeft<30?C.amber:C.dim}}>
              {daysLeft>0?`${daysLeft} dní do deadline`:daysLeft===0?"Dnes!":"Po termínu"}
            </div>}
            {detail===g.id&&<div style={{marginTop:12,paddingTop:12,borderTop:`1px solid ${C.border}`,display:"flex",gap:8}}>
              <Btn ch="✎ Upravit" onClick={e=>{e.stopPropagation();setF({...g,targetAmount:String(g.targetAmount)});setDetail(null);}} v="g" sx={{height:28,padding:"0 12px",fontSize:11}}/>
              <Btn ch="✕ Smazat" onClick={e=>{e.stopPropagation();del(g.id);}} v="d" sx={{height:28,padding:"0 12px",fontSize:11}}/>
            </div>}
          </Card>;
        })}
      </div>}
  </div>;
}

function FinanceDashboard({invoices,incomes,setIncomes,timeEntries,expenses,setExpenses,settings,period,setPeriod,projects,movements}){
  const [chartPeriod,setChartPeriod]=useState("yearly");
  const [chartType,setChartType]=useState("bar");
  const [capAmount,setCapAmount]=useState("");
  const [capDir,setCapDir]=useState(null); // null | "in" | "out"
  const now=new Date(),yr=now.getFullYear(),mo=now.getMonth();

  // ── Centrální data: všechny transakce ─────────────────────────
  let allEntries=[];
  try{allEntries=buildFinEntries(invoices||[],incomes||[],expenses||[],timeEntries||[],settings,projects||[]);}catch(e){console.error("buildFinEntries:",e);}
  const periodEntries=finByPeriod(allEntries,period);

  // ── HLAVNÍ METRIKY (všechna data, ne jen za období) ───────────
  const fakturovano=finFakturovano(allEntries);
  // Cash pozice = jen přímé platby (bez hodin z timeru)
  const timeEntrs=allEntries.filter(e=>e.source==="hodiny");
  const nonTimeEntrs=allEntries.filter(e=>e.source!=="hodiny");
  const realInc=finSum(finConfirmed(finByType(nonTimeEntrs,"income")));
  const realExp=finSum(finConfirmed(finByType(nonTimeEntrs,"expense")));
  const realCash=realInc-realExp;
  // Očekávané pohyby: CEO hodiny = 100% profit (IN, výplata 0), zaměstnanci = náklad (OUT)
  const wagesOut=finSum(timeEntrs.filter(e=>e.type==="expense"));
  const ownerOut=finSum(timeEntrs.filter(e=>e.type==="internal"));
  const expectedIn=fakturovano+ownerOut;   // faktury + CEO čistý profit
  const expectedOut=wagesOut;              // jen mzdy zaměstnanců/freelancerů
  const expectedNet=expectedIn-expectedOut;

  // ── METRIKY ZA ZVOLENÉ OBDOBÍ ──────────────────────────────────
  const pIncome=finSum(finConfirmed(finByType(periodEntries,"income")));
  const pExpense=finSum(finConfirmed(finByType(periodEntries,"expense")));
  const pPending=finFakturovano(periodEntries);
  const pProfit=pIncome-pExpense;

  // ── VÝDAJE DLE KATEGORIE (za období) ──────────────────────────
  const expByCat={};
  finByType(periodEntries,"expense").filter(e=>e.status==="confirmed").forEach(e=>{
    const cat=e.expCategory||e.category||"Ostatní";
    expByCat[cat]=(expByCat[cat]||0)+(e.amount||0);
  });
  const expCatEntries=Object.entries(expByCat).sort((a,b)=>b[1]-a[1]);

  // ── CHART DATA ─────────────────────────────────────────────────
  const WEEK_DAYS=["Po","Út","St","Čt","Pá","So","Ne"];
  let chartLabels=[],chartIncome=[],chartExpense=[],chartFak=[],chartProfit=[];
  const makeSlices=()=>{
    if(chartPeriod==="weekly"){
      const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
      return Array.from({length:7},(_,i)=>{
        const d=new Date(mon);d.setDate(mon.getDate()+i);
        chartLabels.push(WEEK_DAYS[i]);
        return allEntries.filter(e=>(e.date||"")===d.toISOString().slice(0,10));
      });
    }
    if(chartPeriod==="monthly"){
      const res=[];
      for(let d=29;d>=0;d--){
        const dt=new Date(now);dt.setDate(dt.getDate()-d);
        chartLabels.push(dt.getDate()+"."+(dt.getMonth()+1)+".");
        res.push(allEntries.filter(e=>(e.date||"")===dt.toISOString().slice(0,10)));
      }
      return res;
    }
    // yearly — last 12 months
    return Array.from({length:12},(_,i)=>{
      const d=new Date(yr,mo-11+i,1);
      const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
      chartLabels.push(MO_NAMES[d.getMonth()]);
      return allEntries.filter(e=>(e.date||"").startsWith(k));
    });
  };
  makeSlices().forEach(sl=>{
    chartIncome.push(finSum(finConfirmed(finByType(sl,"income"))));
    chartExpense.push(finSum(finConfirmed(finByType(sl,"expense"))));
    chartFak.push(finFakturovano(sl));
    chartProfit.push(finBalance(sl));
  });

  const CHART_PERIODS=[{id:"weekly",l:"Týden"},{id:"monthly",l:"Měsíc"},{id:"yearly",l:"Rok"}];
  const CHART_TYPES=[{id:"area",ico:"∿"},{id:"bar",ico:"▬"},{id:"scatter",ico:"⋯"}];

  const people=settings.people||[];
  const personStats=people.filter(p=>p.active!==false).map(p=>{
    const pEs=finByPeriod(allEntries.filter(e=>e.personId===p.id),period);
    const val=finSum(pEs);
    const mins=(timeEntries||[]).filter(e=>e.personId===p.id&&finByPeriod([{date:e.date||""}],period).length>0)
      .reduce((s,e)=>s+(e.minutes||0),0);
    return {p,val,mins};
  }).filter(s=>s.mins>0);

  // ── CEO konta ─────────────────────────────────────────────────────
  const allRolesForCEO=[...(settings.systemRoles||[]),...(settings.customRoles||[])];
  const owners=(settings.people||[]).filter(p=>p.active!==false&&getPersonFinType(p,allRolesForCEO)==="owner");
  const ownerAccountsRaw=owners.map(p=>{
    // Příjem = hodiny CEO × hodinová sazba projektu
    const earned=(timeEntries||[])
      .filter(e=>e.personId===p.id&&!e.isPause)
      .reduce((s,e)=>s+calcEntryVal(e,null,projects||[]),0);
    // Vybráno = provedené výběry z firmy kde příjemce = tento CEO
    const withdrawn=(movements||[])
      .filter(m=>m.toId===p.id&&m.type==="withdrawal"&&m.status==="done")
      .reduce((s,m)=>s+(parseFloat(m.amount)||0),0);
    // Nárok = kolik může vybrat (earned - withdrawn, min 0)
    const narok=Math.max(0,earned-withdrawn);
    // Dluh = kolik dluží firmě (pokud vybral více než vydělal)
    const dluh=Math.max(0,withdrawn-earned);
    return {p,earned,withdrawn,narok,dluh};
  });
  // Pohledávka: dluh druhého CEO přechází jako pohledávka na tohoto CEO
  const ownerAccounts=ownerAccountsRaw.map((acc,i,arr)=>{
    const pohledavka=arr.filter((_,j)=>j!==i).reduce((s,o)=>s+o.dluh,0);
    return {...acc,pohledavka};
  });

  return <div className="anim-fadein">

    {/* ═══ Header PŘEHLED ════════════════════════════════════ */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
      <div>
        <div style={{...T.t,fontSize:28,fontWeight:700,letterSpacing:"0.15em",color:C.ivory}}>PŘEHLED</div>
        <div style={{...T.m,fontSize:FS.s,color:C.dim,marginTop:2}}>Finance za vybrané období</div>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <PeriodBar period={period} setPeriod={setPeriod}/>

      </div>
    </div>

    {/* ═══ CASH + POHYBY ════════════════════════════════════════ */}
    <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:12}}>

      {/* ── CASH POZICE ─────────────────────────────── */}
      <div style={{borderRadius:8,border:`1px solid ${C.border}`,background:C.s1,display:"flex",alignItems:"center",gap:0,minHeight:64}}>
        <div style={{padding:"12px 20px",minWidth:180,borderRight:`1px solid ${C.border}`}}>
          <div style={{...T.m,fontSize:8,letterSpacing:"0.16em",textTransform:"uppercase",color:C.dim,marginBottom:3}}>Cash pozice</div>

        </div>
        <div style={{display:"flex",flex:1,alignItems:"center",padding:"0 20px",gap:0}}>
          <div style={{padding:"0 20px 0 0"}}>
            <div style={{...T.m,fontSize:8,color:C.dim,marginBottom:2,textTransform:"uppercase",letterSpacing:"0.1em"}}>↑ Příjmy</div>
            <div style={{...T.t,fontSize:16,fontWeight:300,color:C.green}}>{FMT(realInc)}</div>
          </div>
          <div style={{width:1,height:28,background:C.border,marginRight:20}}/>
          <div>
            <div style={{...T.m,fontSize:8,color:C.dim,marginBottom:2,textTransform:"uppercase",letterSpacing:"0.1em"}}>↓ Výdaje</div>
            <div style={{...T.t,fontSize:16,fontWeight:300,color:realExp>0?C.merlot:C.dim}}>{FMT(realExp)}</div>
          </div>
        </div>
        <div style={{padding:"0 16px",borderLeft:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:6,height:"100%"}}>
          <span style={{...T.m,fontSize:8,color:C.dim,textTransform:"uppercase",letterSpacing:"0.12em",marginRight:2}}>Kapitál</span>

              <Btn ch="✓" onClick={async()=>{

                else{setExpenses(prev=>[{id:uid(),name:"Výběr kapitálu",category:"Kapitál",amount:amt,date:toDay(),supplier:"",note:"",projectId:""},...(prev||[])]);}

      {/* ── OČEKÁVANÉ POHYBY ────────────────────────── */}
      <div style={{borderRadius:8,border:`1px solid ${C.border}`,background:C.s1,display:"flex",alignItems:"center",gap:0,minHeight:64}}>
        <div style={{padding:"12px 20px",minWidth:180,borderRight:`1px solid ${C.border}`}}>
          <div style={{...T.m,fontSize:8,letterSpacing:"0.16em",textTransform:"uppercase",color:C.dim,marginBottom:3}}>Očekávané pohyby</div>
          <div style={{...T.t,fontSize:26,fontWeight:300,color:expectedNet>=0?C.green:C.merlot,lineHeight:1}}>
            {expectedNet>0?"+":""}{FMT(expectedNet)}
          </div>
        </div>
        <div style={{display:"flex",flex:1,alignItems:"center",padding:"0 20px",gap:0}}>
          <div style={{padding:"0 20px 0 0"}}>
            <div style={{...T.m,fontSize:8,color:C.dim,marginBottom:2,textTransform:"uppercase",letterSpacing:"0.1em"}}>↑ Příjmy</div>
            <div style={{...T.t,fontSize:16,fontWeight:300,color:C.green}}>{FMT(expectedIn)}</div>
          </div>
          <div style={{width:1,height:28,background:C.border,marginRight:20}}/>
          <div>
            <div style={{...T.m,fontSize:8,color:C.dim,marginBottom:2,textTransform:"uppercase",letterSpacing:"0.1em"}}>↓ Výdaje</div>
            <div style={{...T.t,fontSize:16,fontWeight:300,color:expectedOut>0?C.merlot:C.dim}}>{FMT(expectedOut)}</div>
          </div>
        </div>
      </div>

    </div>

    {/* ═══ KPI za období ══════════════════════════════════════ */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:14}} className="grid-kpi">
      {[
        {l:"Přijato",v:pIncome,c:C.green},
        {l:"Vydáno",v:pExpense,c:C.merlot},
        {l:"Zisk",v:pProfit,c:pProfit>=0?C.blue:C.merlot},
        {l:"Čeká na platbu",v:pPending,c:C.blue},
      ].map(k=><Card key={k.l} sx={{padding:"14px 18px"}}>
        <div style={{...T.m,fontSize:9,color:C.dim,marginBottom:8,letterSpacing:"0.1em",textTransform:"uppercase"}}>{k.l}</div>
        <div style={{...T.t,fontSize:26,fontWeight:700,color:k.c,lineHeight:1}}>{FMT(k.v)}</div>

    {/* ═══ Grafy ══════════════════════════════════════════════ */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}} className="grid-fin-2">
      <Card sx={{padding:"16px 18px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,flexWrap:"wrap",gap:8}}>
          <SH c="Příjmy vs Výdaje"/>
          <div style={{display:"flex",gap:3}}>
            {CHART_PERIODS.map(p=><button key={p.id} onClick={()=>setChartPeriod(p.id)}
              style={{...T.m,fontSize:FS.s,padding:"3px 8px",borderRadius:3,border:"none",cursor:"pointer",
                background:chartPeriod===p.id?C.merlot:C.s2,color:chartPeriod===p.id?C.ivory:C.dim}}>{p.l}</button>)}
            {[{id:"area",ico:"∿"},{id:"bar",ico:"▬"},{id:"scatter",ico:"⋯"}].map(t=><button key={t.id} onClick={()=>setChartType(t.id)}
              style={{...T.m,fontSize:11,padding:"3px 8px",borderRadius:3,border:"none",cursor:"pointer",
                background:chartType===t.id?C.bHi:C.s2,color:chartType===t.id?C.ivory:C.dim}}>{t.ico}</button>)}
          </div>
        </div>
        <AreaChart series={[
          {label:"Příjmy",     color:C.green,  values:chartIncome},
          {label:"Výdaje",     color:C.merlot, values:chartExpense},
          {label:"Fakturováno",color:C.blue,   values:chartFak},
        ]} labels={chartLabels} height={130} chartType={chartType}/>
      </Card>
      <Card sx={{padding:"16px 18px"}}>
        <SH c="Profit v čase"/>
        <AreaChart series={[{label:"Profit",color:C.blue,values:chartProfit}]} labels={chartLabels} height={130} chartType={chartType}/>
      </Card>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}} className="grid-fin-2">
      <Card sx={{padding:"16px 18px"}}>
        <SH c="Struktura výdajů"/>
        {expCatEntries.length===0
          ?<div style={{...T.m,fontSize:FS.b,color:C.dim}}>Žádné výdaje</div>
          :expCatEntries.map(([cat,amt])=>{
            const pct=pExpense>0?(amt/pExpense)*100:0;
            return <div key={cat} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                <span style={{...T.m,fontSize:FS.b,color:C.ivory}}>{cat}</span>
                <span style={{...T.m,fontSize:FS.b,color:C.merlot}}>{FMT(amt)}</span>
              </div>
              <div style={{height:3,background:C.s2,borderRadius:2}}>
                <div style={{height:"100%",width:pct+"%",background:C.merlot,borderRadius:2,transition:"width .4s"}}/>
              </div>
            </div>;
          })}
      </Card>
      <Card sx={{padding:"16px 18px"}}>
        <SH c="Práce týmu"/>
        {personStats.length===0
          ?<div style={{...T.m,fontSize:FS.b,color:C.dim}}>Žádné hodiny</div>
          :personStats.map(({p,val,mins})=>{
            const total=personStats.reduce((s,x)=>s+x.val,0);
            const pct=total>0?(val/total)*100:0;
            return <div key={p.id} style={{marginBottom:9}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                <div style={{display:"flex",gap:7,alignItems:"center"}}>
                  <div style={{width:7,height:7,borderRadius:"50%",background:p.color}}/>
                  <span style={{...T.m,fontSize:FS.b,color:C.ivory}}>{p.name}</span>
                  <span style={{...T.m,fontSize:FS.s,color:C.dim}}>{fmtMins(mins)}</span>
                </div>
                <span style={{...T.t,fontSize:13,fontWeight:300,color:p.color}}>{FMT(val)}</span>
              </div>
              <div style={{height:2,background:C.s2,borderRadius:1}}>
                <div style={{height:"100%",width:pct+"%",background:p.color,borderRadius:1,transition:"width .4s"}}/>
              </div>
            </div>;
          })}
      </Card>
    </div>

    {ownerAccounts.length>0&&<Card sx={{padding:"14px 20px",marginBottom:12}}>
      <SH c="CEO konta — nárok na výběr"/>
      <div style={{display:"grid",gridTemplateColumns:`repeat(${ownerAccounts.length},1fr)`,gap:12,marginTop:4}}>
        {ownerAccounts.map(({p,earned,withdrawn,narok,dluh,pohledavka})=>(
          <div key={p.id} style={{background:C.s2,borderRadius:6,padding:"14px 16px",border:`1px solid ${dluh>0?C.merlot:narok>0?C.green:C.border}`}}>
            <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:12}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:p.color||C.amber,flexShrink:0}}/>
              <span style={{...T.t,fontSize:15,fontWeight:600,letterSpacing:"0.08em",color:C.ivory}}>{p.name}</span>
            </div>
            {/* Příjem z hodin */}
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
              <span style={{...T.m,fontSize:FS.s,color:C.dim}}>Příjem z hodin</span>
              <span style={{...T.t,fontSize:13,fontWeight:300,color:C.blue}}>{FMT(earned)}</span>
            </div>
            {/* Vybráno */}
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,paddingBottom:8,borderBottom:`1px solid ${C.border}`}}>
              <span style={{...T.m,fontSize:FS.s,color:C.dim}}>Vybráno</span>
              <span style={{...T.t,fontSize:13,fontWeight:300,color:withdrawn>0?C.merlot:C.dim}}>{withdrawn>0?"-"+FMT(withdrawn):"—"}</span>
            </div>
            {/* Nárok nebo Dluh */}
            {dluh>0
              ?<>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{...T.m,fontSize:FS.s,color:C.merlot,fontWeight:600}}>Dluh</span>
                  <span style={{...T.t,fontSize:16,fontWeight:600,color:C.merlot}}>−{FMT(dluh)}</span>
                </div>
                <div style={{...T.m,fontSize:FS.s,color:C.dim,marginBottom:4}}>Musí nejdříve vyrovnat dluh</div>
              </>
              :<div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{...T.m,fontSize:FS.s,color:C.green,fontWeight:600}}>Nárok (může vybrat)</span>
                <span style={{...T.t,fontSize:16,fontWeight:600,color:C.green}}>{FMT(narok)}</span>
              </div>
            }
            {/* Pohledávka od druhého CEO */}
            {pohledavka>0&&<div style={{marginTop:8,paddingTop:8,borderTop:`1px dashed ${C.border}`}}>
              <div style={{display:"flex",justifyContent:"space-between"}}>
                <span style={{...T.m,fontSize:FS.s,color:C.amber}}>Pohledávka (dluh partnera)</span>
                <span style={{...T.t,fontSize:13,fontWeight:500,color:C.amber}}>{FMT(pohledavka)}</span>
              </div>
              <div style={{...T.m,fontSize:FS.s,color:C.dim,marginTop:2}}>Vykazuje se zvlášť — nárok vznikne po splacení dluhu</div>
            </div>}
          </div>
        ))}
      </div>
    </Card>}

    <Card sx={{padding:"14px 20px"}}>
      <SH c="Rok po roku"/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
        {[yr-2,yr-1,yr].map(y=>{
          const yE=allEntries.filter(e=>(e.date||"").startsWith(String(y)));
          const yInc=finSum(finConfirmed(finByType(yE,"income")));
          const yExp=finSum(finConfirmed(finByType(yE,"expense")));
          return <div key={y} style={{textAlign:"center",padding:"10px 0"}}>
            <div style={{...T.m,fontSize:FS.s,color:C.dim,marginBottom:6,fontWeight:600}}>{y}</div>
            <div style={{...T.t,fontSize:16,fontWeight:300,color:C.green}}>{FMT(yInc)}</div>
            <div style={{...T.m,fontSize:FS.s,color:C.dim,marginBottom:4}}>příjmy</div>
            <div style={{...T.t,fontSize:14,fontWeight:300,color:C.merlot}}>{FMT(yExp)}</div>
            <div style={{...T.m,fontSize:FS.s,color:C.dim,marginBottom:4}}>výdaje</div>
            <div style={{height:1,background:C.border,marginBottom:4}}/>
            <div style={{...T.t,fontSize:14,fontWeight:300,color:(yInc-yExp)>=0?C.blue:C.merlot}}>{FMT(yInc-yExp)}</div>
            <div style={{...T.m,fontSize:FS.s,color:C.dim}}>profit</div>
          </div>;
        })}
        {(()=>{
          const prev=finSum(finConfirmed(finByType(allEntries.filter(e=>(e.date||"").startsWith(String(yr-1))),"income")));
          const curr=finSum(finConfirmed(finByType(allEntries.filter(e=>(e.date||"").startsWith(String(yr))),"income")));
          const diff=prev>0?Math.round(((curr-prev)/prev)*100):null;
          return <div style={{textAlign:"center",padding:"10px 0",background:C.s2,borderRadius:4}}>
            <div style={{...T.m,fontSize:FS.s,color:C.dim,marginBottom:6,fontWeight:600,letterSpacing:"0.1em"}}>GROWTH</div>
            <div style={{...T.t,fontSize:24,fontWeight:300,color:diff===null?C.dim:diff>=0?C.green:C.merlot}}>{diff===null?"—":diff>=0?"+"+diff+"%":diff+"%"}</div>
            <div style={{...T.m,fontSize:FS.s,color:C.dim,marginTop:4}}>{"vs "+(yr-1)}</div>
          </div>;
        })()}
      </div>
    </Card>
  </div>;
}

        <Inp lbl="Částka (Kč)" type="number" val={f.amount} onChange={v=>u("amount")(+v)}/>
        <Inp lbl="Datum" type="date" val={f.date} onChange={u("date")}/>
        <Inp lbl="Dodavatel" val={f.supplier} onChange={u("supplier")} ph="Adobe, Google…"/>
        <Inp lbl="Projekt" val={f.projectId} onChange={u("projectId")} opts={[{v:"",l:"— bez projektu —"},...projects.map(p=>({v:p.id,l:p.name}))]}/>
        <div style={{gridColumn:"1/-1"}}><Inp lbl="Poznámka" val={f.note} onChange={u("note")} ph="Volitelný popis…"/></div>
      </div>
      <div style={{display:"flex",gap:10,marginTop:14}}><Btn ch="Uložit" onClick={save}/><Btn ch="Zrušit" onClick={()=>{setEd(null);setF(null);}} v="g"/></div>
    </Card>}
    <div style={{marginBottom:12}}><SearchBar value={q} onChange={setQ} ph="Hledat výdaje…"/></div>
    {filtered.length===0&&!ed
      ?<div style={{border:`1px dashed ${C.border}`,borderRadius:4,padding:"40px 0",textAlign:"center",...T.m,fontSize:FS.b,color:C.dim}}>Žádné výdaje</div>
      :<Card>{filtered.map((e,i)=>{
        const proj=projects.find(p=>p.id===e.projectId);
        const isLast=i===filtered.length-1;
        return <div key={e.id}
          onContextMenu={ev=>openMenu(ev,[{l:"Upravit",a:()=>{setF({...e});setEd(e.id);}},{sep:true},{l:"Smazat výdaj",a:()=>del(e.id),danger:true}])}
          style={{display:"grid",gridTemplateColumns:"90px 1fr auto",alignItems:"center",gap:16,padding:"13px 18px",borderBottom:isLast?"none":`1px solid ${C.border}`,cursor:"context-menu"}}>
          <div style={{...T.m,fontSize:FS.s,color:C.dim}}>{fmtD(e.date)}</div>
          <div style={{minWidth:0}}>
            <div style={{...T.m,fontSize:FS.b,color:C.ivory,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.name||e.supplier||"—"}</div>
            {e.category&&<div style={{...T.m,fontSize:FS.s,color:C.dim,marginTop:1}}>{e.category}{proj?` · ${proj.name}`:""}</div>}
            {e.note&&<div style={{...T.m,fontSize:FS.s,color:C.dim,marginTop:1}}>{e.note}</div>}
          </div>
          <div style={{...T.t,fontSize:FS.h,fontWeight:300,color:C.merlot,textAlign:"right"}}>{FMT(parseFloat(e.amount)||0)}</div>
        </div>;
      })}</Card>}
  {CtxMenu}</div>;
}


const MO_FULL=["Leden","Únor","Březen","Duben","Květen","Červen","Červenec","Srpen","Září","Říjen","Listopad","Prosinec"];
function CashflowView({invoices,expenses,incomes,timeEntries,settings,projects}){
  const now=new Date(),yr=now.getFullYear(),mo=now.getMonth();
  const [cashPeriod,setCashPeriod]=useState("yearly");
  const [cashType,setCashType]=useState("bar");
  const WEEK_DAYS_CF=["Po","Út","St","Čt","Pá","So","Ne"];
  let allEntries=[];
  try{allEntries=buildFinEntries(invoices||[],incomes||[],expenses||[],timeEntries||[],settings,projects||[]);}catch(e){console.error("buildFinEntries:",e);}

  const buildSlices=()=>{
    if(cashPeriod==="weekly"){
      const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
      return Array.from({length:7},(_,i)=>{
        const d=new Date(mon);d.setDate(mon.getDate()+i);
        const k=d.toISOString().slice(0,10);
        return {label:WEEK_DAYS_CF[i]+" "+k.slice(5).replace("-","."),short:WEEK_DAYS_CF[i],isCurrent:k===now.toISOString().slice(0,10),entries:allEntries.filter(e=>(e.date||"")===k)};
      });
    }
    if(cashPeriod==="monthly"){
      return Array.from({length:30},(_,i)=>{
        const dt=new Date(now);dt.setDate(dt.getDate()-(29-i));
        const k=dt.toISOString().slice(0,10);
        return {label:MO_FULL[dt.getMonth()]+" "+dt.getDate(),short:dt.getDate()+"."+(dt.getMonth()+1)+".",isCurrent:k===now.toISOString().slice(0,10),entries:allEntries.filter(e=>(e.date||"")===k)};
      });
    }
    // yearly — last 12 months
    return Array.from({length:12},(_,i)=>{
      const d=new Date(yr,mo-11+i,1);
      const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
      return {label:MO_FULL[d.getMonth()]+" "+d.getFullYear(),short:MO_NAMES[d.getMonth()],isCurrent:d.getFullYear()===yr&&d.getMonth()===mo,entries:allEntries.filter(e=>(e.date||"").startsWith(k))};
    });
  };

  const data=buildSlices().map(s=>({
    label:s.label,short:s.short,isCurrent:s.isCurrent,
    income:finSum(finConfirmed(finByType(s.entries,"income"))),
    expense:finSum(finConfirmed(finByType(s.entries,"expense"))),
    fakturovano:finFakturovano(s.entries),
    internal:finInternal(s.entries),
  }));
  data.forEach(d=>{d.profit=d.income-d.expense;});
  const rawMax=Math.max(...data.map(d=>Math.max(d.income,d.expense,d.fakturovano)));
  const maxVal=rawMax>0?rawMax:0;
  const hasAnyData=maxVal>0;
  const COLS=[
    {k:"income",     l:"Příjmy",      c:C.green,  sub:"skutečně přijaté"},
    {k:"expense",    l:"Výdaje",      c:C.merlot, sub:"skutečně zaplacené"},
    {k:"profit",     l:"Profit",      c:C.blue,   sub:"Příjmy − Výdaje",signed:true},
    {k:"fakturovano",l:"Fakturováno", c:C.blue,   sub:"čeká na platbu"},
    {k:"internal",   l:"Interní",     c:C.amber,  sub:"odměny ve firmě"},
  ];

  return <div className="anim-fadein">
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}}>
      <div>
        <div style={{...T.t,fontSize:FS.h,fontWeight:700,letterSpacing:"0.15em",color:C.ivory}}>CASHFLOW</div>
        <div style={{...T.m,fontSize:FS.s,color:C.dim,marginTop:2}}>{cashPeriod==="weekly"?"Aktuální týden (Po–Ne)":cashPeriod==="monthly"?"Posledních 30 dní":"Posledních 12 měsíců"}</div>
      </div>
      <div style={{display:"flex",gap:3}}>
        {[{id:"weekly",l:"Týden"},{id:"monthly",l:"Měsíc"},{id:"yearly",l:"Rok"}].map(p=>(
          <button key={p.id} onClick={()=>setCashPeriod(p.id)} style={{...T.m,fontSize:FS.s,padding:"5px 14px",borderRadius:3,border:"none",cursor:"pointer",
            background:cashPeriod===p.id?C.merlot:C.s2,color:cashPeriod===p.id?C.ivory:C.dim,transition:"background .15s"}}>{p.l}</button>
        ))}
      </div>
    </div>

    {/* Graf */}
    <Card sx={{padding:"16px 18px",marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,flexWrap:"wrap",gap:8}}>
        <SH c="Příjmy vs Výdaje"/>
        <div style={{display:"flex",gap:3}}>
          {[{id:"weekly",l:"Týden"},{id:"monthly",l:"Měsíc"},{id:"yearly",l:"Rok"}].map(p=>(
            <button key={p.id} onClick={()=>setCashPeriod(p.id)} style={{...T.m,fontSize:FS.s,padding:"3px 8px",borderRadius:3,border:"none",cursor:"pointer",
              background:cashPeriod===p.id?C.merlot:C.s2,color:cashPeriod===p.id?C.ivory:C.dim}}>{p.l}</button>
          ))}
          {[{id:"area",ico:"∿"},{id:"bar",ico:"▬"},{id:"scatter",ico:"⋯"}].map(t=>(
            <button key={t.id} onClick={()=>setCashType(t.id)} style={{...T.m,fontSize:11,padding:"3px 8px",borderRadius:3,border:"none",cursor:"pointer",
              background:cashType===t.id?C.bHi:C.s2,color:cashType===t.id?C.ivory:C.dim}}>{t.ico}</button>
          ))}
        </div>
      </div>
      <AreaChart series={[
        {label:"Příjmy",color:C.green,  values:data.map(d=>d.income)},
        {label:"Výdaje",color:C.merlot, values:data.map(d=>d.expense)},
      ]} labels={data.map(d=>d.short)} height={130} chartType={cashType}/>
    </Card>

    {/* Tabulka */}
    <Card sx={{padding:0,overflow:"hidden"}}>
      <div style={{padding:"16px 20px 14px",borderBottom:`1px solid ${C.border}`}}>
        <div style={{...T.t,fontSize:15,fontWeight:600,letterSpacing:"0.14em",color:C.ivory,textTransform:"uppercase"}}>Přehled po měsících</div>
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:640}}>
          <thead>
            <tr style={{background:C.s0}}>
              <th style={{...T.m,fontSize:FS.s,color:C.dim,padding:"10px 20px",textAlign:"left",letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:400,whiteSpace:"nowrap",borderBottom:`1px solid ${C.border}`}}>Měsíc</th>
              {COLS.map(col=>(
                <th key={col.k} style={{...T.m,fontSize:FS.s,color:col.c,padding:"10px 20px 10px 12px",textAlign:"right",letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:400,whiteSpace:"nowrap",borderBottom:`1px solid ${C.border}`}}>{col.l}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {data.map((d,i)=>{
              const isLast=i===data.length-1;
              const rowBg=d.isCurrent?C.s0:"transparent";
              const fmt=v=>v===0?"—":FMT(v);
              return <tr key={i} style={{background:rowBg,borderBottom:isLast?"none":`1px solid ${C.border}`,transition:"background .15s"}}
                onMouseEnter={e=>!d.isCurrent&&(e.currentTarget.style.background=C.s0)}
                onMouseLeave={e=>!d.isCurrent&&(e.currentTarget.style.background="transparent")}>
                <td style={{padding:"13px 20px",whiteSpace:"nowrap"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    {d.isCurrent&&<div style={{width:3,height:16,background:C.merlot,borderRadius:2,flexShrink:0}}/>}
                    <div>
                      <div style={{...T.m,fontSize:FS.b,color:d.isCurrent?C.ivory:C.hi,fontWeight:d.isCurrent?600:400}}>{d.label}</div>
                      {d.isCurrent&&<div style={{...T.m,fontSize:9,color:C.merlot,letterSpacing:"0.12em",textTransform:"uppercase",marginTop:1}}>Aktuální</div>}
                    </div>
                  </div>
                </td>
                <td style={{...T.m,fontSize:FS.b,color:d.income>0?C.green:C.dim,textAlign:"right",padding:"13px 20px 13px 12px",fontVariantNumeric:"tabular-nums"}}>{fmt(d.income)}</td>
                <td style={{...T.m,fontSize:FS.b,color:d.expense>0?C.merlot:C.dim,textAlign:"right",padding:"13px 20px 13px 12px",fontVariantNumeric:"tabular-nums"}}>{fmt(d.expense)}</td>
                <td style={{...T.m,fontSize:FS.b,color:d.profit>0?C.blue:d.profit<0?C.merlot:C.dim,textAlign:"right",padding:"13px 20px 13px 12px",fontVariantNumeric:"tabular-nums",fontWeight:d.isCurrent?600:400}}>{d.profit===0?"—":(d.profit>0?"+":"")+FMT(d.profit)}</td>
                <td style={{...T.m,fontSize:FS.b,color:d.fakturovano>0?C.blue:C.dim,textAlign:"right",padding:"13px 20px 13px 12px",fontVariantNumeric:"tabular-nums"}}>{fmt(d.fakturovano)}</td>
                <td style={{...T.m,fontSize:FS.b,color:d.internal>0?C.amber:C.dim,textAlign:"right",padding:"13px 20px 13px 12px",fontVariantNumeric:"tabular-nums"}}>{fmt(d.internal)}</td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
      <div style={{padding:"14px 20px",borderTop:`1px solid ${C.border}`,display:"flex",gap:20,flexWrap:"wrap"}}>
        {COLS.map(col=><div key={col.k} style={{display:"flex",gap:7,alignItems:"center"}}>
          <div style={{width:8,height:8,borderRadius:2,background:col.c,flexShrink:0}}/>
          <span style={{...T.m,fontSize:FS.s,color:C.dim}}>{col.l} — {col.sub}</span>
        </div>)}
      </div>
    </Card>
  </div>;
}


const DEF_STRATEGY=[
  {id:"s1",num:"7",text:"leadů týdně"},
  {id:"s2",text:"Týdenní zápis nejpozději v neděli v 15:00",bold:true},
  {id:"s3",text:"Volat vždy v jeden smluvený den",bold:true},
  {id:"s4",text:"Případné doplňující hovory napsat do tabulky Hovory"},
];
function OutreachView({leads,setLeads,calls,setCalls,clients,setClients,settings,onSaveSettings,authRole,confirmFn}){
  const people=(settings.people||[]).filter(p=>p.active!==false);
  const [showLeadForm,setShowLeadForm]=useState(false);
  const [showCallForm,setShowCallForm]=useState(false);
  const [leadF,setLeadF]=useState(null);
  const [callF,setCallF]=useState(null);
  const [editLeadId,setEditLeadId]=useState(null);
  const [editCallId,setEditCallId]=useState(null);
  const {openMenu,CtxMenu}=useCtxMenu();
  const [strategyOpen,setStrategyOpen]=useState(true);
  const [editingStrategy,setEditingStrategy]=useState(false);
  const [stratDraft,setStratDraft]=useState(null);
  const canEditStrategy=authRole&&(authRole.isAdmin||authRole.v==="admin"||authRole.v==="ceo"||!!((settings.rolePerms?.[authRole.v]||{}).special||{}).editOutreachStrategy);
  const strategy=settings.outreachStrategy||DEF_STRATEGY;
  const saveStrategy=()=>{if(onSaveSettings)onSaveSettings({...settings,outreachStrategy:stratDraft});setEditingStrategy(false);setStratDraft(null);};

  const blankLead={id:uid(),name:"",date:toDay(),takenBy:people[0]?.id||"",phone:"",email:"",instagram:"",web:"",facebook:"",otherMarketing:"",notes:""};
  const blankCall={id:uid(),personName:"",phone:"",calledBy:people[0]?.id||"",datetime:toDay()+"T09:00",notes:"",attempts:[]};

  const isBusinessHours=()=>{const h=new Date().getHours();return (h>=9&&h<11)||(h>=13&&h<17);};
  const callFromLead=l=>{
    if(!isBusinessHours()){alert("Hovory jsou dostupné pouze 9–11 h a 13–17 h.");return;}
    const newCall={id:uid(),personName:l.name,phone:l.phone,calledBy:l.takenBy||people[0]?.id||"",datetime:new Date().toISOString().slice(0,16),notes:"",attempts:[],leadId:l.id};
    setCalls(prev=>[newCall,...(prev||[])]);
    if(l.phone)window.open("tel:"+l.phone.replace(/\s/g,""),"_self");
  };
  const recordResult=(callId,type)=>{
    setCalls(prev=>(prev||[]).map(c=>{
      if(c.id!==callId)return c;
      const attempts=[...(c.attempts||[]),{type,dt:new Date().toISOString()}];
      const next=new Date(c.datetime||new Date());next.setDate(next.getDate()+7);
      return {...c,attempts,datetime:next.toISOString().slice(0,16)};
    }));
    if(type==="success"&&setClients){
      const call=(calls||[]).find(c=>c.id===callId);
      const lead=call?.leadId?(leads||[]).find(l=>l.id===call.leadId):null;
      const nc={id:uid(),name:lead?.name||call?.personName||"",company:"",phone:lead?.phone||call?.phone||"",email:lead?.email||"",web:lead?.web||"",notes:lead?.notes||"",startDate:toDay(),isNew:true,country:"Česká republika",ico:"",dic:"",street:"",city:"",zip:"",billingRate:0,budgetRate:0,budgetCurrency:"CZK"};
      setClients(prev=>[nc,...(prev||[])]);
    }
  };

  // Leads
  const saveLead=()=>{
    if(!leadF||!leadF.name)return;
    const next=editLeadId
      ?(leads||[]).map(l=>l.id===editLeadId?{...leadF}:l)
      :[{...leadF,id:uid()},...(leads||[])];
    setLeads(next);
    setLeadF(null);setShowLeadForm(false);setEditLeadId(null);
  };
  const delLead=async id=>{
    if(await confirmFn("Smazat tento lead?"))setLeads((leads||[]).filter(l=>l.id!==id));
  };
  const editLead=l=>{setLeadF({...l});setEditLeadId(l.id);setShowLeadForm(true);setShowCallForm(false);};

  // Calls
  const saveCall=()=>{
    if(!callF||!callF.personName)return;
    const next=editCallId
      ?(calls||[]).map(c=>c.id===editCallId?{...callF}:c)
      :[{...callF,id:uid()},...(calls||[])];
    setCalls(next);
    setCallF(null);setShowCallForm(false);setEditCallId(null);
  };
  const delCall=async id=>{
    if(await confirmFn("Smazat tento hovor?"))setCalls((calls||[]).filter(c=>c.id!==id));
  };
  const editCall=c=>{setCallF({...c});setEditCallId(c.id);setShowCallForm(true);setShowLeadForm(false);};

  const ul=k=>v=>setLeadF(p=>({...p,[k]:v}));
  const uc=k=>v=>setCallF(p=>({...p,[k]:v}));

  // Stats
  const now=new Date();
  const weekStart=new Date(now);
  weekStart.setDate(now.getDate()-now.getDay()+1);
  const weekKey=weekStart.toISOString().slice(0,10);
  const leadsThisWeek=(leads||[]).filter(l=>l.date>=weekKey).length;
  const callsThisWeek=(calls||[]).filter(c=>(c.datetime||c.date||"").slice(0,10)>=weekKey).length;

  return <><div className="anim-fadein">

    {/* Hlavička */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20,flexWrap:"wrap",gap:12}}>
      <div>
        <div style={{...T.t,fontSize:FS.h,fontWeight:700,letterSpacing:"0.15em",color:C.ivory}}>OUTREACH</div>
        <div style={{...T.m,fontSize:FS.s,color:C.dim,marginTop:2}}>Leady a hovory · týdenní zápis</div>
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <Btn ch="✎ Zapsat nový lead" onClick={()=>{setLeadF({...blankLead,id:uid()});setShowLeadForm(true);setShowCallForm(false);setEditLeadId(null);}}/>
        <Btn ch="✆ Zapsat nový hovor" onClick={()=>{setCallF({...blankCall,id:uid()});setShowCallForm(true);setShowLeadForm(false);setEditCallId(null);}} v="g"/>
      </div>
    </div>

    {/* Strategie */}
    <Card sx={{marginBottom:16,overflow:"hidden"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 18px",cursor:"pointer",borderBottom:strategyOpen?`1px solid ${C.border}`:"none"}} onClick={()=>setStrategyOpen(o=>!o)}>
        <div style={{width:8,height:8,borderRadius:"50%",background:C.blue,flexShrink:0}}/>
        <span style={{...T.t,fontSize:FS.b,fontWeight:600,letterSpacing:"0.12em",color:C.ivory}}>Outreach Strategie</span>
        {canEditStrategy&&!editingStrategy&&<span onClick={e=>{e.stopPropagation();setStratDraft(strategy.map(s=>({...s})));setEditingStrategy(true);setStrategyOpen(true);}} style={{...T.m,fontSize:FS.s,color:C.dim,marginLeft:"auto",padding:"2px 8px",borderRadius:3,border:`1px solid ${C.border}`,cursor:"pointer"}}>Upravit</span>}
        {!canEditStrategy&&<span style={{...T.m,fontSize:FS.s,color:C.dim,marginLeft:"auto"}}>{strategyOpen?"▲":"▼"}</span>}
        {canEditStrategy&&editingStrategy&&<span style={{...T.m,fontSize:FS.s,color:C.dim,marginLeft:"auto"}}>{strategyOpen?"▲":"▼"}</span>}
      </div>
      {strategyOpen&&!editingStrategy&&<div style={{padding:"14px 20px 16px",display:"flex",flexDirection:"column",gap:10}}>
        {strategy.map((item,i)=><div key={item.id||i} style={{...T.m,fontSize:FS.b,color:C.ivory,lineHeight:1.6}}>
          {item.num&&<span style={{color:C.blue,fontWeight:700,marginRight:6}}>{item.num}</span>}
          <span style={{fontWeight:item.bold?700:400,color:item.bold?C.ivory:C.hi}}>{item.text}</span>
        </div>)}
      </div>}
      {strategyOpen&&editingStrategy&&stratDraft&&<div style={{padding:"14px 20px 16px",display:"flex",flexDirection:"column",gap:8}}>
        {stratDraft.map((item,i)=><div key={item.id||i} style={{display:"flex",gap:8,alignItems:"center"}}>
          <input value={item.num||""} onChange={e=>{const d=[...stratDraft];d[i]={...d[i],num:e.target.value};setStratDraft(d);}} placeholder="#" style={{...T.m,fontSize:FS.s,width:36,background:C.s2,border:`1px solid ${C.border}`,borderRadius:3,padding:"4px 6px",color:C.blue,textAlign:"center"}}/>
          <input value={item.text} onChange={e=>{const d=[...stratDraft];d[i]={...d[i],text:e.target.value};setStratDraft(d);}} style={{...T.m,fontSize:FS.b,flex:1,background:C.s2,border:`1px solid ${C.border}`,borderRadius:3,padding:"6px 10px",color:C.ivory,fontWeight:item.bold?700:400}}/>
          <label style={{display:"flex",alignItems:"center",gap:4,...T.m,fontSize:FS.s,color:C.dim,cursor:"pointer"}}>
            <input type="checkbox" checked={!!item.bold} onChange={e=>{const d=[...stratDraft];d[i]={...d[i],bold:e.target.checked};setStratDraft(d);}} style={{accentColor:C.merlot}}/>tučně
          </label>
          <span onClick={()=>setStratDraft(stratDraft.filter((_,j)=>j!==i))} style={{color:C.merlot,cursor:"pointer",fontSize:16,lineHeight:1}}>×</span>
        </div>)}
        <div style={{display:"flex",gap:8,marginTop:4}}>
          <Btn ch="+ Řádek" onClick={()=>setStratDraft([...stratDraft,{id:"s"+uid(),text:"",num:"",bold:false}])} v="g" sx={{padding:"4px 10px",fontSize:12}}/>
          <Btn ch="Uložit" onClick={saveStrategy} sx={{padding:"4px 10px",fontSize:12}}/>
          <Btn ch="Zrušit" onClick={()=>{setEditingStrategy(false);setStratDraft(null);}} v="g" sx={{padding:"4px 10px",fontSize:12}}/>
        </div>
      </div>}
    </Card>

    {/* KPI */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:16}} className="grid-kpi">
      {[
        {l:"Leady tento týden",v:leadsThisWeek,c:C.green,target:settings.outreachTarget||7},
        {l:"Hovory tento týden",v:callsThisWeek,c:C.blue},
        {l:"Leady celkem",v:(leads||[]).length,c:C.ivory},
        {l:"Hovory celkem",v:(calls||[]).length,c:C.ivory},
      ].map(k=>{
        const pct=k.target?Math.min((k.v/k.target)*100,100):0;
        const barC=k.target?(k.v>=k.target?C.green:pct>=50?C.amber:C.merlot):null;
        return <Card key={k.l} sx={{padding:"12px 16px"}}>
          <Lbl c={k.l} s={{marginBottom:4}}/>
          {k.target
            ?<div style={{display:"flex",alignItems:"center",gap:10,marginTop:6}}>
                <div style={{flex:1,height:3,background:C.s2,borderRadius:2}}>
                  <div style={{height:"100%",width:pct+"%",background:barC,borderRadius:2,transition:"width .4s"}}/>
                </div>
                <div style={{...T.t,fontSize:FS.h,fontWeight:300,color:barC,lineHeight:1,flexShrink:0}}>{k.v}<span style={{fontSize:14,color:C.dim}}> / {k.target}</span></div>
              </div>
            :<div style={{...T.t,fontSize:FS.h,fontWeight:300,color:k.c,lineHeight:1,marginTop:6}}>{k.v}</div>
          }
        </Card>;
      })}

    {/* Lead form */}
    {showLeadForm&&leadF&&<Card sx={{padding:18,marginBottom:14,borderColor:C.mBorder,animation:"scaleIn .22s cubic-bezier(.22,1,.36,1)"}}>

        <Inp lbl="Datum" type="date" val={leadF.date} onChange={ul("date")}/>
        <Inp lbl="Telefon" val={leadF.phone} onChange={ul("phone")} ph="+420 xxx xxx xxx"/>
        <Inp lbl="E-mail" type="email" val={leadF.email} onChange={ul("email")} ph="kontakt@firma.cz"/>
        <Inp lbl="Převzal" val={leadF.takenBy} onChange={ul("takenBy")} opts={[{v:"",l:"— vyberte osobu —"},...people.map(p=>({v:p.id,l:p.name}))]}/>
        <div style={{gridColumn:"1/-1"}}><Inp lbl="Poznámky" val={leadF.notes} onChange={ul("notes")} ph="Poznámky k leadu…" ml rows={2}/></div>
      </div>
      <div style={{marginTop:14,paddingTop:14,borderTop:`1px solid ${C.border}`}}>
        <div style={{...T.m,fontSize:FS.s,color:C.dim,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:12}}>Research</div>
        <div className="grid-2-inp">
          <Inp lbl="Instagram" val={leadF.instagram} onChange={ul("instagram")} ph="@profil nebo URL"/>
          <Inp lbl="Webové stránky" val={leadF.web} onChange={ul("web")} ph="www.firma.cz"/>
          <Inp lbl="Facebook" val={leadF.facebook} onChange={ul("facebook")} ph="facebook.com/firma"/>
          <Inp lbl="Jiný marketing" val={leadF.otherMarketing} onChange={ul("otherMarketing")} ph="TikTok, LinkedIn, YouTube…"/>
        </div>
      </div>
      <div style={{display:"flex",gap:10,marginTop:14}}>
        <Btn ch="Uložit lead" onClick={saveLead}/>
        <Btn ch="Zrušit" onClick={()=>{setShowLeadForm(false);setLeadF(null);setEditLeadId(null);}} v="g"/>
      </div>
    </Card>}

    {/* Call form */}
    {showCallForm&&callF&&<Card sx={{padding:18,marginBottom:14,borderColor:C.mBorder,animation:"scaleIn .22s cubic-bezier(.22,1,.36,1)"}}>
      <SH c={editCallId?"Upravit hovor":"Nový hovor"}/>
      <div className="grid-2-inp">
        <Inp lbl="Jméno kontaktu" val={callF.personName} onChange={uc("personName")} ph="Jan Novák…"/>
        <Inp lbl="Telefon" val={callF.phone} onChange={uc("phone")} ph="+420 xxx xxx xxx"/>
        <Inp lbl="Datum a čas" type="datetime-local" val={callF.datetime} onChange={uc("datetime")}/>
        <Inp lbl="Kdo volal" val={callF.calledBy} onChange={uc("calledBy")} opts={[{v:"",l:"— vyberte osobu —"},...people.map(p=>({v:p.id,l:p.name}))]}/>
        <div style={{gridColumn:"1/-1"}}><Inp lbl="Poznámky" val={callF.notes} onChange={uc("notes")} ph="Průběh hovoru, výsledek…" ml rows={2}/></div>
      </div>
      <div style={{display:"flex",gap:10,marginTop:14}}>
        <Btn ch="Uložit hovor" onClick={saveCall}/>
        <Btn ch="Zrušit" onClick={()=>{setShowCallForm(false);setCallF(null);setEditCallId(null);}} v="g"/>

    {/* Tabulka Leady */}
    <div style={{marginBottom:24}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <SH c={"Zápis leadů ("+(leads||[]).length+")"}/>
      </div>
      {(leads||[]).length===0
        ?<div style={{border:`1px dashed ${C.border}`,borderRadius:4,padding:"32px 0",textAlign:"center",...T.m,fontSize:FS.b,color:C.dim}}>Žádné leady — zapište první lead tlačítkem výše</div>
        :<Card>
          <div style={{display:"grid",gridTemplateColumns:"1.6fr 0.85fr 1fr 1fr 1fr 1.4fr 72px",gap:0}}>
            {["Lead","Datum","Telefon","E-mail","Převzal","Poznámky","Akce"].map(h=><div key={h} style={{...T.m,fontSize:FS.s,color:C.dim,padding:"9px 16px",borderBottom:`1px solid ${C.border}`,letterSpacing:"0.1em",textTransform:"uppercase"}}>{h}</div>)}

              const lCtx=e=>openMenu(e,[{l:"Upravit lead",a:()=>editLead(l)},{sep:true},{l:"Smazat lead",a:()=>delLead(l.id),danger:true}]);

              return [
                <div key={l.id+"n"} onContextMenu={lCtx} style={{...cs,...T.m,fontSize:FS.b,color:C.ivory,fontWeight:500}}>{l.name}</div>,

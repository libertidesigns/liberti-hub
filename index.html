/* ── App ───────────────────────────────────────────────────────── */

// ═══════════════════════════════════════════════════════════════
// SEKCE 9: APP — hlavni komponenta, state, navigace, orchestrace
// ═══════════════════════════════════════════════════════════════

function App(){
  const [authed,setAuthed]=useState(()=>{
    const r=localStorage.getItem("liberti_auth_role");
    const u=localStorage.getItem("liberti_user");
    if(!r||!u)return false;
    if(r==="admin")return true;
    // Pouze pokud je role nalezena v cache — jinak vynutíme re-login
    try{const roles=JSON.parse(localStorage.getItem("liberti_roles")||"[]");return !!roles.find(x=>x.v===r);}catch(e){return false;}
  });
  const [authRole,setAuthRole]=useState(()=>{
    const r=localStorage.getItem("liberti_auth_role");
    if(!r)return null;
    if(r==="admin")return {v:"admin",l:"Admin",isAdmin:true};
    // Žádný fallback — pokud role není v cache, vrátíme null (= re-login)
    try{const roles=JSON.parse(localStorage.getItem("liberti_roles")||"[]");return roles.find(x=>x.v===r)||null;}catch(e){return null;}
  });
  const [authUser,setAuthUser]=useState(()=>localStorage.getItem("liberti_user")||null);
  // personId pro napojení přihlášeného uživatele na záznamy (úkoly, docházka)
  const [authPersonId,setAuthPersonId]=useState(()=>localStorage.getItem("liberti_person_id")||null);
  const [invoices,setInvState]=useState([]);
  const [clients,setCliState]=useState([]);
  const [templateItems,setTplState]=useState([]);
  const [vouchers,setVchState]=useState([]);
  const [projects,setProjState]=useState([]);
  const [tasks,setTaskState]=useState([]);
  const [timeEntries,setEntryState]=useState([]);
  const [expenses,setExpState]=useState([]);
  const [incomes,setIncState]=useState([]);
  const [benefitCategories,setBenCatState]=useState([]);
  const [teams,setTeamsState]=useState([]);
  const [leads,setLeadsState]=useState([]);
  const [calls,setCallsState]=useState([]);
  const [meetings,setMeetState]=useState([]);
  const [changeLog,setLogState]=useState([]);
  const [bonuses,setBonState]=useState([]);
  const [movements,setMovState]=useState([]);
  const [goals,setGoalState]=useState([]);
  const [settings,setSetState]=useState(DEF);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [loadErr,setLoadErr]=useState("");
  // Obnova navigace z localStorage — zapamatuje poslední stránku
  const [module,setModule]=useState(()=>{try{const n=JSON.parse(localStorage.getItem("liberti_nav")||"{}");return n.module||"system";}catch(e){return"system";}});
  const [view,setView]=useState(()=>{try{const n=JSON.parse(localStorage.getItem("liberti_nav")||"{}");return n.view||"settings";}catch(e){return"settings";}});
  const [firmaView,setFirmaView]=useState(()=>{try{const n=JSON.parse(localStorage.getItem("liberti_nav")||"{}");return n.firmaView||"clients";}catch(e){return"clients";}});
  const [finView,setFinView]=useState(()=>{try{const n=JSON.parse(localStorage.getItem("liberti_nav")||"{}");const v=n.finView||"overview";return v==="editor"?"overview":v;}catch(e){return"overview";}});
  const [offView,setOffView]=useState(()=>{try{const n=JSON.parse(localStorage.getItem("liberti_nav")||"{}");return n.offView||"projects";}catch(e){return"projects";}});
  const [finPeriod,setFinPeriod]=useState("year");
  const [incPeriod,setIncPeriod]=useState("year");
  const [expPeriod,setExpPeriod]=useState("year");
  const [editing,setEditing]=useState(null);
  const [toast,setToast]=useState("");
  const [theme,setTheme]=useState(()=>localStorage.getItem("liberti_theme")||"dark");
  const switchTheme=t=>{localStorage.setItem("liberti_theme",t);setTheme(t);window.location.reload();};
  const [mobileNavOpen,setMobileNavOpen]=useState(false);
  const {confirm,Modal}=useConfirm();
  const [taskDetailId,setTaskDetailId]=useState(()=>{try{return localStorage.getItem("liberti_active_panel")||null;}catch(e){return null;}});
  const [taskPanelMin,setTaskPanelMin]=useState(false);
  useEffect(()=>{try{if(taskDetailId)localStorage.setItem("liberti_active_panel",taskDetailId);else localStorage.removeItem("liberti_active_panel");}catch(e){};},[taskDetailId]);
  // Timer — lives here so it persists across navigation
  // Timer — persists across navigation via useRef inside useTimer
  const timerSaveFn=useRef(null);
  const timer=useTimer(useCallback((entry)=>{
    if(timerSaveFn.current)timerSaveFn.current(entry);
  },[]));
  timerSaveFn.current=(entry)=>{
    const person=(settings.people||[]).find(p=>p.id===entry.personId);
    const rate=person?person.rate||0:0;
    const billingRate=(projects||[]).find(pr=>pr.id===entry.projectId)?.billingRate||0;
    const newEntry=Object.assign({},entry,{id:uid(),rate,billingRate});
    const updated=[newEntry,...timeEntries];
    setEntries(updated);
    showToast("✓ Čas uložen");
  };


  useEffect(()=>{if(authed)load();},[authed]);
  useEffect(()=>{
    const onClose=()=>localStorage.removeItem("liberti_auth");
    window.addEventListener("pagehide",onClose);
    return()=>window.removeEventListener("pagehide",onClose);
  },[]);
  // Ukládání aktuální navigace do localStorage při každé změně stránky
  useEffect(()=>{
    if(!authed)return;
    try{localStorage.setItem("liberti_nav",JSON.stringify({module,view,firmaView,finView,offView}));}catch(e){}
  },[module,view,firmaView,finView,offView,authed]);
  // Po načtení settings: ověř zda má uživatel přístup k aktuální stránce, jinak přesměruj
  useEffect(()=>{
    if(loading||!authed||!authRole)return;
    if(authRole.isAdmin||authRole.v==="admin")return; // admin má přístup všude
    const rp=(settings.rolePerms||{})[authRole.v]||{};
    // Zkontroluj viditelnost modulu
    if(rp[module+"_visible"]===false){
      const firstMod=["firma","office","finance","system"].find(m=>rp[m+"_visible"]!==false)||"system";
      setModule(firstMod);
      return;
    }
    // Zkontroluj přístup k aktuální stránce v modulu
    const allowed=(rp[module]||{}).read||[];
    if(!allowed.length)return; // prázdné = žádná omezení
    const cur=module==="system"?view:module==="firma"?firmaView:module==="finance"?finView:offView;
    if(!allowed.includes(cur)){
      const s=module==="system"?setView:module==="firma"?setFirmaView:module==="finance"?setFinView:setOffView;
      s(allowed[0]);
    }
  },[loading,settings,authRole,module]);

  const load=async()=>{
    setLoading(true);setLoadErr("");
    const safe=p=>p.catch(()=>null);
    const[inv,cli,tpl,vch,set,proj,tsk,te,exp,inc,bcat,tms,lds,cls,mts,clog,bon,mvs,gls,ppl,oskills]=await Promise.all([
      safe(apiRead("invoices")),safe(apiRead("clients")),safe(apiRead("templateItems")),safe(apiRead("vouchers")),
      safe(apiRead("settings")),safe(apiRead("projects")),safe(apiRead("tasks")),safe(apiRead("timeEntries")),
      safe(apiRead("expenses")),safe(apiRead("incomes")),safe(apiRead("benefitCategories")),safe(apiRead("teams")),
      safe(apiRead("leads")),safe(apiRead("calls")),safe(apiRead("meetings")),safe(apiRead("changeLog")),
      safe(apiRead("bonuses")),safe(apiRead("movements")),safe(apiRead("goals")),
      safe(apiRead("people")),safe(apiRead("orgSkills"))
    ]);
    // If core data completely missing AND we have no cached data → show error
    if(!Array.isArray(inv)&&!Array.isArray(cli)&&!inv&&!cli){
      setLoadErr("Nepodařilo se připojit k databázi. Zkontroluj připojení k internetu.");
    } else {
      setInvState(Array.isArray(inv)?inv:invoices);
      setCliState(Array.isArray(cli)?cli:clients);
      setTplState(Array.isArray(tpl)?tpl:templateItems);
      setVchState(Array.isArray(vch)?vch:vouchers);
      setProjState(Array.isArray(proj)?proj:projects);
      setTaskState(Array.isArray(tsk)?tsk:tasks);
      setEntryState(Array.isArray(te)?te:timeEntries);
      setExpState(Array.isArray(exp)?exp:expenses);
      setIncState(Array.isArray(inc)?inc:incomes);
      setBenCatState(Array.isArray(bcat)?bcat:benefitCategories);
      setTeamsState(Array.isArray(tms)?tms:teams);
      setLeadsState(Array.isArray(lds)?lds:leads);
      setCallsState(Array.isArray(cls)?cls:calls);
      setMeetState(Array.isArray(mts)?mts:meetings);
      setLogState(Array.isArray(clog)?clog:changeLog);
      setBonState(Array.isArray(bon)?bon:bonuses);
      setMovState(Array.isArray(mvs)?mvs:movements);
      setGoalState(Array.isArray(gls)?gls:goals);
      const newSettings=set&&typeof set==="object"?{...DEF,...set}:DEF;
      // people a orgSkills jsou uloženy odděleně; při první migraci fallback na settings.people/orgSkills
      const loadedPeople=Array.isArray(ppl)?ppl:(newSettings.people||[]);
      const loadedOrgSkills=Array.isArray(oskills)?oskills:(newSettings.orgSkills||[]);
      setSetState({...newSettings,people:loadedPeople,orgSkills:loadedOrgSkills});
      // Cache roles a people pro offline login — VŠECHNY role (system + custom)
      const sysRoles=newSettings.systemRoles||DEF.systemRoles||[];
      const custRoles=newSettings.customRoles||[];
      const allRolesCache=[...sysRoles,...custRoles];
      const people=newSettings.people||[];
      if(people.length>0)localStorage.setItem("liberti_people",JSON.stringify(people));
      if(allRolesCache.length>0)localStorage.setItem("liberti_roles",JSON.stringify(allRolesCache));
      // Po načtení: pokud ještě nemáme personId, pokusíme se ho najít podle authUser
      const currentUser=localStorage.getItem("liberti_user")||"";
      const currentPersonId=localStorage.getItem("liberti_person_id")||"";
      if(currentUser&&!currentPersonId&&currentUser!=="admin"){
        const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,".");
        const foundPerson=loadedPeople.find(p=>{
          const u=currentUser.toLowerCase();
          if(p.username&&p.username.toLowerCase()===u)return true;
          if(p.name){const n=p.name.toLowerCase();const nn=norm(p.name);if(n===u||nn===norm(u)||n.split(" ")[0]===u)return true;}
          return false;
        });
        if(foundPerson){localStorage.setItem("liberti_person_id",foundPerson.id);setAuthPersonId(foundPerson.id);}
      }
      // Po načtení settings: aktualizuj authRole na aktuální data z DB
      setAuthRole(prev=>{
        if(!prev||prev.v==="admin")return prev;
        const fresh=allRolesCache.find(r=>r.v===prev.v);
        if(fresh)return fresh;
        // Role neexistuje v DB — odhlásit
        localStorage.removeItem("liberti_auth_role");localStorage.removeItem("liberti_user");
        setAuthed(false);setAuthUser(null);
        return null;
      });
    }
    setLoading(false);
  };

  const bgSave=async(type,data)=>{setSaving(true);try{await apiWrite(type,data);showToast("✓ Uloženo");}catch(e){showToast("⚠ Chyba uložení ("+type+")");}finally{setSaving(false);}};
  const bgSaveSilent=async(type,data)=>{setSaving(true);try{await apiWrite(type,data);}catch(e){}finally{setSaving(false);}};
  // Uloží people odděleně (typ "people") a synchronizuje do settings objektu v paměti
  const saveTeamPeople=d=>{setSetState(prev=>({...prev,people:d}));bgSave("people",d);};
  // Uloží orgSkills odděleně (typ "orgSkills") a synchronizuje do settings objektu v paměti
  const saveTeamOrgSkills=d=>{setSetState(prev=>({...prev,orgSkills:d}));bgSave("orgSkills",d);};
  const setInv=d=>{setInvState(d);bgSave("invoices",d);};
  const setCli=d=>{setCliState(d);bgSave("clients",d);};
  const setTpl=d=>{setTplState(d);bgSave("templateItems",d);};
  const setVch=d=>{setVchState(d);bgSave("vouchers",d);};
  const setProj=d=>{setProjState(d);bgSave("projects",d);};
  const setTasks=d=>{setTaskState(d);bgSave("tasks",d);};
  const setEntries=d=>{setEntryState(d);bgSave("timeEntries",d);};
  // Timer save handled in useTimer callback above
  const setExp=d=>{setExpState(d);bgSave("expenses",d);};
  const setInc=d=>{setIncState(d);bgSave("incomes",d);};
  const setBenCat=d=>{setBenCatState(d);bgSave("benefitCategories",d);};
  const setTeams=d=>{setTeamsState(d);bgSave("teams",d);};
  const setLeads=d=>{setLeadsState(d);bgSave("leads",d);};
  const setMeetings=d=>{setMeetState(d);bgSave("meetings",d);};
  const addLog=(action,type,description)=>{
    if(authRole!=="admin"&&authRole!=="employee")return;
    const entry={id:uid(),action,type,description,user:authRole==="admin"?"Admin":authUser||"",ts:new Date().toISOString()};
    setLogState(prev=>{const next=[entry,...prev].slice(0,500);bgSave("changeLog",next);return next;});
  };
  const setCalls=d=>{setCallsState(d);bgSave("calls",d);};
  const setBon=d=>{setBonState(d);bgSave("bonuses",d);};
  const setMovements=d=>{setMovState(d);bgSave("movements",d);};
  const setGoals=d=>{setGoalState(d);bgSave("goals",d);};
  const setSet=d=>{
    setSetState(d);
    // people a orgSkills jsou uloženy odděleně — settings payload bez nich
    const{people:_p,orgSkills:_o,...settingsOnly}=d;
    bgSave("settings",settingsOnly);
  };
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(""),3000);};

  const mkNum=()=>{
    const prefix=settings.prefix||"FAK";
    const yr=new Date().getFullYear();
    const yrStr=String(yr);
    const used=new Set(invoices.flatMap(inv=>{
      if(!inv.number)return[];
      const parts=inv.number.split("-");
      if(parts.length<3)return[];
      const invYear=parts[parts.length-2];
      const invSeq=parseInt(parts[parts.length-1])||0;
      const invPrefix=parts.slice(0,parts.length-2).join("-");
      return invPrefix===prefix&&invYear===yrStr?[invSeq]:[];
    }));
    let seq=1;
    while(used.has(seq))seq++;
    return `${prefix}-${yrStr}-${String(seq).padStart(4,"0")}`;
  };
  const newInv=(prefillClient)=>{
    const d=toDay();
    const cl=prefillClient||(clients[0])||{};
    setEditing({id:uid(),number:mkNum(),variableSymbol:"",status:"Koncept",issueDate:d,duzp:d,duzpManual:false,dueDate:plusD(d,settings.payDays||14),paymentMethod:"Převodem",client:{...cl},items:[{id:uid(),description:"",qty:1,unit:"ks",unitPrice:0}],note:"",vatEnabled:!!settings.vatPayer,vatRate:21,discount:{enabled:false,type:"pct",value:0},projectId:""});
    setFinView("editor");
  };
  const saveInv=inv=>{
    const isNew=!invoices.find(i=>i.id===inv.id);
    const upd=isNew?[inv,...invoices]:invoices.map(i=>i.id===inv.id?inv:i);
    setInv(upd);
    if(isNew)setSet({...settings,nextNum:(settings.nextNum||1)+1});
    setEditing(inv);showToast("✓ Uloženo");
  };
  const dupInv=inv=>{
    const d=toDay();
    setEditing({...inv,id:uid(),number:mkNum(),status:"Koncept",issueDate:d,duzp:d,duzpManual:false,dueDate:plusD(d,settings.payDays||14)});
    setSet({...settings,nextNum:(settings.nextNum||1)+1});
    setFinView("editor");
  };
  const logout=async()=>{
    const ok=await confirm("Odhlásit se z LIBERTI Hub?");
    if(ok){
      localStorage.removeItem("liberti_auth_role");
      localStorage.removeItem("liberti_user");
      localStorage.removeItem("liberti_nav");
      localStorage.removeItem("liberti_person_id");
      // Reset navigace na výchozí hodnoty
      setModule("system");setView("settings");setFirmaView("clients");setFinView("overview");setOffView("projects");
      setAuthed(false);setAuthRole(null);setAuthUser(null);setAuthPersonId(null);
    }
  };

  // ── Project → Invoice generation ──────────────────────────────
  const invoiceProject=(proj,unbilledEntries,people)=>{
    const d=toDay();
    const cl=clients.find(c=>c.id===proj.clientId);
    // Group entries by person + description
    const grouped={};
    unbilledEntries.forEach(e=>{
      const person=people.find(p=>p.id===e.personId);
      const key=(person?.name||"Práce")+"|"+(e.description||"Práce na projektu");
      if(!grouped[key])grouped[key]={desc:`${person?.name||"Práce"} — ${e.description||"Práce na projektu"}`,mins:0,rate:e.rate||0};
      grouped[key].mins+=e.minutes||0;
    });
    const items=Object.values(grouped).map(g=>({
      id:uid(),description:g.desc,qty:Math.round(g.mins/60*100)/100,unit:"hod",unitPrice:g.rate
    }));
    const newI={
      id:uid(),number:mkNum(),variableSymbol:"",status:"Koncept",
      issueDate:d,duzp:d,duzpManual:false,dueDate:plusD(d,settings.payDays||14),
      paymentMethod:"Převodem",
      client:cl?{id:cl.id,name:cl.name,company:cl.company,street:cl.street,city:cl.city,zip:cl.zip,country:cl.country,ico:cl.ico,dic:cl.dic,email:cl.email,phone:cl.phone}:{},
      items,note:`Faktura za projekt: ${proj.name}`,
      vatEnabled:!!settings.vatPayer,vatRate:21,discount:{enabled:false,type:"pct",value:0},
      projectId:proj.id
    };
    // Mark entries as billed
    const updEntries=timeEntries.map(e=>unbilledEntries.find(u=>u.id===e.id)?{...e,billed:true,invoiceId:newI.id}:e);
    setEntries(updEntries);
    setInv([newI,...invoices]);
    setSet({...settings,nextNum:(settings.nextNum||1)+1});
    setEditing(newI);
    setModule("finance");
    setFinView("editor");
    showToast(`✓ Faktura ${newI.number} vytvořena`);
  };

  if(!authed)return <PinLogin onSuccess={(role,user)=>{
    setAuthed(true);setAuthRole(role);setAuthUser(user);
    // Načti personId z localStorage (uloženo v doLogin při non-admin přihlášení)
    const pid=localStorage.getItem("liberti_person_id")||null;
    setAuthPersonId(pid);
    // Reset view na první dostupnou stránku pro tuto roli
    const isAdm=role&&(role.isAdmin||role.v==="admin");
    if(!isAdm){
      const rp=(settings.rolePerms||{})[role.v]||{};
      const ev=settings.employeeVisibility||{};
      // Najdi první viditelný modul
      // Použij homepage z role pokud je nastavena
      const allRolesLS=typeof DEF!=="undefined"?(DEF.systemRoles||[]):[];
      const roleObj=[...allRolesLS,...(typeof DEF!=="undefined"?(DEF.customRoles||[]):[])].find(r=>r.v===role.v)||role;
      const hp=roleObj.homepage||"";
      if(hp){
        const [hpMod,hpPage]=hp.split("/");
        setModule(hpMod||"system");
        if(hpMod==="system")setView(hpPage||"settings");
        else if(hpMod==="firma")setFirmaView(hpPage||"clients");
        else if(hpMod==="finance")setFinView(hpPage||"overview");
        else setOffView(hpPage||"projects");
      } else {
        const mods=["system","firma","finance","office"];
        for(const mod of mods){
          if(rp[mod+"_visible"]===false)continue;
          setModule(mod);
          const allowed=(rp[mod]||{}).read||[];
          if(allowed.length>0){
            if(mod==="system")setView(allowed[0]);
            else if(mod==="firma")setFirmaView(allowed[0]);
            else if(mod==="finance")setFinView(allowed[0]);
            else setOffView(allowed[0]);
          }
          break;
        }
      }
    }
  }}/>;
  if(loading)return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:24}}>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:14}}>
        <div style={{fontFamily:"'Teko',sans-serif",fontWeight:300,fontSize:"clamp(48px,8vw,72px)",letterSpacing:"0.26em",textIndent:"0.26em",color:C.ivory,lineHeight:1,textAlign:"center"}}>
          LIBERTI
        </div>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div style={{height:1,width:60,background:"rgba(139,26,26,.6)"}}/>
          <div style={{fontFamily:"'Teko',sans-serif",fontWeight:300,fontSize:20,letterSpacing:"0.44em",textTransform:"uppercase",color:C.merlot}}>HUB</div>
          <div style={{height:1,width:60,background:"rgba(139,26,26,.6)"}}/>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10}}><Spin sz={14}/><span style={{...T.m,fontSize:FS.s,letterSpacing:"0.2em",textTransform:"uppercase",color:C.dim}}>Načítám…</span></div>
    </div>
  );
  if(loadErr)return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{maxWidth:380,width:"100%",textAlign:"center"}}>
        <div style={{marginBottom:22,display:"flex",flexDirection:"column",alignItems:"center",gap:10}}>
          <div style={{fontFamily:"'Teko',sans-serif",fontWeight:300,fontSize:52,letterSpacing:"0.26em",textIndent:"0.26em",color:C.ivory,lineHeight:1}}>LIBERTI</div>
          <div style={{display:"flex",alignItems:"center",width:180,gap:10}}>
            <div style={{height:1,flex:1,background:"rgba(139,26,26,.7)"}}/>
            <div style={{fontFamily:"'Teko',sans-serif",fontWeight:300,fontSize:16,letterSpacing:"0.44em",color:C.merlot}}>HUB</div>
            <div style={{height:1,flex:1,background:"rgba(139,26,26,.7)"}}/>
          </div>
        </div>
        <Card sx={{padding:"24px",borderColor:C.mBorder}}>
          <div style={{...T.t,fontSize:18,letterSpacing:"0.14em",color:C.merlot,marginBottom:10}}>CHYBA PŘIPOJENÍ</div>
          <div style={{...T.m,fontSize:FS.b,color:C.hi,lineHeight:1.7,marginBottom:20}}>{loadErr}</div>
          <Btn ch="Zkusit znovu" onClick={load}/>
        </Card>
      </div>
    </div>
  );

  const isAdmin=authRole&&(authRole.isAdmin||authRole.v==="admin");
  const NAV_SYS=[
    {id:"settings",l:"Údaje",icon:"◇"},
    ...(isAdmin?[{id:"roles",l:"Role",icon:"◈"},{id:"visibility",l:"Oprávnění",icon:"◑"},{id:"log",l:"Log",icon:"◷"}]:[]),
  ];
  const NAV_FIRMA=[
    {id:"clients",l:"Klienti",icon:"○"},
    {id:"team",l:"Tým",icon:"◉"},
    {id:"payroll",l:"Výplaty",icon:"✦"},
    {id:"items",l:"Položky",icon:"≡"},
    {id:"vouchers",l:"Vouchery",icon:"◈"},
    {id:"benefits",l:"Benefity",icon:"✦"},
    {id:"uspechy",l:"Úspěchy",icon:"◆",sep:true},
  ];
  const NAV_FIN=[
    {id:"overview",l:"Přehled",icon:"◎"},
    {id:"incomes",l:"Příjmy",icon:"↑"},
    {id:"expenses",l:"Výdaje",icon:"↓"},
    {id:"pohyby",l:"Pohyby",icon:"⇌"},
    {id:"cile",l:"Cíle",icon:"◈"},
    {id:"archive",l:"Faktury",icon:"◫"},
    {id:"cashflow",l:"Cashflow",icon:"⇄"},
  ];
  const NAV_OFF=[
    {id:"projects",l:"Projekty",icon:"◻"},
    {id:"tasks",l:"To-Do",icon:"☑"},
    {id:"hours",l:"Docházka",icon:"◷"},
    {id:"meetings",l:"Meetings",icon:"◈"},
    {id:"outreach",l:"Outreach",icon:"◉"},
  ];
  const filterNav=(nav,mod)=>{
    if(isAdmin)return nav;
    if(!authRole)return []; // žádná role = žádný přístup
    const rp=(settings.rolePerms||{})[authRole.v]||{};
    const allowed=(rp[mod]||{}).read||[];
    if(allowed.length===0)return nav; // žádná omezení pro tento modul = vše viditelné v rámci modulu
    return nav.filter(n=>allowed.includes(n.id));
  };

  const activeNav=module==="system"?filterNav(NAV_SYS,"system"):module==="firma"?filterNav(NAV_FIRMA,"firma"):module==="finance"?filterNav(NAV_FIN,"finance"):filterNav(NAV_OFF,"office");
  const activeView=module==="system"?view:module==="firma"?firmaView:module==="finance"?finView:offView;
  const setActiveView=module==="system"?setView:module==="firma"?setFirmaView:module==="finance"?setFinView:setOffView;

  const visibleModules=isAdmin?["system","firma","finance","office"]:["system","firma","finance","office"].filter(mod=>{
    const rp=(settings.rolePerms||{})[authRole?.v]||{};
    return rp[mod+"_visible"]!==false;
  });
  const ModuleSwitcher=()=><div style={{display:"flex",gap:2,background:C.s2,borderRadius:4,padding:3,border:`1px solid ${C.border}`}}>
    {[{id:"system",l:"Systém"},{id:"firma",l:"Firma"},{id:"finance",l:"Finance"},{id:"office",l:"Office"}].filter(m=>isAdmin||visibleModules.includes(m.id)).map(m=>(
      <button key={m.id} onClick={()=>setModule(m.id)}
        style={{padding:"5px 14px",borderRadius:3,border:"none",cursor:"pointer",
          background:module===m.id?C.merlot:"transparent",
          color:module===m.id?C.ivory:C.dim,
          ...T.m,fontSize:FS.s,fontWeight:module===m.id?600:400,letterSpacing:"0.1em",textTransform:"uppercase",
          transition:"all .18s"}}
      >{m.l}</button>
    ))}
  </div>;

  return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column"}}>
      {Modal}
      {(()=>{const dt=taskDetailId?tasks.find(t=>t.id===taskDetailId)||null:null;if(!dt)return null;const ppl=settings.people||[];const lp=ppl.find(p=>(authPersonId&&p.id===authPersonId)||(p.username&&authUser&&p.username.toLowerCase()===authUser.toLowerCase())||(p.name&&authUser&&p.name.toLowerCase()===authUser.toLowerCase()));return<TaskDetailPanel key={dt.id} task={dt} tasks={tasks} setTasks={setTasks} timeEntries={timeEntries} setTimeEntries={setEntries} people={ppl} projects={projects} loggedInPerson={lp} minimized={taskPanelMin} setMinimized={setTaskPanelMin} onClose={()=>{setTaskDetailId(null);setTaskPanelMin(false);}}/>;})()}
      <header style={{borderBottom:`1px solid ${C.border}`,flexShrink:0,position:"sticky",top:0,background:C.bg,zIndex:100}}>
        {/* ── Hlavní lišta ── */}
        <div style={{padding:"0 20px",height:54,display:"flex",alignItems:"center",justifyContent:"space-between"}} className="header-pad">
          {/* Levá — logo + moduly */}
          <div style={{display:"flex",alignItems:"center",gap:0,minWidth:0,overflow:"hidden"}}>
            <span style={{display:"inline-flex",alignItems:"baseline",gap:0,lineHeight:1,flexShrink:0}}>
              <span style={{fontFamily:"'Teko',sans-serif",fontWeight:300,fontSize:26,letterSpacing:"0.26em",textIndent:"0.26em",color:C.ivory,lineHeight:1}}>LIBERTI</span>
              <span style={{fontFamily:"'Teko',sans-serif",fontWeight:300,fontSize:26,letterSpacing:"0.22em",color:C.merlot,lineHeight:1,marginLeft:"0.2em"}} className="header-logo-hub">HUB</span>
            </span>
            {/* Moduly — scrollovatelné */}
            <div style={{borderLeft:`1px solid ${C.border}`,marginLeft:12,paddingLeft:8,display:"flex",alignItems:"center",overflowX:"auto",gap:2}} className="module-nav-wrap">
              <ModuleSwitcher/>
            </div>
          </div>
          {/* Pravá — akce */}
          <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
            {saving&&<Spin sz={12}/>}
            {toast&&!saving&&<span style={{...T.m,fontSize:FS.s,fontWeight:500,color:toast.startsWith("⚠")?C.merlot:C.green,animation:"fadeIn .2s ease",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{toast}</span>}
            {view==="editor"&&editing&&module==="finance"&&<div style={{display:"flex",gap:5}}>
              <Btn ch="Uložit" onClick={()=>saveInv(editing)} sx={{padding:"5px 10px"}}/>
              <Btn ch="↓ PDF" onClick={()=>{saveInv(editing);printInv(editing,settings);}} v="g" sx={{padding:"5px 8px"}}/>
              <Btn ch="←" onClick={()=>setView("archive")} v="g" sx={{padding:"5px 8px"}}/>
            </div>}
            <button onClick={()=>{load();showToast("✓ Obnoveno");}} title="Obnovit" style={{...T.m,background:"transparent",border:`1px solid ${C.border}`,borderRadius:4,padding:"6px 9px",cursor:"pointer",fontSize:13,color:C.dim,lineHeight:1}}>↺</button>
            <button onClick={logout} style={{...T.m,background:"transparent",border:`1px solid ${C.border}`,borderRadius:4,padding:"6px 10px",cursor:"pointer",fontSize:9,letterSpacing:"0.14em",textTransform:"uppercase",color:C.dim}}>
              <span className="btn-text">Odhlásit</span><span style={{display:"none"}} className="btn-icon">✕</span>
            </button>
            <div style={{position:"relative",display:"inline-block"}} className="theme-switcher">
              <button onClick={()=>document.getElementById("theme-menu").style.display=document.getElementById("theme-menu").style.display==="block"?"none":"block"}
                style={{...T.m,fontSize:FS.s,background:"transparent",border:`1px solid ${C.border}`,borderRadius:4,padding:"5px 8px",cursor:"pointer",color:C.hi}}>
                ◐<span className="theme-switcher-label"> {THEME_LABELS[theme]||"Theme"}</span>
              </button>
              <div id="theme-menu" style={{display:"none",position:"absolute",right:0,top:"110%",background:C.s1,border:`1px solid ${C.border}`,borderRadius:4,zIndex:200,minWidth:130,boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}}>
                {Object.keys(THEMES).map(t=><div key={t} onClick={()=>{document.getElementById("theme-menu").style.display="none";switchTheme(t);}}
                  style={{...T.m,fontSize:FS.b,padding:"9px 14px",cursor:"pointer",color:t===theme?C.merlot:C.ivory,background:t===theme?C.s2:"transparent"}}>
                  {THEME_LABELS[t]}
                </div>)}
              </div>
            </div>
            {authUser&&<span style={{...T.m,fontSize:FS.s,color:C.dim,borderLeft:`1px solid ${C.border}`,paddingLeft:10}} className="hide-tab">
              {authRole&&authRole.l!=="Admin"&&<span style={{color:C.merlot,marginRight:4}}>{authRole.l}</span>}
              {authUser}
            </span>}
          </div>
        </div>
        {/* ── Sub-nav (stránky) ── */}
        {activeNav.length>0&&<div style={{borderTop:`1px solid ${C.border}`,height:40,display:"flex",alignItems:"center",paddingLeft:20,background:C.s0,overflowX:"auto"}} className="sub-nav-wrap">
          {activeNav.map(n=><React.Fragment key={n.id}>
            {n.sep&&<div style={{width:1,height:20,background:C.border,margin:"0 6px",flexShrink:0}}/>}
            <button onClick={()=>setActiveView(n.id)}
            style={{background:"none",border:"none",cursor:"pointer",padding:"0 14px",height:40,...T.m,fontSize:FS.s,fontWeight:activeView===n.id?600:400,letterSpacing:"0.08em",textTransform:"uppercase",whiteSpace:"nowrap",flexShrink:0,
              color:activeView===n.id?C.merlot:n.sep?C.amber:C.dim,
              borderBottom:`2px solid ${activeView===n.id?C.merlot:"transparent"}`,
              transition:"color .15s,border-color .15s"}}>{n.l}</button>
          </React.Fragment>)}
        </div>}
      </header>

      <main style={{flex:1,padding:"28px 32px 90px",maxWidth:1160,width:"100%",margin:"0 auto"}} className="main-pad">
        {module==="system"&&<>
          {view==="settings"&&<SettingsView settings={settings} onSave={d=>{setSet(d);showToast("✓ Nastavení uloženo");}}/>}
          {view==="roles"&&<RolesTab settings={settings} onSave={d=>{setSet(d);showToast("✓ Role uloženy");}} confirmFn={confirm}/>}
          {view==="visibility"&&<VisibilityView settings={settings} onSave={d=>{setSet(d);showToast("✓ Uloženo");}}/>}
          {view==="log"&&<LogView changeLog={changeLog}/>}
        </>}
        {module==="firma"&&<>
          {firmaView==="clients"&&<ClientsView clients={clients} setClients={setCli} invoices={invoices} timeEntries={timeEntries} projects={projects} settings={settings} confirmFn={confirm} onNewInvoice={cl=>{newInv(cl);setModule("finance");setFinView("editor");}} setIncomes={setInc}/>}
          {firmaView==="team"&&<TeamView settings={settings} onSave={d=>setSet(d)} onSavePeople={d=>saveTeamPeople(d)} onSaveOrgSkills={d=>saveTeamOrgSkills(d)} timeEntries={timeEntries} tasks={tasks} benefitCategories={benefitCategories} teams={teams} setTeams={setTeams} confirmFn={confirm}/>}
          {firmaView==="payroll"&&<PayrollView timeEntries={timeEntries} setTimeEntries={setEntries} settings={settings} confirmFn={confirm} authRole={authRole} expenses={expenses} setExpenses={setExp} bonuses={bonuses} setBonuses={setBon}/>}
          {firmaView==="items"&&<ItemsView templateItems={templateItems} setTemplateItems={setTpl} confirmFn={confirm}/>}
          {firmaView==="vouchers"&&<VouchersView vouchers={vouchers} setVouchers={setVch} confirmFn={confirm}/>}
          {firmaView==="benefits"&&<BenefitsView benefitCategories={benefitCategories} setBenefitCategories={setBenCat} confirmFn={confirm}/>}
          {firmaView==="uspechy"&&<AchievementsView invoices={invoices} incomes={incomes} expenses={expenses} clients={clients} settings={settings} onSaveSettings={d=>{setSet(d);}} isAdmin={isAdmin} confirmFn={confirm}/>}
        </>}
        {module==="finance"&&<>
          {finView==="overview"&&<FinanceDashboard invoices={invoices} incomes={incomes} setIncomes={setInc} timeEntries={timeEntries} expenses={expenses} setExpenses={setExp} settings={settings} period={finPeriod} setPeriod={setFinPeriod} projects={projects} movements={movements}/>}
          {finView==="incomes"&&<IncomesView incomes={incomes} setIncomes={setInc} confirmFn={confirm} clients={clients}/>}
          {finView==="expenses"&&<ExpensesView expenses={expenses} setExpenses={setExp} projects={projects} confirmFn={confirm}/>}
          {finView==="pohyby"&&<MovementsView movements={movements} setMovements={setMovements} goals={goals} settings={settings} incomes={incomes} setIncomes={setInc} expenses={expenses} setExpenses={setExp} confirmFn={confirm}/>}
          {finView==="cile"&&<GoalsView goals={goals} setGoals={setGoals} movements={movements} setMovements={setMovements} settings={settings} confirmFn={confirm}/>}
          {finView==="archive"&&<ArchiveView invoices={invoices} settings={settings} onNew={newInv} onEdit={inv=>{setEditing(inv);setFinView("editor");}} onView={inv=>printInv(inv,settings)} onDup={dupInv} onStatus={(id,s)=>setInv(invoices.map(i=>i.id===id?{...i,status:s}:i))} onDelete={id=>setInv(invoices.filter(i=>i.id!==id))} confirmFn={confirm}/>}
          {finView==="editor"&&editing&&<EditorView inv={editing} clients={clients} templateItems={templateItems} vouchers={vouchers} settings={settings} onSave={inv=>{setEditing(inv);saveInv(inv);}} onCancel={()=>setFinView("archive")} onPrint={inv=>printInv(inv,settings)}/>}
          {finView==="cashflow"&&<CashflowView invoices={invoices} expenses={expenses} incomes={incomes} timeEntries={timeEntries} settings={settings} projects={projects}/>}
        </>}
        {module==="office"&&<>
          {offView==="projects"&&<ProjectsView projects={projects} setProjects={setProj} tasks={tasks} setTasks={setTasks} timeEntries={timeEntries} expenses={expenses} clients={clients} settings={settings} invoices={invoices} onInvoice={invoiceProject} confirmFn={confirm}/>}
          {offView==="tasks"&&<TasksView tasks={tasks} setTasks={setTasks} projects={projects} settings={settings} teams={teams} confirmFn={confirm} authUser={authUser} authRole={authRole} authPersonId={authPersonId} taskDetailId={taskDetailId} onOpenTask={id=>{setTaskDetailId(id);setTaskPanelMin(false);}}/>}
          {offView==="hours"&&<HoursView timer={timer} timeEntries={timeEntries} setTimeEntries={setEntries} projects={projects} tasks={tasks} setTasks={setTasks} settings={settings} confirmFn={confirm} authUser={authUser} authRole={authRole} authPersonId={authPersonId} incomes={incomes} setIncomes={setInc}/>}
          {offView==="meetings"&&<MeetingsView meetings={meetings} setMeetings={setMeetings} clients={clients} settings={settings} onSaveSettings={setSet} confirmFn={confirm}/>}
          {offView==="outreach"&&<OutreachView leads={leads} setLeads={setLeads} calls={calls} setCalls={setCalls} clients={clients} setClients={setCli} settings={settings} onSaveSettings={d=>{setSet(d);showToast("✓ Strategie uložena");}} authRole={authRole} confirmFn={confirm}/>}
        </>}
      </main>

      <nav style={{position:"fixed",bottom:0,left:0,right:0,background:C.s1,borderTop:`1px solid ${C.border}`,zIndex:200,paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
        <style>{`@media(min-width:901px){nav{display:none!important}}`}</style>
        <div style={{display:"flex",justifyContent:"center",padding:"6px 8px 2px",borderBottom:`1px solid ${C.border}`}}>
          <ModuleSwitcher/>
        </div>
        <div style={{display:"flex",overflowX:"auto",WebkitOverflowScrolling:"touch",scrollbarWidth:"none",msOverflowStyle:"none"}}>
          <style>{`.mob-nav-row::-webkit-scrollbar{display:none}`}</style>
          {activeNav.map(n=>(
            <button key={n.id} onClick={()=>setActiveView(n.id)}
              style={{flex:activeNav.length<=5?"1":"0 0 auto",minWidth:activeNav.length<=5?"0":"64px",padding:"8px 6px",background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,touchAction:"manipulation",WebkitTapHighlightColor:"transparent",borderBottom:`2px solid ${activeView===n.id?C.merlot:"transparent"}`,transition:"border-color .15s"}}>
              <span style={{fontSize:15,opacity:activeView===n.id?1:.35,transition:"opacity .15s"}}>{n.icon}</span>
              <span style={{...T.m,fontSize:8,letterSpacing:"0.08em",textTransform:"uppercase",color:activeView===n.id?C.merlot:C.dim,fontWeight:activeView===n.id?600:400,transition:"color .15s",whiteSpace:"nowrap"}}>{n.l}</span>
            </button>
          ))}
        </div>
      </nav>
      {/* Floating timer widget — visible when not on Hours view */}
      {timer.active&&!(module==="office"&&offView==="hours")&&
        <FloatingTimer timer={timer} people={settings.people||[]} projects={projects}
          onClick={()=>{setModule("office");setOffView("hours");}}/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

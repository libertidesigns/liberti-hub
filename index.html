                <div key={l.id+"ph"} onContextMenu={lCtx} style={{...cs,...T.m,fontSize:FS.b,color:C.dim}}>{l.phone||"—"}</div>,
                <div key={l.id+"em"} onContextMenu={lCtx} style={{...cs,...T.m,fontSize:FS.b,color:C.dim,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.email||"—"}</div>,
                <div key={l.id+"t"} onContextMenu={lCtx} style={cs}>
                  {person&&<div style={{display:"flex",alignItems:"center",gap:6}}>
                    <div style={{width:7,height:7,borderRadius:"50%",background:person.color,flexShrink:0}}/>
                    <span style={{...T.m,fontSize:FS.b,color:C.ivory}}>{person.name}</span>
                  </div>}
                </div>,
                <div key={l.id+"nn"} onContextMenu={lCtx} style={{...cs,...T.m,fontSize:FS.b,color:C.dim}}>{l.notes||"—"}</div>,
                <div key={l.id+"a"} onContextMenu={lCtx} style={{...cs,display:"flex",alignItems:"center",gap:6,padding:"10px 12px"}}>
                  <button title={bh?"Zavolat":"Mimo pracovní hodiny (9–11, 13–17)"} onClick={()=>callFromLead(l)} style={{width:28,height:28,borderRadius:4,border:`1px solid ${bh?C.greenBorder:C.border}`,background:bh?C.greenBg:"transparent",color:bh?C.green:C.dim,cursor:bh?"pointer":"not-allowed",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .15s",opacity:bh?1:0.35}}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.97 4.18 2 2 0 012.96 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L7.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg></button>
                  {l.email&&<a href={"mailto:"+l.email} title="Napsat e-mail" style={{width:28,height:28,borderRadius:4,border:`1px solid ${C.blueBorder}`,background:C.blueBg,color:C.blue,display:"flex",alignItems:"center",justifyContent:"center",textDecoration:"none"}}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></a>}
                </div>,
              ];
            })}
          </div>
        </Card>}
    </div>

    {/* Tabulka Hovory */}
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <SH c={"Hovory ("+(calls||[]).length+")"}/>
      </div>
      {(calls||[]).length===0
        ?<div style={{border:`1px dashed ${C.border}`,borderRadius:4,padding:"32px 0",textAlign:"center",...T.m,fontSize:FS.b,color:C.dim}}>Žádné hovory — zapište první hovor tlačítkem výše</div>
        :<Card>
          <div style={{display:"grid",gridTemplateColumns:"1.3fr 1.4fr 1fr 1fr 80px 96px",gap:0}}>
            {["Naplánováno","Jméno","Telefon","Kdo volal","Pokusy","Výsledek"].map(h=><div key={h} style={{...T.m,fontSize:FS.s,color:C.dim,padding:"9px 16px",borderBottom:`1px solid ${C.border}`,letterSpacing:"0.1em",textTransform:"uppercase"}}>{h}</div>)}
            {(calls||[]).map((c,i)=>{
              const person=people.find(p=>p.id===c.calledBy);
              const isLast=i===(calls||[]).length-1;
              const dtStr=c.datetime?c.datetime.replace("T"," ").slice(0,16):fmtD(c.date||"");
              const attempts=c.attempts||[];
              const maxAttempts=3;
              const done=attempts.some(a=>a.type==="success"||a.type==="failure")||attempts.length>=maxAttempts;
              const segC={success:C.green,failure:C.merlot,noanswer:C.amber};
              const cCtx=e=>openMenu(e,[{l:"Upravit hovor",a:()=>editCall(c)},{sep:true},{l:"Smazat hovor",a:()=>delCall(c.id),danger:true}]);
              const cs={padding:"12px 16px",borderBottom:isLast?"none":`1px solid ${C.border}`,cursor:"context-menu"};
              const bh=isBusinessHours();
              return [
                <div key={c.id+"dt"} onContextMenu={cCtx} style={{...cs}}>
                  <div style={{...T.m,fontSize:FS.b,color:C.dim}}>{dtStr.slice(0,10).split("-").reverse().join(". ")}</div>
                  <div style={{...T.m,fontSize:10,color:C.dim,opacity:0.6,marginTop:1}}>{dtStr.slice(11,16)||""}</div>
                </div>,
                <div key={c.id+"n"} onContextMenu={cCtx} style={{...cs}}>
                  <div style={{...T.m,fontSize:FS.b,color:C.ivory,fontWeight:500}}>{c.personName}</div>
                  {c.notes&&<div style={{...T.m,fontSize:10,color:C.dim,marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.notes}</div>}
                </div>,
                <div key={c.id+"ph"} onContextMenu={cCtx} style={{...cs,...T.m,fontSize:FS.b,color:C.dim}}>{c.phone||"—"}</div>,
                <div key={c.id+"cb"} onContextMenu={cCtx} style={cs}>
                  {person&&<div style={{display:"flex",alignItems:"center",gap:6}}>
                    <div style={{width:7,height:7,borderRadius:"50%",background:person.color,flexShrink:0}}/>
                    <span style={{...T.m,fontSize:FS.b,color:C.ivory}}>{person.name}</span>
                  </div>}
                </div>,
                <div key={c.id+"m"} onContextMenu={cCtx} style={{...cs,display:"flex",alignItems:"center",gap:4}}>
                  {Array.from({length:maxAttempts},(_,si)=>{
                    const att=attempts[si];
                    return <div key={si} title={att?({success:"Úspěch",failure:"Neúspěch",noanswer:"Nezvedal"}[att.type]||att.type):"Pokus "+( si+1)} style={{width:18,height:7,borderRadius:2,background:att?segC[att.type]||C.dim:C.s2,border:`1px solid ${att?segC[att.type]||C.dim:C.border}`,transition:"background .2s"}}/>;
                  })}
                </div>,
                <div key={c.id+"r"} onContextMenu={cCtx} style={{...cs,display:"flex",alignItems:"center",gap:5,padding:"10px 10px"}}>
                  {!done?[
                    {type:"success",label:"Úspěch",col:C.green,bg:C.greenBg,border:C.greenBorder,svg:<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>},
                    {type:"noanswer",label:"Nezvedá",col:C.amber,bg:C.amberBg,border:C.amberBorder,svg:<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 01-4 4H4"/></svg>},
                    {type:"failure",label:"Neúspěch",col:C.merlot,bg:C.mDark,border:C.mBorder,svg:<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>},
                  ].map(r=><button key={r.type} title={r.label} onClick={()=>recordResult(c.id,r.type)} style={{width:28,height:28,borderRadius:4,border:`1px solid ${bh?r.border:C.border}`,background:bh?r.bg:"transparent",color:bh?r.col:C.dim,cursor:bh?"pointer":"not-allowed",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .15s",opacity:bh?1:0.35}}>{r.svg}</button>)
                  :<span style={{...T.m,fontSize:10,color:attempts[attempts.length-1]?.type==="success"?C.green:C.dim,letterSpacing:"0.08em",textTransform:"uppercase"}}>{attempts[attempts.length-1]?.type==="success"?"Úspěch":"Nezájem"}</span>}
                </div>,
              ];
            })}
          </div>
        </Card>}
    </div>

  </div>{CtxMenu}</>;
}


function FavPlacesModal({settings,onSave,onSelect,onClose}){
  const fps=settings.favoritePlaces||[];
  const [newPlace,setNewPlace]=useState({name:"",address:""});
  const [editId,setEditId]=useState(null);
  const [editPlace,setEditPlace]=useState({name:"",address:""});
  const {openMenu,CtxMenu}=useCtxMenu();
  const addFav=()=>{
    if(!newPlace.name)return;
    onSave({...settings,favoritePlaces:[...fps,{id:uid(),...newPlace}]});
    setNewPlace({name:"",address:""});
  };
  return <div style={{position:"fixed",inset:0,background:C.overlay,zIndex:800,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <Card sx={{width:"100%",maxWidth:480,padding:20,animation:"scaleIn .2s cubic-bezier(.22,1,.36,1)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <SH c="Oblíbená místa"/>
        <button onClick={onClose} style={{background:"transparent",border:"none",color:C.dim,cursor:"pointer",fontSize:18,lineHeight:1}}>×</button>
      </div>
      {fps.length===0&&<div style={{...T.m,fontSize:FS.b,color:C.dim,marginBottom:14}}>Zatím žádná oblíbená místa</div>}
      <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:14,maxHeight:220,overflowY:"auto"}}>
        {fps.map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:C.s2,borderRadius:4,border:`1px solid ${C.border}`,cursor:"pointer"}}
          onClick={()=>{onSelect(p);onClose();}}>
          <div style={{flex:1}}>
            {editId===p.id
              ?<div style={{display:"flex",gap:6,flexDirection:"column"}}>
                <input value={editPlace.name} onChange={e=>setEditPlace(ep=>({...ep,name:e.target.value}))}
                  style={{background:C.s2,border:`1px solid ${C.merlot}`,borderRadius:4,padding:"4px 8px",color:C.ivory,...T.m,fontSize:FS.b,outline:"none"}} autoFocus/>
                <input value={editPlace.address} onChange={e=>setEditPlace(ep=>({...ep,address:e.target.value}))}
                  placeholder="Adresa" style={{background:C.s2,border:`1px solid ${C.border}`,borderRadius:4,padding:"4px 8px",color:C.ivory,...T.m,fontSize:FS.s,outline:"none"}}/>
                <div style={{display:"flex",gap:6}}>
                  <Btn ch="Uložit" onClick={e=>{e.stopPropagation();onSave({...settings,favoritePlaces:fps.map(x=>x.id===p.id?{...x,...editPlace}:x)});setEditId(null);}} sx={{height:26,padding:"0 8px"}}/>
                  <Btn ch="Zrušit" onClick={e=>{e.stopPropagation();setEditId(null);}} v="g" sx={{height:26,padding:"0 8px"}}/>
                </div>
              </div>
              :<div>
                <div style={{...T.m,fontSize:FS.b,color:C.ivory,fontWeight:500}}>{p.name}</div>
                {p.address&&<div style={{...T.m,fontSize:FS.s,color:C.dim}}>{p.address}</div>}
              </div>}
          </div>
          {editId!==p.id&&<Btn ch="Vybrat" onClick={e=>{e.stopPropagation();onSelect(p);onClose();}} sx={{padding:"4px 10px"}}/>}
          <button onContextMenu={e=>{e.stopPropagation();openMenu(e,[{l:"Upravit",a:()=>{setEditId(p.id);setEditPlace({name:p.name,address:p.address||""});}},{sep:true},{l:"Odstranit",a:()=>onSave({...settings,favoritePlaces:fps.filter(x=>x.id!==p.id)}),danger:true}]);}}
            style={{background:"none",border:`1px solid ${C.border}`,borderRadius:3,color:C.dim,cursor:"context-menu",padding:"4px 8px",...T.m,fontSize:FS.b}} title="Pravý klik = možnosti">⋯</button>
        </div>)}
      </div>
      <div style={{borderTop:`1px solid ${C.border}`,paddingTop:14}}>
        <div style={{...T.m,fontSize:FS.s,color:C.dim,marginBottom:8}}>Přidat nové místo</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <Inp lbl="Název" val={newPlace.name} onChange={v=>setNewPlace(p=>({...p,name:v}))} ph="Kavárna Liberti, Kancelář…"/>
          <Inp lbl="Adresa" val={newPlace.address} onChange={v=>setNewPlace(p=>({...p,address:v}))} ph="Ulice, Město"/>
          <Btn ch="Přidat oblíbené místo" onClick={addFav}/>
        </div>
      </div>
    </Card>
  {CtxMenu}</div>;
}

function MeetingsView({meetings,setMeetings,clients,settings,onSaveSettings,confirmFn}){
  const people=(settings.people||[]).filter(p=>p.active!==false);
  const blank={id:uid(),clientId:"",date:toDay(),time:"10:00",place:"",placeAddress:"",participants:[],checklist:[],notes:""};
  const [ed,setEd]=useState(null);
  const [f,setF]=useState(null);
  const [q,setQ]=useState("");
  const [showFav,setShowFav]=useState(false);
  const [newCheck,setNewCheck]=useState("");
  const u=k=>v=>setF(p=>({...p,[k]:v}));
  const now=toDay();
  const inDays=(d,n)=>{const t=new Date(now);t.setDate(t.getDate()+n);return d<=t.toISOString().slice(0,10);};

  const sorted=[...(meetings||[])].sort((a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1);
  const searched=q?sorted.filter(m=>{
    const cl=clients.find(c=>c.id===m.clientId);
    return (cl?.name||cl?.company||"").toLowerCase().includes(q.toLowerCase())||
      (m.place||"").toLowerCase().includes(q.toLowerCase())||
      (m.notes||"").toLowerCase().includes(q.toLowerCase());
  }):sorted;

  const groups=[
    {id:"today",l:"Dnes",color:C.green,items:searched.filter(m=>m.date===now)},
    {id:"week",l:"Následujících 7 dní",color:C.amber,items:searched.filter(m=>m.date>now&&inDays(m.date,7))},
    {id:"future",l:"Nadcházející",color:C.blue,items:searched.filter(m=>m.date>now&&!inDays(m.date,7))},
    {id:"past",l:"Proběhlé",color:C.merlot,items:[...searched.filter(m=>m.date<now)].reverse()},
  ];
  const [collapsed,setCollapsed]=useState({past:true});
  const toggleCollapse=id=>setCollapsed(p=>({...p,[id]:!p[id]}));

  const save=()=>{
    if(!f||!f.date)return;
    const next=ed==="new"?[{...f,id:uid()},...(meetings||[])]:(meetings||[]).map(m=>m.id===ed?{...f}:m);
    setMeetings(next);setEd(null);setF(null);
  };
  const del=async id=>{if(await confirmFn("Smazat tuto schůzku?"))setMeetings((meetings||[]).filter(m=>m.id!==id));};
  const toggleCheck=(meetId,checkId)=>{
    setMeetings((meetings||[]).map(m=>m.id!==meetId?m:{...m,checklist:(m.checklist||[]).map(c=>c.id===checkId?{...c,done:!c.done}:c)}));
  };
  const toggleParticipant=pid=>{
    const arr=f.participants||[];
    setF(p=>({...p,participants:arr.includes(pid)?arr.filter(x=>x!==pid):[...arr,pid]}));
  };

  const MeetingCard=({m})=>{
    const cl=clients.find(c=>c.id===m.clientId);
    const clName=cl?.company||cl?.name||"";
    const mPeople=people.filter(p=>(m.participants||[]).includes(p.id));
    const doneCount=(m.checklist||[]).filter(c=>c.done).length;
    const totalCheck=(m.checklist||[]).length;
    const dayDiff=Math.round((new Date(m.date)-new Date(now))/(1000*60*60*24));
    const statusColor=m.date===now?C.green:dayDiff>0&&dayDiff<=7?C.amber:dayDiff>7?C.blue:C.merlot;
    return <Card sx={{padding:"14px 18px",borderLeft:`3px solid ${statusColor}`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:6,flexWrap:"wrap"}}>
            <span style={{...T.t,fontSize:FS.h,fontWeight:300,color:C.ivory}}>{clName||"Schůzka"}</span>
          </div>
          <div style={{display:"flex",gap:16,flexWrap:"wrap",marginBottom:mPeople.length?8:0}}>
            <span style={{...T.m,fontSize:FS.b,color:statusColor}}>{fmtD(m.date)}</span>
            <span style={{...T.m,fontSize:FS.b,color:C.hi}}>{m.time||"—"}</span>

          {mPeople.length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>

              <div style={{width:6,height:6,borderRadius:"50%",background:p.color}}/>
              <span style={{...T.m,fontSize:FS.s,color:C.ivory}}>{p.name}</span>

        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8,flexShrink:0}}>

            <Btn ch="Smazat" onClick={()=>del(m.id)} v="d" sx={{padding:"5px 10px"}}/>
          </div>
          {totalCheck>0&&<span style={{...T.m,fontSize:FS.s,color:doneCount===totalCheck?C.green:C.dim}}>{doneCount}/{totalCheck} splněno</span>}
        </div>
      </div>
      {totalCheck>0&&<div style={{marginTop:12,borderTop:`1px solid ${C.border}`,paddingTop:10,display:"flex",flexDirection:"column",gap:5}}>
        {(m.checklist||[]).map(item=><div key={item.id} onClick={()=>toggleCheck(m.id,item.id)}
          style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",padding:"3px 0"}}>
          <div style={{width:16,height:16,borderRadius:3,border:`2px solid ${item.done?C.merlot:C.border}`,background:item.done?C.merlot+"33":"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",transition:"all .15s"}}>

        </div>)}
      </div>}

  };

  return <div className="anim-fadein">
    {showFav&&onSaveSettings&&<FavPlacesModal settings={settings} onSave={onSaveSettings}
      onSelect={p=>{if(f)setF(prev=>({...prev,place:p.name,placeAddress:p.address||""}));}}
      onClose={()=>setShowFav(false)}/>}

    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>
      <div>
        <div style={{...T.t,fontSize:FS.h,fontWeight:700,letterSpacing:"0.15em",color:C.ivory}}>MEETINGS</div>
        <div style={{...T.m,fontSize:FS.s,color:C.dim,marginTop:2}}>Plánování schůzek</div>
      </div>
      <Btn ch="+ Nová schůzka" onClick={()=>{setF({...blank,id:uid()});setEd("new");setNewCheck("");}}/>
    </div>

    <div style={{marginBottom:16}}><SearchBar value={q} onChange={setQ} ph="Hledat schůzky…"/></div>

    {ed&&f&&<Card sx={{padding:20,marginBottom:16,borderColor:C.mBorder,animation:"scaleIn .22s cubic-bezier(.22,1,.36,1)"}}>
      <SH c={ed==="new"?"Nová schůzka":"Upravit schůzku"}/>
      <div className="grid-2-inp" style={{marginBottom:14}}>
        <Inp lbl="Klient" val={f.clientId} onChange={u("clientId")}
          opts={[{v:"",l:"— vyberte klienta —"},...clients.map(c=>({v:c.id,l:c.company||c.name}))]}/>
        <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
          <div style={{flex:1}}><Inp lbl="Místo setkání" val={f.place} onChange={u("place")} ph="Kavárna, kancelář, online…"/></div>
          <Btn ch="Oblíbená" onClick={()=>setShowFav(true)} v="g" sx={{padding:"8px 10px",flexShrink:0,marginBottom:0}}/>
        </div>
        <Inp lbl="Adresa" val={f.placeAddress||""} onChange={u("placeAddress")} ph="Přesná adresa (volitelné)"/>
        <div style={{display:"flex",gap:8}}>
          <div style={{flex:1}}><Inp lbl="Datum" type="date" val={f.date} onChange={u("date")}/></div>
          <div style={{flex:1}}><Inp lbl="Čas" type="time" val={f.time} onChange={u("time")}/></div>
        </div>
        <div style={{gridColumn:"1/-1"}}><Inp lbl="Poznámky / Agenda" val={f.notes||""} onChange={u("notes")} ph="Cíl schůzky, témata…" ml rows={2}/></div>
      </div>
      <div style={{marginBottom:14}}>
        <Lbl c="Účastníci"/>
        <div style={{display:"flex",flexWrap:"wrap",gap:7,marginTop:6}}>
          {people.map(p=>{
            const on=(f.participants||[]).includes(p.id);
            return <div key={p.id} onClick={()=>toggleParticipant(p.id)}
              style={{display:"flex",alignItems:"center",gap:7,padding:"5px 12px",borderRadius:16,cursor:"pointer",
                border:`1px solid ${on?p.color:C.border}`,background:on?p.color+"22":"transparent",transition:"all .15s"}}>
              <div style={{width:7,height:7,borderRadius:"50%",background:p.color}}/>
              <span style={{...T.m,fontSize:FS.b,color:on?C.ivory:C.hi}}>{p.name}</span>
            </div>;
          })}
        </div>
      </div>
      <div style={{marginBottom:14}}>
        <Lbl c={"Checklist ("+((f.checklist||[]).length)+" položek)"}/>
        <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:6,marginBottom:10}}>
          {(f.checklist||[]).map((item,i)=><div key={item.id} style={{display:"flex",alignItems:"center",gap:10}}>
            <div onClick={()=>setF(p=>({...p,checklist:p.checklist.map(c=>c.id===item.id?{...c,done:!c.done}:c)}))}
              style={{width:18,height:18,borderRadius:4,border:`2px solid ${item.done?C.merlot:C.border}`,background:item.done?C.merlot+"33":"transparent",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
              {item.done&&<span style={{color:C.merlot,fontSize:11}}>✓</span>}
            </div>
            <input value={item.text}
              onChange={e=>setF(p=>({...p,checklist:p.checklist.map(c=>c.id===item.id?{...c,text:e.target.value}:c)}))}
              placeholder={"Položka "+(i+1)+"…"}
              style={{flex:1,background:"transparent",border:"none",borderBottom:`1px solid ${C.border}`,color:item.done?C.dim:C.ivory,...T.m,fontSize:FS.b,outline:"none",padding:"4px 0",textDecoration:item.done?"line-through":"none"}}/>
            <button onClick={()=>setF(p=>({...p,checklist:p.checklist.filter(c=>c.id!==item.id)}))}
              style={{background:"transparent",border:"none",color:C.dim,cursor:"pointer",fontSize:14,padding:"2px 4px"}}>×</button>
          </div>)}
        </div>
        <div style={{display:"flex",gap:8}}>
          <input value={newCheck} onChange={e=>setNewCheck(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter"&&newCheck.trim()){setF(p=>({...p,checklist:[...(p.checklist||[]),{id:uid(),text:newCheck.trim(),done:false}]}));setNewCheck("");}}}
            placeholder="Přidat položku… (Enter)"
            style={{flex:1,background:C.s2,border:`1px solid ${C.border}`,borderRadius:4,padding:"8px 12px",color:C.ivory,...T.m,fontSize:FS.b,outline:"none"}}/>
          <Btn ch="Přidat" onClick={()=>{if(newCheck.trim()){setF(p=>({...p,checklist:[...(p.checklist||[]),{id:uid(),text:newCheck.trim(),done:false}]}));setNewCheck("");}}} v="g" sx={{padding:"8px 12px"}}/>
        </div>
      </div>
      <div style={{display:"flex",gap:10}}>
        <Btn ch="Uložit schůzku" onClick={save}/>
        <Btn ch="Zrušit" onClick={()=>{setEd(null);setF(null);}} v="g"/>
      </div>
    </Card>}

    {groups.map(g=><div key={g.id} style={{marginBottom:14}}>
      <div onClick={()=>toggleCollapse(g.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",cursor:"pointer",borderBottom:`1px solid ${C.border}`,marginBottom:collapsed[g.id]?0:10}}>
        <div style={{width:10,height:10,borderRadius:"50%",background:g.color,flexShrink:0}}/>
        <span style={{...T.t,fontSize:FS.b,fontWeight:600,letterSpacing:"0.1em",color:g.color}}>{g.l}</span>
        <span style={{...T.m,fontSize:FS.s,color:C.dim,background:C.s2,padding:"1px 8px",borderRadius:10}}>{g.items.length}</span>
        <span style={{...T.m,fontSize:FS.s,color:C.dim,marginLeft:"auto"}}>{collapsed[g.id]?"▼":"▲"}</span>
      </div>
      {!collapsed[g.id]&&<div style={{display:"flex",flexDirection:"column",gap:8}}>
        {g.items.length===0
          ?<div style={{...T.m,fontSize:FS.b,color:C.dim,padding:"12px 0",textAlign:"center"}}>Žádné schůzky</div>
          :g.items.map(m=><MeetingCard key={m.id} m={m}/>)}
      </div>}
    </div>)}
  </div>;
}


function PayrollView({timeEntries,setTimeEntries,settings,confirmFn,authRole,expenses,setExpenses,bonuses,setBonuses}){
  const people=(settings.people||[]).filter(p=>p.active!==false);
  const allRoles=[...(settings.systemRoles||[]),...(settings.customRoles||[])];
  const owners=people.filter(p=>getPersonFinType(p,allRoles)==="owner");
  const employees=people.filter(p=>getPersonFinType(p,allRoles)!=="owner");
  const isAdm=authRole&&(authRole.isAdmin||authRole.v==="admin");
  const [selPerson,setSelPerson]=useState(null);
  const [payModal,setPayModal]=useState(null);
  const [payAmount,setPayAmount]=useState("");
  const [bonusForm,setBonusForm]=useState(null); // {personId} when open
  const [bonusF,setBonusF]=useState({amount:"",description:"",date:toDay()});
  const {openMenu,CtxMenu}=useCtxMenu();

  const getPersonRole=p=>allRoles.find(r=>r.v===p.role);
  const getUnpaid=pid=>(timeEntries||[]).filter(e=>e.personId===pid&&!e.paid&&!e.isPause);
  const getPaid=pid=>(timeEntries||[]).filter(e=>e.personId===pid&&e.paid&&!e.isPause);
  const getUnpaidBonuses=pid=>(bonuses||[]).filter(b=>b.personId===pid&&!b.paid);
  const getPaidBonuses=pid=>(bonuses||[]).filter(b=>b.personId===pid&&b.paid);
  const calcOwed=p=>{
    if(p.payType==="fixed"){
      const bonusOwed=getUnpaidBonuses(p.id).reduce((s,b)=>s+(b.amount||0),0);
      return (p.rate||0)+bonusOwed;
    }
    const entries=getUnpaid(p.id);
    const hoursOwed=Math.round(entries.reduce((s,e)=>s+((e.rate||p.rate||0)*(e.minutes||0)/60),0)*10)/10;
    const bonusOwed=getUnpaidBonuses(p.id).reduce((s,b)=>s+(b.amount||0),0);
    return hoursOwed+bonusOwed;
  };
  const addBonus=pid=>{
    if(!bonusF.amount||!bonusF.description)return;
    const nb={id:uid(),personId:pid,amount:parseFloat(bonusF.amount)||0,description:bonusF.description,date:bonusF.date||toDay(),paid:false};
    setBonuses([nb,...(bonuses||[])]);
    setBonusForm(null);setBonusF({amount:"",description:"",date:toDay()});
  };
  const delBonus=async id=>{
    const ok=await confirmFn("Smazat tuto odměnu?");
    if(ok)setBonuses((bonuses||[]).filter(b=>b.id!==id));
  };
  const openPayModal=p=>{
    const owed=calcOwed(p);
    setPayModal({person:p,entries:getUnpaid(p.id),bonusEntries:getUnpaidBonuses(p.id)});
    setPayAmount(String(owed));
  };

  const generatePaySlip=(person,amount,entries)=>{
    const now=new Date();
    const monthName=now.toLocaleDateString("cs-CZ",{month:"long",year:"numeric"});
    const issueDate=now.toLocaleDateString("cs-CZ");
    const totalMins=entries.reduce((s,e)=>s+(e.minutes||0),0);
    const totalHours=(totalMins/60).toFixed(2);
    const firma=settings?.name||"LIBERTI";
    const firmaAddr=[settings?.street,settings?.city].filter(Boolean).join(", ");
    const ico=settings?.ico||"";
    const w=window.open("","_blank","width=750,height=1000");
    if(!w)return;
    w.document.write(`<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8">
<title>Výplatní páska – ${person.name} – ${monthName}</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;color:#111;background:#fff;padding:40px 48px;}
  .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:32px;padding-bottom:16px;border-bottom:2px solid #111;}
  .company h1{font-size:20px;font-weight:700;letter-spacing:0.15em;margin-bottom:4px;}
  .company p{font-size:11px;color:#555;line-height:1.6;}
  .doc-title{text-align:right;}
  .doc-title h2{font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;}
  .doc-title p{font-size:11px;color:#555;}
  .section{margin-bottom:24px;}
  .section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:#777;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #ddd;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;}
  .info-row{display:flex;gap:8px;padding:3px 0;}
  .info-label{color:#777;min-width:120px;font-size:12px;}
  .info-value{color:#111;font-size:12px;font-weight:500;}
  table{width:100%;border-collapse:collapse;margin-top:4px;}
  thead tr{background:#f5f5f5;}
  th{text-align:left;padding:8px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#555;border-bottom:2px solid #ddd;}
  td{padding:7px 10px;font-size:12px;border-bottom:1px solid #eee;color:#222;}
  tr:last-child td{border-bottom:none;}
  .amount-row td{font-weight:600;}
  .total-box{margin-top:20px;padding:14px 16px;background:#f9f9f9;border:1px solid #ddd;border-radius:3px;display:flex;justify-content:space-between;align-items:center;}
  .total-label{font-size:13px;font-weight:600;color:#333;}
  .total-amount{font-size:22px;font-weight:700;color:#111;}
  .signature-section{margin-top:40px;display:flex;justify-content:space-between;}
  .sig-box{width:45%;border-top:1px solid #999;padding-top:8px;font-size:11px;color:#777;}
  footer{margin-top:48px;padding-top:12px;border-top:1px solid #ddd;text-align:center;font-size:11px;color:#aaa;letter-spacing:0.08em;}
  @media print{body{padding:20px 24px;}@page{margin:1cm;}}
</style></head><body>
<div class="header">
  <div class="company">
    <h1>${firma}</h1>
    ${firmaAddr?`<p>${firmaAddr}</p>`:""}
    ${ico?`<p>IČO: ${ico}</p>`:""}
  </div>
  <div class="doc-title">
    <h2>Výplatní páska</h2>
    <p>Datum vydání: ${issueDate}</p>
    <p>Období: ${monthName}</p>
  </div>
</div>

<div class="section">
  <div class="section-title">Zaměstnanec / Spolupracovník</div>
  <div class="info-grid">
    <div class="info-row"><span class="info-label">Jméno:</span><span class="info-value">${person.name}</span></div>
    <div class="info-row"><span class="info-label">Uživatelské jméno:</span><span class="info-value">${person.username||"—"}</span></div>
    <div class="info-row"><span class="info-label">Role:</span><span class="info-value">${person.role||"—"}</span></div>
    <div class="info-row"><span class="info-label">Typ odměny:</span><span class="info-value">${person.payType==="fixed"?"Fixní/měsíc":person.payType==="share"?"Podíl z obratu":"Hodinová sazba"}</span></div>
    ${person.payType!=="fixed"?`<div class="info-row"><span class="info-label">Sazba:</span><span class="info-value">${person.rate||0} Kč/h</span></div>`:""}
  </div>
</div>

${entries.length>0?`
<div class="section">
  <div class="section-title">Přehled odpracované doby</div>
  <table>
    <thead><tr><th>Datum</th><th>Odpracováno</th><th>Projekt / Popis</th><th style="text-align:right">Hodnota</th></tr></thead>
    <tbody>
      ${entries.map(e=>{
        const mins=e.minutes||0;
        const val=Math.round((e.rate||person.rate||0)*mins/60*10)/10;
        return `<tr><td>${e.date}</td><td>${Math.floor(mins/60)}h ${mins%60>0?mins%60+"m":""}</td><td style="color:#555">${e.description||"—"}</td><td style="text-align:right">${val.toFixed(0)} Kč</td></tr>`;
      }).join("")}
      <tr class="amount-row" style="background:#f5f5f5;"><td colspan="2"><strong>Celkem: ${Math.floor(totalMins/60)}h ${totalMins%60>0?totalMins%60+"m":""} (${totalHours} h)</strong></td><td></td><td style="text-align:right"><strong>${parseFloat(amount).toFixed(0)} Kč</strong></td></tr>
    </tbody>
  </table>
</div>`:""}

<div class="total-box">
  <span class="total-label">Celková částka k výplatě:</span>
  <span class="total-amount">${parseFloat(amount).toFixed(0)} Kč</span>
</div>

<div class="signature-section">
  <div class="sig-box">Podpis zaměstnavatele / vydavatele<br><br>${firma}</div>
  <div class="sig-box">Podpis příjemce<br><br>${person.name}</div>
</div>

<footer>LIBERTI</footer>
<script>setTimeout(()=>window.print(),400);<\/script>
</body></html>`);
    w.document.close();
  };

  return <div className="anim-fadein">
    <div style={{marginBottom:20}}>
      <div style={{...T.t,fontSize:FS.h,fontWeight:700,letterSpacing:"0.15em",color:C.ivory}}>VÝPLATY</div>
      <div style={{...T.m,fontSize:FS.s,color:C.dim,marginTop:2}}>Přehled odměn a výplat týmu</div>
    </div>

    {payModal&&<div style={{position:"fixed",inset:0,background:C.overlay,zIndex:800,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <Card sx={{width:"100%",maxWidth:560,padding:24,animation:"scaleIn .2s cubic-bezier(.22,1,.36,1)"}}>
        <SH c={"Vyplatit — "+payModal.person.name}/>
        <div style={{marginBottom:16}}>
          <Lbl c="Částka k výplatě (Kč)"/>
          <input value={payAmount} onChange={e=>setPayAmount(e.target.value)}
            style={{width:"100%",boxSizing:"border-box",background:C.s2,border:`1px solid ${C.merlot}`,borderRadius:4,padding:"12px 16px",color:C.ivory,...T.t,fontSize:22,fontWeight:300,outline:"none",marginTop:6}}/>
        </div>
        {payModal.entries.length>0&&<div style={{marginBottom:12,maxHeight:160,overflowY:"auto"}}>
          <Lbl c={"Hodiny ("+payModal.entries.length+")"}/>
          {payModal.entries.map(e=>{
            const mins=e.minutes||0;
            const val=Math.round((e.rate||payModal.person.rate||0)*mins/60*10)/10;
            return <div key={e.id} style={{display:"flex",justifyContent:"space-between",...T.m,fontSize:FS.s,color:C.hi,padding:"4px 0",borderBottom:`1px solid ${C.border}`}}>
              <span>{e.date} · {Math.floor(mins/60)}h{mins%60>0?" "+mins%60+"m":""} · {e.description||"—"}</span>
              <span style={{color:C.ivory}}>{val} Kč</span>
            </div>;
          })}
        </div>}
        {payModal.bonusEntries&&payModal.bonusEntries.length>0&&<div style={{marginBottom:16,maxHeight:160,overflowY:"auto"}}>
          <Lbl c={"Odměny ("+payModal.bonusEntries.length+")"}/>
          {payModal.bonusEntries.map(b=><div key={b.id} style={{display:"flex",justifyContent:"space-between",...T.m,fontSize:FS.s,color:C.amber,padding:"4px 0",borderBottom:`1px solid ${C.border}`}}>
            <span>{b.date} · {b.description}</span>
            <span style={{color:C.ivory}}>{FMT(b.amount)}</span>
          </div>)}
        </div>}
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <Btn ch="✓ Vyplatit" onClick={async()=>{
            const ok=await confirmFn("Vyplatit "+FMT(parseFloat(payAmount)||0)+" Kč osobě "+payModal.person.name+"?");
            if(!ok)return;
            const paidIds=payModal.entries.map(e=>e.id);
            setTimeEntries(timeEntries.map(e=>paidIds.includes(e.id)?{...e,paid:true}:e));
            const paidBonusIds=(payModal.bonusEntries||[]).map(b=>b.id);
            setBonuses((bonuses||[]).map(b=>paidBonusIds.includes(b.id)?{...b,paid:true}:b));
            const bonusNote=(payModal.bonusEntries||[]).length>0?" + "+(payModal.bonusEntries||[]).length+" odměn":"";
            const expEntry={id:uid(),name:"Výplata — "+payModal.person.name,category:"Výplata",amount:parseFloat(payAmount)||0,date:toDay(),supplier:payModal.person.name,note:"Vyplaceno · "+payModal.entries.length+" záz."+bonusNote+" · "+new Date().toLocaleDateString("cs-CZ"),projectId:""};
            setExpenses(prev=>[expEntry,...(prev||[])]);
            setPayModal(null);
          }}/>
          <Btn ch="Výplatní páska (PDF)" onClick={()=>generatePaySlip(payModal.person,payAmount,payModal.entries)} v="g"/>
          <Btn ch="Zrušit" onClick={()=>setPayModal(null)} v="g"/>
        </div>
      </Card>
    </div>}


    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {employees.map(p=>{
        const role=getPersonRole(p);
        const owed=calcOwed(p);
        const unpaidEntries=getUnpaid(p.id);
        const totalMins=unpaidEntries.reduce((s,e)=>s+(e.minutes||0),0);
        const isOpen=selPerson===p.id;
        return <Card key={p.id} sx={{overflow:"hidden"}}>
          <div onClick={()=>setSelPerson(isOpen?null:p.id)}
            onContextMenu={e=>openMenu(e,[
              ...(owed>0||p.payType==="fixed"?[{l:"Vyplatit "+FMT(owed),a:()=>openPayModal(p)}]:[]),

                  <div style={{gridColumn:"1/-1"}}>

                    <Btn ch="Zvrátit" v="d" sx={{height:22,padding:"0 6px",fontSize:10}} onClick={async()=>{

                      if(!ok)return;
                      setTimeEntries(timeEntries.map(x=>x.id===e.id?{...x,paid:false}:x));
                      setExpenses(prev=>(prev||[]).filter(x=>!(x.category==="Výplata"&&x.supplier===p.name&&Math.abs(x.amount-val)<0.1)));

              {getPaidBonuses(p.id).map(b=><div key={b.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderBottom:`1px solid ${C.border}`}}>

                  <span style={{...T.m,fontSize:FS.s,color:C.dim,marginLeft:8}}>{b.description}</span>

                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <span style={{...T.m,fontSize:FS.s,color:C.green}}>{FMT(b.amount)}</span>
                  <Btn ch="Zvrátit" v="d" sx={{height:22,padding:"0 6px",fontSize:10}} onClick={async()=>{
                    const ok=await confirmFn("Zvrátit tuto odměnu jako nevyplacenou?");

                    setBonuses((bonuses||[]).map(x=>x.id===b.id?{...x,paid:false}:x));
                  }}/>
                </div>
              </div>)}
            </div>}
          </div>}
        </Card>;
      })}
    </div>
  {CtxMenu}</div>;
}


function BenefitsView({benefitCategories,setBenefitCategories,confirmFn}){
  const [showNewCat,setShowNewCat]=useState(false);
  const [catF,setCatF]=useState({id:uid(),name:"",color:C.blue,description:""});
  const [expandedCat,setExpandedCat]=useState(null);
  const [progF,setProgF]=useState(null);
  const [editProg,setEditProg]=useState(null);
  const [expandedDesc,setExpandedDesc]=useState({});
  const CAT_COLORS=["#5a8aff","#3aaa5a","#e08040","#c084fc","#f0d060","#e06040","#40c0c0","#E53935"];
  const {openMenu,CtxMenu}=useCtxMenu();
  const saveCat=()=>{
    if(!catF.name)return;
    setBenefitCategories([...benefitCategories,{...catF,id:uid(),programs:[]}]);
    setCatF({id:uid(),name:"",color:C.blue,description:""});
    setShowNewCat(false);
  };
  const delCat=id=>confirmFn("Smazat kategorii a všechny programy?",()=>setBenefitCategories(benefitCategories.filter(c=>c.id!==id)));
  const saveProg=catId=>{
    if(!progF||!progF.name)return;
    setBenefitCategories(benefitCategories.map(c=>{
      if(c.id!==catId)return c;
      if(editProg){
        return {...c,programs:c.programs.map(p=>p.id===editProg?{...progF}:p)};
      }
      return {...c,programs:[...(c.programs||[]),{...progF,id:uid()}]};
    }));
    setProgF(null);setEditProg(null);
  };
  const delProg=(catId,progId)=>confirmFn("Smazat program?",()=>{
    setBenefitCategories(benefitCategories.map(c=>c.id===catId?{...c,programs:(c.programs||[]).filter(p=>p.id!==progId)}:c));
  });
  return <><div className="anim-fadein">
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22,flexWrap:"wrap",gap:10}}>
      <div>
        <div style={{...T.t,fontSize:26,fontWeight:700,letterSpacing:"0.15em",color:C.ivory}}>BENEFIČNÍ PROGRAMY</div>
        <div style={{...T.m,fontSize:FS.b,color:C.dim,marginTop:2}}>Kategorie a programy pro členy týmu</div>
      </div>
      <Btn ch="+ Kategorie" onClick={()=>setShowNewCat(true)}/>
    </div>
    {showNewCat&&<Card sx={{padding:18,marginBottom:14,borderColor:C.mBorder,animation:"scaleIn .22s cubic-bezier(.22,1,.36,1)"}}>
      <SH c="Nová kategorie"/>
      <div className="grid-2-inp">
        <Inp lbl="Název kategorie" val={catF.name} onChange={v=>setCatF(p=>({...p,name:v}))} ph="Outreach, Vzdělávání…"/>
        <Inp lbl="Popis" val={catF.description} onChange={v=>setCatF(p=>({...p,description:v}))} ph="Volitelný popis kategorie"/>
      </div>
      <div style={{marginTop:10}}>
        <Lbl c="Barva"/>
        <div style={{display:"flex",gap:7,flexWrap:"wrap",marginTop:4}}>
          {CAT_COLORS.map(c=><div key={c} onClick={()=>setCatF(p=>({...p,color:c}))} style={{width:22,height:22,borderRadius:"50%",background:c,cursor:"pointer",border:`2px solid ${catF.color===c?C.ivory:"transparent"}`,transition:"border .15s"}}/>)}
        </div>
      </div>
      <div style={{display:"flex",gap:10,marginTop:14}}><Btn ch="Vytvořit kategorii" onClick={saveCat}/><Btn ch="Zrušit" onClick={()=>setShowNewCat(false)} v="g"/></div>
    </Card>}
    {benefitCategories.length===0&&!showNewCat&&<div style={{border:`1px dashed ${C.border}`,borderRadius:4,padding:"56px 0",textAlign:"center"}}>
      <div style={{...T.t,fontSize:18,letterSpacing:"0.2em",color:C.dim,marginBottom:14}}>ŽÁDNÉ KATEGORIE</div>
      <Btn ch="+ Vytvořit první kategorii" onClick={()=>setShowNewCat(true)}/>
    </div>}
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {benefitCategories.map(cat=>{
        const isOpen=expandedCat===cat.id;
        return <Card key={cat.id} sx={{overflow:"hidden"}}>
          <div style={{display:"flex",alignItems:"center",gap:12,padding:"14px 18px",cursor:"pointer"}} onClick={()=>setExpandedCat(isOpen?null:cat.id)} onContextMenu={e=>{e.stopPropagation();openMenu(e,[{l:"Smazat kategorii",a:()=>delCat(cat.id),danger:true}]);}}>
            <div style={{width:12,height:12,borderRadius:"50%",background:cat.color,flexShrink:0}}/>
            <div style={{flex:1}}>
              <div style={{...T.t,fontSize:17,fontWeight:300,color:C.ivory}}>{cat.name}</div>
              {cat.description&&<div style={{...T.m,fontSize:FS.s,color:C.dim}}>{cat.description}</div>}
              <div style={{...T.m,fontSize:FS.s,color:C.dim,marginTop:2}}>{(cat.programs||[]).length} programů</div>
            </div>
            <span style={{...T.m,fontSize:FS.b,color:C.dim}}>{isOpen?"▲":"▼"}</span>
          </div>
          {isOpen&&<div style={{padding:"0 18px 16px",borderTop:`1px solid ${C.border}`}}>
            <div style={{marginTop:12,marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <Lbl c="Programy" s={{marginBottom:0}}/>
              <Btn ch="+ Program" onClick={()=>{setProgF({id:uid(),name:"",description:"",reward:"",active:true});setEditProg(null);}} v="g" sx={{padding:"4px 10px",fontSize:9}}/>
            </div>
            {progF&&!editProg&&<div style={{background:C.s2,borderRadius:4,padding:14,marginBottom:10}}>
              <div className="grid-2-inp">
                <Inp lbl="Název programu" val={progF.name} onChange={v=>setProgF(p=>({...p,name:v}))} ph="Network, Cold Call…"/>
                <Inp lbl="Odměna / podmínky" val={progF.reward} onChange={v=>setProgF(p=>({...p,reward:v}))} ph="Např. 500 Kč / lead"/>
                <div style={{gridColumn:"1/-1"}}><Inp lbl="Popis" val={progF.description} onChange={v=>setProgF(p=>({...p,description:v}))} ph="Stručný popis programu…" ml rows={2}/></div>
              </div>
              <div style={{display:"flex",gap:8,marginTop:10}}>
                <Btn ch="Přidat program" onClick={()=>saveProg(cat.id)}/>
                <Btn ch="Zrušit" onClick={()=>setProgF(null)} v="g"/>
              </div>
            </div>}
            {(cat.programs||[]).length===0&&!progF&&<div style={{...T.m,fontSize:FS.b,color:C.dim,padding:"8px 0"}}>Zatím žádné programy — přidejte první</div>}
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {(cat.programs||[]).map(prog=><div key={prog.id} onContextMenu={editProg!==prog.id?e=>openMenu(e,[{l:"Upravit program",a:()=>{setProgF({...prog});setEditProg(prog.id);}},{sep:true},{l:"Smazat program",a:()=>delProg(cat.id,prog.id),danger:true}]):undefined} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 12px",background:C.s2,borderRadius:4,border:`1px solid ${C.border}`,cursor:editProg!==prog.id?"context-menu":"default"}}>
                {editProg===prog.id&&progF?<div style={{flex:1}}>
                  <div className="grid-2-inp">
                    <Inp lbl="Název programu" val={progF.name} onChange={v=>setProgF(p=>({...p,name:v}))}/>
                    <Inp lbl="Odměna" val={progF.reward} onChange={v=>setProgF(p=>({...p,reward:v}))}/>
                    <div style={{gridColumn:"1/-1"}}><Inp lbl="Popis" val={progF.description} onChange={v=>setProgF(p=>({...p,description:v}))} ml rows={2}/></div>
                  </div>
                  <div style={{display:"flex",gap:8,marginTop:10}}>
                    <Btn ch="Uložit" onClick={()=>saveProg(cat.id)}/>
                    <Btn ch="Zrušit" onClick={()=>{setProgF(null);setEditProg(null);}} v="g"/>
                  </div>
                </div>:<>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:3}}>
                      <div style={{width:5,height:5,borderRadius:"50%",background:cat.color}}/>
                      <span style={{...T.m,fontSize:FS.b,color:C.ivory,fontWeight:500}}>{prog.name}</span>
                      {prog.reward&&<span style={{...T.m,fontSize:FS.s,padding:"1px 7px",borderRadius:10,background:cat.color+"22",color:cat.color}}>{prog.reward}</span>}
                    </div>
                    {prog.description&&<div onClick={e=>{e.stopPropagation();setExpandedDesc(p=>({...p,[prog.id]:!p[prog.id]}));}}
                      style={{...T.m,fontSize:FS.s,color:expandedDesc[prog.id]?C.hi:C.dim,marginLeft:13,marginTop:2,cursor:"pointer"}}
                    >
                      {expandedDesc[prog.id]?prog.description:"▸ zobrazit popis"}
                    </div>}
                  </div>
                </>}
              </div>)}
            </div>
          </div>}
        </Card>;
      })}
    </div>
  </div>{CtxMenu}</>;
}


function RolesTab({settings,onSave,confirmFn}){
  const [roleF,setRoleF]=useState(null);
  const [roleEd,setRoleEd]=useState(null);
  const [showCode,setShowCode]=useState({});
  const {openMenu,CtxMenu}=useCtxMenu();
  const roles=settings.systemRoles||[
    {v:"admin",l:"Admin",code:"1473695",isAdmin:true,description:"Plný přístup"},
    {v:"employee",l:"Zaměstnanec",code:"1793812",isAdmin:false,description:""},
  ];

  const rolesDS=useDragSort(roles, newOrder=>onSave({...settings,systemRoles:newOrder}));
  const saveRole=()=>{
    if(!roleF||!roleF.l)return;
    let next;
    if(roleEd){
      next=roles.map(r=>r.v===roleEd?{...r,...roleF}:r);
    } else {
      const newRole={v:"role_"+uid(),l:roleF.l,code:roleF.code||"",isAdmin:false,description:roleF.description||"",finType:roleF.finType||"employee",homepage:roleF.homepage||""};
      next=[...roles,newRole];
    }
    onSave({...settings,systemRoles:next});
    // Aktualizuj cache
    localStorage.setItem("liberti_roles",JSON.stringify(next));
    setRoleF(null);setRoleEd(null);
  };

  const delRole=async v=>{
    if(v==="admin"){await confirmFn("Admin roli nelze smazat.");return;}
    const ok=await confirmFn("Smazat roli "+roles.find(r=>r.v===v)?.l+"?");
    if(!ok)return;
    const next=roles.filter(r=>r.v!==v);
    onSave({...settings,systemRoles:next});
    localStorage.setItem("liberti_roles",JSON.stringify(next));
  };

  const startEdit=r=>{setRoleF({l:r.l,code:r.code||"",description:r.description||"",isAdmin:r.isAdmin,finType:r.finType||"employee",homepage:r.homepage||""});setRoleEd(r.v);};

  return <><div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <SH c={"Systémové role ("+roles.length+")"}/>
      <Btn ch="+ Nová role" onClick={()=>{setRoleF({l:"",code:"",description:"",isAdmin:false,finType:"employee"});setRoleEd(null);}} v="g" sx={{padding:"5px 12px"}}/>
    </div>
    <div style={{...T.m,fontSize:FS.s,color:C.dim,marginBottom:12,lineHeight:1.7}}>
      Každá role má vlastní přístupový kód. Admin role má vždy plný přístup.
      Oprávnění stránek nastavíš v záložce Oprávnění.
    </div>

    {roleF&&!roleEd&&<Card sx={{padding:16,marginBottom:12,borderColor:C.mBorder,animation:"scaleIn .22s cubic-bezier(.22,1,.36,1)"}}>
      <SH c="Nová role"/>
      <div className="grid-2-inp">
        <Inp lbl="Název role" val={roleF.l} onChange={v=>setRoleF(p=>({...p,l:v}))} ph="Designer, Sales…"/>
        <Inp lbl="Přístupový kód (7 číslic)" val={roleF.code} onChange={v=>setRoleF(p=>({...p,code:v.replace(/\D/g,"").slice(0,7)}))} ph="1234567" type="text"/>
        <div style={{gridColumn:"1/-1"}}><Inp lbl="Popis" val={roleF.description||""} onChange={v=>setRoleF(p=>({...p,description:v}))} ph="Krátký popis role…"/></div>
        <div style={{gridColumn:"1/-1"}}><Inp lbl="Homepage (stránka po přihlášení)" val={roleF.homepage||""} onChange={v=>setRoleF(p=>({...p,homepage:v}))} opts={[{v:"",l:"— výchozí (první dostupná) —"},
      {v:"system/settings",l:"Systém – Údaje"},
      {v:"firma/clients",l:"Firma – Klienti"},
      {v:"firma/team",l:"Firma – Tým"},
      {v:"firma/payroll",l:"Firma – Výplaty"},
      {v:"firma/benefits",l:"Firma – Benefity"},
      {v:"finance/overview",l:"Finance – Přehled"},
      {v:"finance/incomes",l:"Finance – Příjmy"},
      {v:"finance/expenses",l:"Finance – Výdaje"},
      {v:"office/projects",l:"Office – Projekty"},
      {v:"office/tasks",l:"Office – To-Do"},
      {v:"office/hours",l:"Office – Docházka"},
      {v:"office/meetings",l:"Office – Meetings"},
      {v:"office/outreach",l:"Office – Outreach"}]}/></div>

        {roleEd===r.v&&roleF

              <div>

                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <input value={showCode[r.v]?roleF.code:"•".repeat(roleF.code?.length||0)}
                    onChange={e=>{if(showCode[r.v])setRoleF(p=>({...p,code:e.target.value.replace(/\D/g,"").slice(0,7)}));}}
                    placeholder="1234567"
                    style={{flex:1,background:C.s2,border:`1px solid ${C.border}`,borderRadius:3,padding:"11px 12px",color:C.ivory,...T.m,fontSize:FS.b,outline:"none"}}/>
                  <button onClick={()=>setShowCode(s=>({...s,[r.v]:!s[r.v]}))} style={{...T.m,fontSize:FS.s,background:"transparent",border:`1px solid ${C.border}`,borderRadius:3,padding:"8px 10px",cursor:"pointer",color:C.dim,flexShrink:0}}>{showCode[r.v]?"Skrýt":"Zobrazit"}</button>
                </div>
              </div>
              <div style={{gridColumn:"1/-1"}}><Inp lbl="Popis" val={roleF.description||""} onChange={v=>setRoleF(p=>({...p,description:v}))}/></div>
              <div style={{gridColumn:"1/-1"}}><Inp lbl="Homepage" val={roleF.homepage||""} onChange={v=>setRoleF(p=>({...p,homepage:v}))} opts={[{v:"",l:"— výchozí (první dostupná) —"},
      {v:"system/settings",l:"Systém – Údaje"},
      {v:"firma/clients",l:"Firma – Klienti"},
      {v:"firma/team",l:"Firma – Tým"},
      {v:"firma/payroll",l:"Firma – Výplaty"},
      {v:"firma/benefits",l:"Firma – Benefity"},
      {v:"finance/overview",l:"Finance – Přehled"},
      {v:"finance/incomes",l:"Finance – Příjmy"},
      {v:"finance/expenses",l:"Finance – Výdaje"},
      {v:"office/projects",l:"Office – Projekty"},
      {v:"office/tasks",l:"Office – To-Do"},
      {v:"office/hours",l:"Office – Docházka"},
      {v:"office/meetings",l:"Office – Meetings"},
      {v:"office/outreach",l:"Office – Outreach"}]}/></div>
            </div>
            <div style={{marginTop:12}}>
              <Inp lbl="Typ financování" val={roleF.finType||"employee"} onChange={v=>setRoleF(p=>({...p,finType:v}))}
                opts={[{v:"employee",l:"Zaměstnanec — hodiny → Mzda (Výplaty)"},{v:"owner",l:"Majitel — hodiny → Networth firmy"},{v:"freelancer",l:"Freelancer — hodiny → Faktura dodavatele"}]}/>
            </div>
            <div style={{display:"flex",gap:10,marginTop:12}}>
              <Btn ch="Uložit" onClick={saveRole}/>
              <Btn ch="Zrušit" onClick={()=>{setRoleF(null);setRoleEd(null);}} v="g"/>
            </div>
          </div>
          :<div style={{width:"100%"}}>
            <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:10}}>
              <span style={{...T.t,fontSize:17,fontWeight:300,color:C.ivory,letterSpacing:"0.06em"}}>{r.l}</span>
              {r.isAdmin&&<span style={{...T.m,fontSize:FS.s,color:C.blue,background:C.blueBg,padding:"1px 7px",borderRadius:10}}>Admin</span>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:8}}>
              <div style={{background:C.s2,borderRadius:3,padding:"6px 10px"}}>
                <div style={{...T.m,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:2}}>Popis</div>
                <div style={{...T.m,fontSize:FS.s,color:r.description?C.hi:C.dim}}>{r.description||"—"}</div>
              </div>
              <div style={{background:C.s2,borderRadius:3,padding:"6px 10px"}}>
                <div style={{...T.m,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:2}}>Typ</div>
                <div style={{...T.m,fontSize:FS.s,color:r.finType==="owner"?C.amber:r.finType==="freelancer"?C.blue:C.green}}>
                  {r.finType==="owner"?"Majitel":r.finType==="freelancer"?"Freelancer":"Zaměstnanec"}
                </div>
              </div>
              <div style={{background:C.s2,borderRadius:3,padding:"6px 10px"}}>
                <div style={{...T.m,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:2}}>Kód</div>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <span style={{...T.m,fontSize:FS.s,color:C.ivory,letterSpacing:"0.12em"}}>{showCode[r.v]?r.code||"—":"•••••••"}</span>
                  <button onClick={e=>{e.stopPropagation();setShowCode(s=>({...s,[r.v]:!s[r.v]}));}} style={{...T.m,fontSize:9,background:"transparent",border:`1px solid ${C.border}`,borderRadius:2,cursor:"pointer",color:C.dim,padding:"1px 5px"}}>{showCode[r.v]?"skrýt":"zobrazit"}</button>
                </div>
              </div>
            </div>
          </div>}
      </Card>;})}
    </div>
  </div>{CtxMenu}</>;
}


function TeamView({settings,onSave,onSavePeople,onSaveOrgSkills,timeEntries,tasks=[],benefitCategories,teams,setTeams,confirmFn}){
  const [people,setPeople]=useState(settings.people||[]);
  const [ed,setEd]=useState(null);const [f,setF]=useState(null);
  const [teamEd,setTeamEd]=useState(null);const [teamF,setTeamF]=useState(null);
  const [activeTab,setActiveTab]=useState("teams");
  const [q,setQ]=useState("");
  const [detail,setDetail]=useState(null);
  const [dragPersonId,setDragPersonId]=useState(null);
  const [selectedNode,setSelectedNode]=useState(null);
  const [panelTab,setPanelTab]=useState("detail");
  const [addSearch,setAddSearch]=useState("");
  const selectNode=node=>{setSelectedNode(node);setPanelTab("detail");setAddSearch("");};
  const closePanel=()=>{setSelectedNode(null);setPanelTab("detail");setAddSearch("");};
  const [pan,setPan]=React.useState({x:60,y:40});
  const [isPanning,setIsPanning]=React.useState(false);
  const panStart=React.useRef(null);
  const [dragPid,setDragPid]=React.useState(null);
  const [dropTarget,setDropTarget]=React.useState(null);
  const [posEditId,setPosEditId]=React.useState(null);
  const [posEditName,setPosEditName]=React.useState("");
  const [compareIds,setCompareIds]=React.useState([]);
  const [dropFlash,setDropFlash]=React.useState(null);
  const flashDrop=(teamId,posId)=>{const key=teamId+"_"+posId;setDropFlash(key);setTimeout(()=>setDropFlash(null),700);};
  const [dragMember,setDragMember]=React.useState(null);
  const [rmZoneHover,setRmZoneHover]=React.useState(false);
  // ── Skills system ───────────────────────────────────────────
  const [orgSkills,setOrgSkillsState]=useState(settings.orgSkills||[]);
  const saveOrgSkills=sk=>{setOrgSkillsState(sk);onSaveOrgSkills(sk);};
  const [skillMgr,setSkillMgr]=useState(false);
  const [newSkName,setNewSkName]=useState("");
  const [newSkCat,setNewSkCat]=useState("");
  const [personSkillMode,setPersonSkillMode]=useState(null); // personId in edit mode
  const [addSkillId,setAddSkillId]=useState("");
  const [addSkillLvl,setAddSkillLvl]=useState(50);
  const [addSkillOpen,setAddSkillOpen]=useState(false);
  const [editingSkillId,setEditingSkillId]=useState(null);
  const [addingOrgSkill,setAddingOrgSkill]=useState(false);
  const savePersonSkills=(personId,skills)=>{
    const next=people.map(p=>p.id===personId?{...p,skills}:p);
    setPeople(next);onSavePeople(next);
  };
  const getEffectiveLvl=(person,skillId)=>{
    const base=(person.skills||[]).find(s=>s.skillId===skillId)?.level||0;
    const hrs=(timeEntries||[]).filter(e=>e.personId===person.id&&!e.isPause).reduce((s,e)=>s+(e.minutes||0),0)/60;
    return Math.min(100,base+Math.floor(hrs/100));
  };
  // Save position skill requirements
  const savePosSkills=(teamId,posId,patch)=>{
    setTeams((teams||[]).map(t=>{
      if(t.id!==teamId)return t;
      const nt=normalizeTeam(t);
      return {...nt,positions:(nt.positions||[]).map(p=>p.id===posId?{...p,...patch}:p)};
    }));
  };
  const peopleDS=useDragSort(people, newOrder=>{setPeople(newOrder);onSavePeople(newOrder);});
  const allRolesCombined=[...(settings.systemRoles||[]),...(settings.customRoles||[])];
  const {openMenu,CtxMenu}=useCtxMenu();
  const u=k=>v=>setF(p=>({...p,[k]:v}));
  // All benefit program IDs from all categories
  const allProgs=(benefitCategories||[]).flatMap(cat=>(cat.programs||[]).map(p=>({...p,catName:cat.name,catColor:cat.color})));
  const save=()=>{if(!f.name)return;const next=ed==="new"?[...people,f]:people.map(p=>p.id===ed?f:p);setPeople(next);onSavePeople(next);setEd(null);setF(null);};
  const del=async id=>{
    const ok=await confirmFn("Smazat tohoto člena?");
    if(!ok)return;
    const next=people.filter(p=>p.id!==id);
    setPeople(next);onSavePeople(next);
  };
  const toggle=id=>{const next=people.map(p=>p.id===id?{...p,active:!p.active}:p);setPeople(next);onSavePeople(next);};
  const TEAM_COLORS=["#5a8aff","#3aaa5a","#e08040","#c084fc","#f0d060","#E53935","#40c0c0"];
  const defPositions=()=>[{id:uid(),name:"Vedoucí",order:0},{id:uid(),name:"Člen",order:1}];
  const normalizeTeam=t=>{
    if(t.members)return t;
    const pos=defPositions();
    return {...t,positions:pos,members:(t.memberIds||[]).map(pid=>({personId:pid,positionId:pos[1].id}))};
  };
  const saveTeam=()=>{
    if(!teamF||!teamF.name)return;
    const team={...teamF,positions:teamF.positions&&teamF.positions.length>0?teamF.positions:defPositions(),members:teamF.members||[]};
    const next=teamEd==="new"?[...(teams||[]),{...team,id:uid()}]:(teams||[]).map(t=>t.id===teamEd?team:t);
    setTeams(next);setTeamEd(null);setTeamF(null);
  };
  const delTeam=async id=>{
    const ok=await confirmFn("Smazat tým?");
    if(!ok)return;
    setTeams((teams||[]).filter(t=>t.id!==id));
  };
  const addTeamMember=(teamId,personId,positionId)=>{
    setTeams((teams||[]).map(t=>{
      if(t.id!==teamId)return t;
      const nt=normalizeTeam(t);
      if((nt.members||[]).some(m=>m.personId===personId))return nt;
      return {...nt,members:[...(nt.members||[]),{personId,positionId}]};
    }));
  };
  const removeTeamMember=(teamId,personId)=>{
    setTeams((teams||[]).map(t=>{
      if(t.id!==teamId)return t;
      const nt=normalizeTeam(t);
      return {...nt,members:(nt.members||[]).filter(m=>m.personId!==personId)};
    }));
  };
  const changeTeamMemberPos=(teamId,personId,positionId)=>{
    setTeams((teams||[]).map(t=>{
      if(t.id!==teamId)return t;
      const nt=normalizeTeam(t);
      return {...nt,members:(nt.members||[]).map(m=>m.personId===personId?{...m,positionId}:m)};
    }));
  };
  const savePosEdit=(teamId,posId,newName)=>{
    if(!newName.trim())return;
    setTeams((teams||[]).map(t=>{
      if(t.id!==teamId)return t;
      const nt=normalizeTeam(t);
      return {...nt,positions:(nt.positions||[]).map(p=>p.id===posId?{...p,name:newName.trim()}:p)};
    }));
    setPosEditId(null);setPosEditName("");
  };

  // ── Detail view ─────────────────────────────────────────────
  const detailPerson=detail?people.find(p=>p.id===detail):null;
  if(detail&&detailPerson){
    const p=detailPerson;
    const ft=getPersonFinType(p,allRolesCombined);
    const isOwner=ft==="owner";
    const pEnts=(timeEntries||[]).filter(e=>e.personId===p.id&&!e.isPause);
    const totalMins=pEnts.reduce((s,e)=>s+(e.minutes||0),0);
    const compVal=pEnts.reduce((s,e)=>s+calcEntryVal(e,people),0);
    const costVal=pEnts.reduce((s,e)=>s+calcEntryCost(e,people),0);
    const payout=isOwner?0:costVal;
    const profit=isOwner?compVal:compVal-costVal;
    const roleColor=C.merlot;
    const roleLbl=[...(settings.systemRoles||[]),...ROLES].find(r=>r.v===p.role)?.l||p.role;
    const pBenefits=allProgs.filter(prog=>(p.benefitIds||[]).includes(prog.id));
    // Monthly hours (last 12 months)
    const now=new Date();
    const moLabels=[],moVals=[];
    for(let i=11;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      moLabels.push(["Led","Úno","Bře","Dub","Kvě","Čvn","Čvc","Srp","Zář","Říj","Lis","Pro"][d.getMonth()]);
      moVals.push(Math.round(pEnts.filter(e=>e.date&&e.date.startsWith(key)).reduce((s,e)=>s+(e.minutes||0),0)/60*10)/10);
    }
    const recentEnts=[...pEnts].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,8);
    return <div className="anim-fadein">
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:24,flexWrap:"wrap"}}>
        <button onClick={()=>{setDetail(null);setEd(null);setF(null);}} style={{...T.m,fontSize:FS.s,background:"transparent",border:`1px solid ${C.border}`,borderRadius:4,padding:"7px 12px",cursor:"pointer",color:C.dim}}>← Zpět</button>
        <div style={{display:"flex",alignItems:"center",gap:10,flex:1}}>
          <div style={{width:10,height:10,borderRadius:"50%",background:p.color,flexShrink:0}}/>
          <div style={{...T.t,fontSize:FS.h,fontWeight:700,letterSpacing:"0.12em",color:C.ivory}}>{p.name}</div>
          <span style={{...T.m,fontSize:FS.s,color:roleColor,border:"1px solid currentColor",borderRadius:3,padding:"2px 8px",textTransform:"uppercase",letterSpacing:"0.08em"}}>{roleLbl}</span>
          {p.active===false&&<span style={{...T.m,fontSize:FS.s,color:C.dim,border:`1px solid ${C.border}`,borderRadius:3,padding:"2px 8px"}}>Neaktivní</span>}
        </div>
        <Btn ch="Upravit" onClick={()=>{setF({...p,benefitIds:p.benefitIds||[]});setEd(p.id);}} v="g" sx={{padding:"7px 14px"}}/>
        <Btn ch="× Smazat" onClick={()=>del(p.id).then(()=>setDetail(null))} v="d" sx={{padding:"7px 14px"}}/>
      </div>
      {/* Výplata panel */}
      {(payout>0||compVal>0)&&<div style={{marginBottom:16,padding:"14px 18px",borderRadius:6,
        background:isOwner?"#071510":"#12100a",border:`2px solid ${isOwner?C.green:C.amber}`,
        display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
        <div>
          <div style={{...T.m,fontSize:FS.s,letterSpacing:"0.14em",textTransform:"uppercase",color:isOwner?C.green:C.amber,marginBottom:4}}>{isOwner?"Příjem (profit)":"Výplata"}</div>
          <div style={{...T.t,fontSize:"clamp(22px,4vw,34px)",fontWeight:300,color:isOwner?C.green:C.amber,lineHeight:1}}>{FMT(isOwner?compVal:payout)}</div>
        </div>
        <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
          <div style={{textAlign:"right"}}>
            <div style={{...T.m,fontSize:FS.s,color:C.dim,marginBottom:2}}>Odpracováno</div>
            <div style={{...T.t,fontSize:18,fontWeight:300,color:C.blue}}>{fmtMins(totalMins)}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{...T.m,fontSize:FS.s,color:C.dim,marginBottom:2}}>Hodnota hodin</div>
            <div style={{...T.t,fontSize:18,fontWeight:300,color:C.ivory}}>{FMT(compVal)}</div>
          </div>
          {!isOwner&&<div style={{textAlign:"right"}}>
            <div style={{...T.m,fontSize:FS.s,color:C.dim,marginBottom:2}}>Profit firmy</div>
            <div style={{...T.t,fontSize:18,fontWeight:300,color:C.green}}>{FMT(profit)}</div>
          </div>}
        </div>
      </div>}
      {/* Edit form */}
      {ed&&f&&<Card sx={{padding:18,marginBottom:16,borderColor:C.mBorder,animation:"scaleIn .22s cubic-bezier(.22,1,.36,1)"}}>
        <SH c="Upravit člena"/>
        <div className="grid-2-inp">
          <Inp lbl="Jméno" val={f.name} onChange={u("name")} ph="Jméno osoby"/>
          <Inp lbl="Uživatelské jméno" val={f.username||""} onChange={u("username")} ph="novak.jan"/>
          <Inp lbl="Hlavní role" val={f.role} onChange={u("role")} opts={[...(settings.systemRoles||[]).map(r=>({v:r.v,l:r.l})),...(settings.customRoles||[]).map(r=>({v:r.v,l:r.l}))]}/>
          <Inp lbl="Typ vyplácení" val={f.payType} onChange={u("payType")} opts={PAY_TYPES}/>
          {f.payType==="share"?<>
            <Inp lbl="Podíl z obratu (%)" type="number" val={f.share} onChange={v=>u("share")(+v)}/>
            <Inp lbl="Hodinová sazba (Kč)" type="number" val={f.rate} onChange={v=>u("rate")(+v)}/>
          </>:<Inp lbl={f.payType==="fixed"?"Měsíčně (Kč)":"Hodinová sazba (Kč)"} type="number" val={f.rate} onChange={v=>u("rate")(+v)}/>}
          <div><Lbl c="Barva"/>
            <div style={{display:"flex",gap:7,flexWrap:"wrap",marginTop:4}}>
              {PERSON_COLORS.map(c=><div key={c} onClick={()=>u("color")(c)} style={{width:22,height:22,borderRadius:"50%",background:c,cursor:"pointer",border:`2px solid ${f.color===c?C.ivory:"transparent"}`,transition:"border .15s"}}/>)}
            </div>
          </div>
          <div style={{display:"flex",alignItems:"flex-end",paddingBottom:4}}><ChkRow label="Aktivní člen" checked={f.active!==false} onChange={v=>u("active")(v)}/></div>
        </div>
        {allProgs.length>0&&<div style={{marginTop:12}}>
          <Lbl c="Benefiční programy"/>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
            {allProgs.map(prog=>{const active=(f.benefitIds||[]).includes(prog.id);return <div key={prog.id} onClick={()=>u("benefitIds")(active?(f.benefitIds||[]).filter(id=>id!==prog.id):[...(f.benefitIds||[]),prog.id])} style={{...T.m,fontSize:FS.s,padding:"3px 10px",borderRadius:10,cursor:"pointer",background:active?prog.catColor+"33":C.s2,color:active?prog.catColor:C.dim,border:`1px solid ${active?prog.catColor:C.border}`}}>{prog.name}</div>;})}
          </div>
        </div>}
        <div style={{display:"flex",gap:10,marginTop:14}}><Btn ch="Uložit" onClick={()=>{save();setF(null);setEd(null);}}/><Btn ch="Zrušit" onClick={()=>{setEd(null);setF(null);}} v="g"/></div>
      </Card>}
      {/* KPI grid */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:16}} className="grid-kpi">
        {[
          {l:"Celkem hodin",v:null,txt:fmtMins(totalMins),c:C.blue},
          {l:"Hodnota hodin",v:compVal,c:C.ivory},
          {l:isOwner?"Příjem":"Výplata",v:isOwner?compVal:payout,c:isOwner?C.green:C.amber},
          {l:"Profit firmy",v:profit,c:profit>=0?C.green:C.merlot},
        ].map(k=><Card key={k.l} sx={{padding:"12px 16px"}}>
          <Lbl c={k.l} s={{fontSize:FS.s,marginBottom:4}}/>
          <div style={{...T.t,fontSize:FS.h,fontWeight:300,color:k.c,lineHeight:1}}>{k.txt||FMT(k.v)}</div>
        </Card>)}
      </div>
      {/* Spider chart */}
      {(()=>{
        // Spolehlivost: score based on how early tasks are completed before deadline
        const doneTasks=(tasks||[]).filter(t=>t.assignedTo===p.id&&t.status==="Hotovo"&&t.deadline);
        let spolScore=50;
        if(doneTasks.length>0){
          let totalPts=0,counted=0;
          doneTasks.forEach(t=>{
            const tEnts=(timeEntries||[]).filter(e=>e.taskId===t.id&&!e.isPause&&e.date);
            if(tEnts.length===0)return;
            const completionDate=tEnts.reduce((mx,e)=>e.date>mx?e.date:mx,"");
            const daysBefore=Math.round((new Date(t.deadline)-new Date(completionDate))/86400000);
            const pts=daysBefore>0?Math.min(5,daysBefore):daysBefore===0?0:Math.max(-50,daysBefore*5);
            totalPts+=pts;counted++;
          });
          if(counted>0){const avg=totalPts/counted;spolScore=Math.round(Math.min(100,Math.max(0,(avg+50)/55*100)));}
        }
        // Komunikace — manual
        const komScore=p.komunikace??50;
        // Výnos — person's share of total revenue relative to average
        const allRevenue=(timeEntries||[]).filter(e=>!e.isPause).reduce((s,e)=>s+calcEntryVal(e,people),0);
        const activePeopleCount=people.filter(x=>x.active!==false).length||1;
        const vynosScore=allRevenue>0?Math.min(100,Math.round(compVal*activePeopleCount/allRevenue*50)):0;
        // Spokojenost — avg mood of last 30 days entries
        const cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);
        const cutoffStr=cutoff.toISOString().slice(0,10);
        const moodEnts=pEnts.filter(e=>e.mood&&e.mood>=1&&e.mood<=5&&(e.date||"")>=cutoffStr);
        const spokoScore=moodEnts.length>0?Math.round((moodEnts.reduce((s,e)=>s+e.mood,0)/moodEnts.length-1)/4*100):50;
        // Samostatnost — manual
        const samScore=p.samostatnost??50;
        const axes=[
          {label:"Spolehlivost",score:spolScore,manual:false},
          {label:"Komunikace",score:komScore,manual:true,key:"komunikace"},
          {label:"Výnos",score:vynosScore,manual:false},
          {label:"Spokojenost",score:spokoScore,manual:false},
          {label:"Samostatnost",score:samScore,manual:true,key:"samostatnost"},
        ];
        const N=axes.length,sz=280,cx=sz/2,cy=sz/2,r=96;
        const ang=i=>(2*Math.PI*i/N)-Math.PI/2;
        const spt=(i,pct)=>[cx+Math.cos(ang(i))*r*pct,cy+Math.sin(ang(i))*r*pct];
        const poly=pts=>pts.map(pp=>pp.join(",")).join(" ");
        const gridLevels=[0.25,0.5,0.75,1];
        const dataPoints=axes.map((_,i)=>spt(i,Math.max(0.01,axes[i].score/100)));
        const overallScore=Math.round(axes.reduce((s,a)=>s+a.score,0)/N);
        const scoreLabel=overallScore>=70?"Výborný":overallScore>=40?"Průměrný":"Potřebuje pozornost";
        return <Card sx={{marginBottom:16,padding:"18px 20px"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
            <span style={{...T.t,fontSize:14,fontWeight:600,letterSpacing:"0.12em",color:C.ivory,textTransform:"uppercase"}}>Profil spolupráce</span>
            <span style={{...T.m,fontSize:10,color:roleColor,background:roleColor+"1a",border:`1px solid ${roleColor}44`,borderRadius:3,padding:"2px 9px",letterSpacing:"0.1em",textTransform:"uppercase",marginLeft:"auto"}}>{scoreLabel}</span>
          </div>
          <div style={{display:"flex",gap:48,alignItems:"center"}}>
            <svg width={sz} height={205} viewBox="-30 5 340 248" style={{flexShrink:0,overflow:"visible"}}>
              {gridLevels.map(l=><polygon key={l} points={poly(Array.from({length:N},(_,i)=>spt(i,l)))} fill="none" stroke={roleColor+(l===1?"30":"18")} strokeWidth={l===1?1:0.5} strokeDasharray={l===1?"none":"4,3"}/>)}
              {axes.map((_,i)=>{const[x,y]=spt(i,1);return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={roleColor+"28"} strokeWidth="1"/>;} )}
              <polygon points={poly(dataPoints)} fill={roleColor+"20"} stroke={roleColor+"88"} strokeWidth="1.5" strokeLinejoin="round"/>
              {dataPoints.map(([x,y],i)=>axes[i].score>0?<circle key={i} cx={x} cy={y} r="4" fill={roleColor} stroke={C.s1} strokeWidth="1.5"/>:null)}
              {axes.map((a,i)=>{
                const la=ang(i);const lx=cx+Math.cos(la)*(r+28);const ly=cy+Math.sin(la)*(r+28);
                const anchor=lx<cx-6?"end":lx>cx+6?"start":"middle";
                return <text key={i} x={lx} y={ly} textAnchor={anchor} dominantBaseline="middle" fontSize="11" fill={C.dim} fontFamily="Montserrat,sans-serif">{a.label}</text>;
              })}
              <polygon points={poly(Array.from({length:N},(_,i)=>spt(i,Math.max(0.04,overallScore/100))))} fill={roleColor+"55"} stroke={roleColor} strokeWidth="1.5" strokeLinejoin="round"/>
              <text x={cx} y={cy} textAnchor="middle" dominantBaseline="central" fontSize="28" fontWeight="600" fill={roleColor} fontFamily="Teko,sans-serif">{overallScore}</text>
            </svg>
            <div style={{flex:1,display:"flex",flexDirection:"column",gap:12}}>
              {axes.map(a=><div key={a.label}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{...T.m,fontSize:FS.s,color:C.dim}}>{a.label}</span>
                  <span style={{...T.m,fontSize:FS.s,color:roleColor,fontWeight:600}}>{a.score}</span>
                </div>
                {a.manual
                  ?<input type="range" min="0" max="100" value={a.score}
                      onChange={ev=>{const val=Number(ev.target.value);setPeople(ps=>{const updated=ps.map(x=>x.id===p.id?{...x,[a.key]:val}:x);onSavePeople(updated);return updated;});}}
                      className="profile-slider"
                      style={{background:`linear-gradient(to right,${roleColor}b3 0%,${roleColor}b3 ${a.score}%,${C.s2} ${a.score}%,${C.s2} 100%)`}}/>
                  :<div style={{height:3,background:C.s2,borderRadius:2}}>
                      <div style={{height:"100%",width:a.score+"%",background:roleColor,borderRadius:2,opacity:0.7,transition:"width .5s ease"}}/>
                    </div>}
              </div>)}
            </div>
          </div>
        </Card>;
      })()}
      {/* Chart + info */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}} className="grid-fin-2">
        <Card sx={{padding:"16px 18px"}}>
          <SH c="Hodiny posledních 12 měsíců"/>
          {moVals.some(v=>v>0)
            ?<AreaChart series={[{label:"Hodiny",color:roleColor,values:moVals}]} labels={moLabels} height={120}/>
            :<div style={{...T.m,fontSize:FS.s,color:C.dim,padding:"20px 0",textAlign:"center"}}>Zatím žádné záznamy</div>}
        </Card>
        <Card sx={{padding:"16px 18px"}}>
          <SH c="Informace"/>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {[
              {l:"Uživatelské jméno",v:p.username},
              {l:"Typ vyplácení",v:PAY_TYPES.find(x=>x.v===p.payType)?.l},
              {l:"Sazba",v:p.payType==="share"?p.share+"% z obratu":p.payType==="fixed"?FMT(p.rate)+"/měs":FMT(p.rate)+"/h"},
              {l:"Záznamy",v:String(pEnts.length)},
              {l:"Status",v:p.active===false?"Neaktivní":"Aktivní"},
            ].filter(x=>x.v).map(x=><div key={x.l} style={{display:"flex",gap:12,alignItems:"baseline"}}>
              <span style={{...T.m,fontSize:FS.s,color:C.dim,minWidth:130,flexShrink:0}}>{x.l}</span>
              <span style={{...T.m,fontSize:FS.b,color:C.ivory}}>{x.v}</span>
            </div>)}
            {pBenefits.length>0&&<div>
              <div style={{...T.m,fontSize:FS.s,color:C.dim,marginBottom:6}}>Benefity</div>
              <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                {pBenefits.map(prog=><span key={prog.id} style={{...T.m,fontSize:FS.s,padding:"2px 8px",borderRadius:10,background:prog.catColor+"22",color:prog.catColor,border:`1px solid ${prog.catColor}44`}}>{prog.name}</span>)}
              </div>
            </div>}
          </div>
        </Card>
      </div>
      {/* Recent entries */}
      {recentEnts.length>0&&<Card sx={{padding:"14px 18px"}}>
        <SH c={"Poslední záznamy ("+pEnts.length+")"}/>
        {recentEnts.map(e=>{
          const proj=(settings.projects||[]).find(pr=>pr.id===e.projectId);
          const eVal=calcEntryVal(e,people);
          return <div key={e.id} style={{display:"flex",alignItems:"center",gap:12,padding:"9px 0",borderBottom:`1px solid ${C.border}`}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{...T.m,fontSize:FS.b,color:C.ivory,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.description||proj?.name||"—"}</div>
              <div style={{...T.m,fontSize:FS.s,color:C.dim}}>{fmtD(e.date)}{proj?" · "+proj.name:""}</div>
            </div>
            <span style={{...T.t,fontSize:14,fontWeight:300,color:C.blue,flexShrink:0}}>{fmtMins(e.minutes||0)}</span>
            <span style={{...T.t,fontSize:14,fontWeight:300,color:C.ivory,flexShrink:0,minWidth:56,textAlign:"right"}}>{FMT(eVal)}</span>
          </div>;
        })}
        {pEnts.length>8&&<div style={{...T.m,fontSize:FS.s,color:C.dim,marginTop:8,textAlign:"center"}}>+{pEnts.length-8} dalších záznamů</div>}
      </Card>}
    {CtxMenu}</div>;
  }

  return <div className="anim-fadein" style={{display:"flex",flexDirection:"column"}}>
    {/* Header */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:24,flexWrap:"wrap",gap:10,order:0}}>

          {l:"Hodin odpracováno",v:fmtMins(totalMins),c:C.blue,icon:<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>},
          {l:"Celková výplata",v:FMT(totalPayout),c:C.amber,icon:<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>},
          {l:"Profit z hodin",v:FMT(Math.max(0,totalProfit)),c:totalProfit>=0?C.green:C.merlot,icon:<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>},
        ].map(s=><div key={s.l} style={{background:C.s1,border:`1px solid ${C.border}`,borderRadius:6,overflow:"hidden",display:"flex"}}>
          <div style={{flex:1,padding:"14px 16px"}}>
            <div style={{...T.m,fontSize:8,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6}}>{s.l}</div>
            <div style={{...T.t,fontSize:26,fontWeight:700,color:s.c,lineHeight:1}}>{s.v}</div>
          </div>
          <div style={{width:50,display:"flex",alignItems:"center",justifyContent:"center",color:C.dim,borderLeft:`1px solid ${C.border}`,flexShrink:0}}>{s.icon}</div>
        </div>)}
      </div>
      {/* Search */}
      <div style={{marginBottom:14}}><SearchBar value={q} onChange={setQ} ph="Hledat člena…"/></div>
      {/* Edit form */}
      {ed&&f&&<Card sx={{padding:18,marginBottom:14,borderColor:C.mBorder,animation:"scaleIn .22s cubic-bezier(.22,1,.36,1)"}}>
        <SH c={ed==="new"?"Nový člen":"Upravit člena"}/>
        <div className="grid-2-inp">
          <Inp lbl="Jméno" val={f.name} onChange={u("name")} ph="Jméno osoby"/>
          <Inp lbl="Uživatelské jméno (pro přihlášení)" val={f.username||""} onChange={u("username")} ph="novak.jan"/>
          <Inp lbl="Hlavní role" val={f.role} onChange={u("role")} opts={[...(settings.systemRoles||[]).map(r=>({v:r.v,l:r.l})),...(settings.customRoles||[]).map(r=>({v:r.v,l:r.l}))]}/>
          <Inp lbl="Vedlejší role" val={f.role2||""} onChange={u("role2")} opts={[{v:"",l:"— žádná —"},...(settings.systemRoles||[]).map(r=>({v:r.v,l:r.l})),...(settings.customRoles||[]).map(r=>({v:r.v,l:r.l}))]}/>
          <Inp lbl="Záložní role" val={f.role3||""} onChange={u("role3")} opts={[{v:"",l:"— žádná —"},...(settings.systemRoles||[]).map(r=>({v:r.v,l:r.l})),...(settings.customRoles||[]).map(r=>({v:r.v,l:r.l}))]}/>
          <Inp lbl="Typ vyplácení" val={f.payType} onChange={u("payType")} opts={PAY_TYPES}/>
          {f.payType==="share"?<>

          <div><Lbl c="Barva"/>

                style={{...T.m,fontSize:FS.s,padding:"3px 10px",borderRadius:10,cursor:"pointer",transition:"all .15s",
                  background:active?prog.catColor+"33":C.s2,color:active?prog.catColor:C.dim,

        <div style={{display:"flex",gap:10,marginTop:14}}><Btn ch="Uložit" onClick={save}/><Btn ch="Zrušit" onClick={()=>{setEd(null);setF(null);}} v="g"/></div>

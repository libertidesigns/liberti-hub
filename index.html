              {isOwner&&compVal>0&&<div style={{...T.t,fontSize:20,fontWeight:300,color:C.green,lineHeight:1,marginBottom:8}}>{FMT(compVal)}</div>}
              <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                <span style={{...T.m,fontSize:10,color:C.dim,textTransform:"uppercase",letterSpacing:"0.06em"}}>
                  {PAY_TYPES.find(x=>x.v===p.payType)?.l}: <span style={{color:C.hi}}>{p.payType==="share"?p.share+"%":FMT(p.rate)}{p.payType==="hourly"?"/h":p.payType==="fixed"?"/měs":""}</span>
                </span>
                {mins>0&&<span style={{...T.m,fontSize:10,color:C.dim,textTransform:"uppercase",letterSpacing:"0.06em"}}>{fmtMins(mins)}</span>}
              </div>
            </div>
          </div>;
        })}
      </div>}
    </>;})()}

    <>

          <Inp lbl="Popis" val={teamF.description||""} onChange={v=>setTeamF(p=>({...p,description:v}))} ph="Čemu se tým věnuje…"/>

function useTimer(onSave){
  const [tick,setTick]=useState(0);
  const state=useRef({running:false,elapsed:0,personId:"",projectId:"",taskId:"",desc:"",saved:false});
  const rafRef=useRef(null);
  const startTsRef=useRef(null);
  const pausedRef=useRef(0);
  const s=state.current;
  const redraw=useCallback(()=>setTick(t=>t+1),[]);
  const tick_fn=useCallback(()=>{
    s.elapsed=pausedRef.current+Math.floor((Date.now()-startTsRef.current)/1000);
    redraw();
    rafRef.current=requestAnimationFrame(tick_fn);
  },[]);
  const start=useCallback(()=>{
    startTsRef.current=Date.now();
    pausedRef.current=s.elapsed;
    s.running=true;s.saved=false;
    rafRef.current=requestAnimationFrame(tick_fn);
    redraw();
  },[]);
  const pause=useCallback(()=>{
    pausedRef.current=s.elapsed;
    s.running=false;
    if(rafRef.current)cancelAnimationFrame(rafRef.current);
    redraw();
  },[]);
  const reset=useCallback(()=>{
    s.running=false;s.elapsed=0;s.saved=false;
    pausedRef.current=0;
    if(rafRef.current)cancelAnimationFrame(rafRef.current);
    redraw();
  },[]);
  const save=useCallback(()=>{
    if(s.elapsed<30)return;
    const mins=Math.max(1,Math.round(s.elapsed/60));
    onSave({personId:s.personId,projectId:s.projectId,taskId:s.taskId,
      minutes:mins,description:s.desc||"Timer záznam",date:toDay(),billed:false});
    s.running=false;s.elapsed=0;s.saved=true;
    pausedRef.current=0;s.desc="";
    if(rafRef.current)cancelAnimationFrame(rafRef.current);
    redraw();
    setTimeout(()=>{s.saved=false;redraw();},2000);
  },[]);
  useEffect(()=>()=>{if(rafRef.current)cancelAnimationFrame(rafRef.current);},[]);
  const setPersonId=useCallback(v=>{s.personId=v;redraw();},[]);
  const setProjectId=useCallback(v=>{s.projectId=v;s.taskId="";redraw();},[]);
  const setTaskId=useCallback(v=>{s.taskId=v;redraw();},[]);
  const setDesc=useCallback(v=>{s.desc=v;redraw();},[]);
  return {...s,start,pause,reset,save,setPersonId,setProjectId,setTaskId,setDesc,
    active:s.running||s.elapsed>0};
}

/* ── LiveTimer display ───────────────────────────────────────────── */
function LiveTimer({timer,people,projects,tasks}){
  const {running,elapsed,personId,projectId,taskId,desc,saved,
    start,pause,reset,save,setPersonId,setProjectId,setTaskId,setDesc}=timer;
  const hh=Math.floor(elapsed/3600);
  const mm=Math.floor((elapsed%3600)/60);
  const ss=elapsed%60;
  const fmt=(hh>0?String(hh).padStart(2,"0")+":":"")+String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");
  // All open tasks; filtered to project when one is selected
  const openTasks=tasks.filter(t=>t.status!=="Hotovo");
  const projTasks=projectId?openTasks.filter(t=>t.projectId===projectId):openTasks;
  // Selecting a task auto-links its project
  const handleTaskChange=tId=>{
    setTaskId(tId);
    if(tId){const t=tasks.find(x=>x.id===tId);if(t?.projectId)setProjectId(t.projectId);}
  };
  // Changing project clears task if it belongs to a different project
  const handleProjectChange=pId=>{
    setProjectId(pId);
    if(taskId){const t=tasks.find(x=>x.id===taskId);if(t?.projectId&&t.projectId!==pId)setTaskId("");}

      {!running&&elapsed===0&&<Btn ch="▶  Start" onClick={start} sx={{padding:"14px 36px",fontSize:13}}/>}
      {running&&<Btn ch="⏸  Pauza" onClick={pause} sx={{padding:"14px 28px",fontSize:13,background:"transparent",border:`1px solid ${C.merlot}`,color:C.merlot}}/>}
      {!running&&elapsed>0&&<><Btn ch="▶  Pokračovat" onClick={start} sx={{padding:"14px 28px",fontSize:13}}/><Btn ch="↺ Reset" onClick={reset} v="g" sx={{padding:"14px 16px",fontSize:13}}/></>}
      {elapsed>=30&&!running&&<Btn ch="↓  Uložit" onClick={()=>{save();setFullscreen(false);}} sx={{padding:"14px 28px",fontSize:13,background:C.merlot,border:"none"}}/>}
    </div>

  </div>;
  return <Card sx={{padding:"16px 20px",marginBottom:16,borderColor:running?C.merlot:C.border,transition:"border-color .3s"}}>
    <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:12,flexWrap:"wrap"}}>
      <div style={{...T.t,fontSize:running||elapsed>0?40:26,fontWeight:300,letterSpacing:"0.08em",
        color:running?C.merlot:elapsed>0?C.ivory:C.dim,lineHeight:1,minWidth:130,
        transition:"font-size .2s,color .2s",fontVariantNumeric:"tabular-nums"}}>
        {running||elapsed>0?fmt:"TIMER"}
      </div>
      {running&&<div style={{display:"flex",alignItems:"center",gap:6}}>

        <span style={{...T.m,fontSize:FS.s,color:C.merlot,letterSpacing:"0.12em",textTransform:"uppercase"}}>Probíhá</span>

      {!running&&elapsed>0&&<span style={{...T.m,fontSize:FS.s,color:C.dim,letterSpacing:"0.1em",textTransform:"uppercase"}}>Pozastaveno</span>}

function HoursView({timer,timeEntries,setTimeEntries,projects,tasks,setTasks,settings,confirmFn,authUser,authRole,authPersonId,incomes,setIncomes}){
  const people=settings.people||[];
  const allRolesCombined=[...(settings.systemRoles||[]),...(settings.customRoles||[])];
  const {openMenu,CtxMenu}=useCtxMenu();
  const loggedInPerson=people.find(p=>
    (authPersonId&&p.id===authPersonId)||
    (p.username&&authUser&&p.username.toLowerCase()===authUser.toLowerCase())||
    (p.name&&authUser&&p.name.toLowerCase()===authUser.toLowerCase())
  );
  const isAdminHV=authRole&&(authRole.isAdmin||authRole.v==="admin"||allRolesCombined.find(r=>r.v===authRole.v)?.finType==="owner");
  const [q,setQ]=useState("");
  const [pFilter,setPFilter]=useState("all");
  const [sortBy,setSortBy]=useState("date_desc");
  const [filterOpen,setFilterOpen]=useState(false);
  const [sortOpen,setSortOpen]=useState(false);
  const [expandedId,setExpandedId]=useState(null);
  const [editDraft,setEditDraft]=useState(null);
  const saveEdit=()=>{if(!editDraft)return;setTimeEntries(timeEntries.map(x=>x.id===editDraft.id?{...x,...editDraft}:x));setEditDraft(null);};
  const filterRef=useRef(null);
  const sortRef=useRef(null);
  useEffect(()=>{
    const h=ev=>{
      if(filterRef.current&&!filterRef.current.contains(ev.target))setFilterOpen(false);
      if(sortRef.current&&!sortRef.current.contains(ev.target))setSortOpen(false);
    };
    document.addEventListener("mousedown",h);
    return()=>document.removeEventListener("mousedown",h);
  },[]);
  const SORTS=[
    {id:"date_desc",l:"Nejnovější"},
    {id:"date_asc",l:"Nejstarší"},
    {id:"mins_desc",l:"Nejvíce hodin"},
    {id:"val_desc",l:"Nejvyšší hodnota"},
  ];
  const del=async id=>{
    if(!await confirmFn("Smazat záznam?"))return;
    const entry=timeEntries.find(x=>x.id===id);
    const remaining=timeEntries.filter(x=>x.id!==id);
    setTimeEntries(remaining);
    // Pokud měl záznam taskId, přepočítej progress úkolu z zbývajících záznamů
    if(entry?.taskId&&setTasks){
      const taskEntries=remaining
        .filter(x=>x.taskId===entry.taskId&&!x.isPause&&x.taskProgress!=null)
        .sort((a,b)=>(a.date||"").localeCompare(b.date||"")||((a.id||"").localeCompare(b.id||"")));
      const newProg=taskEntries.length>0?taskEntries[taskEntries.length-1].taskProgress:0;
      setTasks(tasks.map(t=>t.id===entry.taskId?{...t,progress:newProg}:t));
    }
  };
  const getEntryPauses=(e)=>e.taskId
    ?timeEntries.filter(p=>p.isPause&&p.taskId===e.taskId&&p.date===e.date&&p.personId===e.personId)
    :[];
  const handleRowClick=(e)=>{
    const hasPauses=getEntryPauses(e).length>0;
    if(!e.taskNote&&!hasPauses){setExpandedId(null);return;}
    const next=expandedId===e.id?null:e.id;
    setExpandedId(next);
    if(next&&isAdminHV&&!(e.noteReadBy||[]).includes(loggedInPerson?.id||"ceo")){
      setTimeEntries(timeEntries.map(x=>x.id===e.id?{...x,noteReadBy:[...(x.noteReadBy||[]),(loggedInPerson?.id||"ceo")]}:x));
    }
  };
  // Latest entry per task (for progress bar logic)
  const latestEntryIdByTask={};
  [...timeEntries].filter(e=>!e.isPause&&e.taskId).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||((a.id||"").localeCompare(b.id||""))).forEach(e=>{latestEntryIdByTask[e.taskId]=e.id;});
  const filtered=timeEntries.filter(e=>{
    if(e.isPause)return false;
    const mQ=!q||(e.description+(projects.find(p=>p.id===e.projectId)?.name||"")+(e.taskNote||"")).toLowerCase().includes(q.toLowerCase());
    const mP=pFilter==="all"||e.personId===pFilter;
    return mQ&&mP;
  });
  const sortFn=(a,b)=>{
    if(sortBy==="date_asc")return (a.date||"").localeCompare(b.date||"");
    if(sortBy==="mins_desc")return (b.minutes||0)-(a.minutes||0);
    if(sortBy==="val_desc")return calcEntryVal(b,people)-calcEntryVal(a,people);
    return (b.date||"").localeCompare(a.date||"");

        </div>
        <div style={{width:50,display:"flex",alignItems:"center",justifyContent:"center",color:C.dim,borderLeft:`1px solid ${C.border}`,flexShrink:0}}>{s.icon}</div>
      </div>)}
    </div>
    {/* Filters */}
    <div style={{display:"flex",gap:6,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
      <SearchBar value={q} onChange={setQ} ph="Hledat záznamy…"/>
      {/* Person filter dropdown */}
      <div ref={filterRef} style={{position:"relative"}}>
        <button onClick={()=>{setFilterOpen(o=>!o);setSortOpen(false);}}
          style={{display:"flex",alignItems:"center",gap:6,padding:"7px 12px",background:pFilter!=="all"?C.s2:C.s1,border:`1px solid ${pFilter!=="all"?C.ivory:C.border}`,borderRadius:4,cursor:"pointer",...T.m,fontSize:FS.s,color:pFilter!=="all"?C.ivory:C.dim,whiteSpace:"nowrap",transition:"all .15s"}}>
          {pFilter==="all"?"Osoba":people.find(p=>p.id===pFilter)?.name||"Osoba"}
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        {filterOpen&&<div style={{position:"absolute",top:"calc(100% + 4px)",left:0,zIndex:200,background:C.s1,border:`1px solid ${C.border}`,borderRadius:6,minWidth:160,boxShadow:"0 8px 24px rgba(0,0,0,0.5)",overflow:"hidden"}}>
          {[{id:"all",l:"Vše — všechny osoby"},...people.filter(p=>p.active!==false).map(p=>({id:p.id,l:p.name,c:p.color}))].map(p=>(
            <div key={p.id} onClick={()=>{setPFilter(p.id);setFilterOpen(false);}}
              style={{display:"flex",alignItems:"center",gap:8,padding:"9px 14px",cursor:"pointer",background:pFilter===p.id?C.s2:"transparent",...T.m,fontSize:FS.b,color:pFilter===p.id?C.ivory:C.dim,transition:"background .1s"}}>
              {p.c&&<div style={{width:7,height:7,borderRadius:"50%",background:p.c,flexShrink:0}}/>}
              {p.l}
            </div>
          ))}
        </div>}
      </div>
      {/* Sort dropdown */}
      <div ref={sortRef} style={{position:"relative"}}>
        <button onClick={()=>{setSortOpen(o=>!o);setFilterOpen(false);}}
          style={{display:"flex",alignItems:"center",gap:6,padding:"7px 12px",background:sortBy!=="date_desc"?C.s2:C.s1,border:`1px solid ${sortBy!=="date_desc"?C.ivory:C.border}`,borderRadius:4,cursor:"pointer",...T.m,fontSize:FS.s,color:sortBy!=="date_desc"?C.ivory:C.dim,whiteSpace:"nowrap",transition:"all .15s"}}>
          {SORTS.find(s=>s.id===sortBy)?.l||"Řadit"}
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        {sortOpen&&<div style={{position:"absolute",top:"calc(100% + 4px)",left:0,zIndex:200,background:C.s1,border:`1px solid ${C.border}`,borderRadius:6,minWidth:170,boxShadow:"0 8px 24px rgba(0,0,0,0.5)",overflow:"hidden"}}>
          {SORTS.map(s=>(
            <div key={s.id} onClick={()=>{setSortBy(s.id);setSortOpen(false);}}
              style={{padding:"9px 14px",cursor:"pointer",background:sortBy===s.id?C.s2:"transparent",...T.m,fontSize:FS.b,color:sortBy===s.id?C.ivory:C.dim,transition:"background .1s"}}>
              {s.l}
            </div>
          ))}
        </div>}
      </div>
      {/* Active filter chips */}
      {pFilter!=="all"&&<div style={{display:"flex",alignItems:"center",gap:4,padding:"4px 8px",background:C.s2,borderRadius:4,...T.m,fontSize:FS.s,color:C.dim}}>
        <div style={{width:6,height:6,borderRadius:"50%",background:people.find(p=>p.id===pFilter)?.color||C.dim}}/>
        {people.find(p=>p.id===pFilter)?.name}
        <span onClick={()=>setPFilter("all")} style={{cursor:"pointer",color:C.dim,marginLeft:2,lineHeight:1}}>×</span>
      </div>}
    </div>
    {/* Records */}
    {sortedDates.length===0
      ?<div style={{border:`1px dashed ${C.border}`,borderRadius:4,padding:"40px 0",textAlign:"center",...T.m,fontSize:FS.b,color:C.dim}}>Žádné záznamy docházky</div>
      :sortedDates.map(date=>{
        const de=grouped[date];
        const dayMins=de.reduce((s,e)=>s+(e.minutes||0),0);
        const dayVal=de.reduce((s,e)=>s+calcEntryVal(e,people,projects),0);
        return <div key={date} style={{marginBottom:16}}>
          {/* Date header */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 2px",marginBottom:6,borderBottom:`1px solid ${C.border}`}}>
            <span style={{...T.m,fontSize:FS.b,fontWeight:600,color:C.hi,letterSpacing:"0.08em"}}>{fmtD(date)}</span>
            <span style={{...T.m,fontSize:FS.s,color:C.dim}}>{fmtMins(dayMins)} · {FMT(dayVal)}</span>
          </div>
          {/* Entry rows */}
          {de.map(e=>{
            const person=people.find(p=>p.id===e.personId);
            const proj=projects.find(p=>p.id===e.projectId);
            const taskForE=(tasks||[]).find(t=>t.id===e.taskId);
            const hasNote=!!e.taskNote;
            const noteRead=(e.noteReadBy||[]).length>0;
            const hasUnreadNote=hasNote&&!noteRead;
            const isExpanded=expandedId===e.id;
            const pausesForEntry=getEntryPauses(e);
            const hasExpandable=hasNote||pausesForEntry.length>0;
            // Progress delta — strict ordering by (date, id) so same-day entries don't cross-contaminate
            const curProg=e.taskProgress||0;
            const prevEntry=taskForE
              ?[...timeEntries].filter(x=>x.taskId===e.taskId&&x.id!==e.id&&!x.isPause&&
                  ((x.date||"")<(e.date||"")||((x.date||"")===(e.date||"")&&(x.id||"")<(e.id||""))))
                .sort((a,b)=>(b.date||"").localeCompare(a.date||"")||((b.id||"").localeCompare(a.id||"")))
                [0]
              :null;
            const prevProg=prevEntry?.taskProgress||0;
            const delta=Math.max(0,curProg-prevProg);
            // Finance
            const finType=getPersonFinType(person,allRolesCombined);
            const compVal=calcEntryVal(e,people,projects);
            // CEO se nepočítá do výplat — výplata=0, profit=celý příjem
            const persVal=finType==="owner"?0:calcEntryCost(e,people);
            const margin=compVal-persVal;
            const persColor=finType==="owner"?C.amber:finType==="freelancer"?C.blue:C.green;
            const ctxItems=[...(isAdminHV?[{l:"Upravit záznam",a:()=>setEditDraft({...e})}]:[]),{sep:true},{l:"Smazat záznam",a:()=>del(e.id),danger:true}];
            return <div key={e.id}
              onContextMenu={ev=>openMenu(ev,ctxItems)}
              onClick={()=>handleRowClick(e)}
              style={{
                border:`1px solid ${hasUnreadNote?C.merlot:isExpanded?C.bHi:C.border}`,
                borderRadius:5,marginBottom:5,padding:"11px 14px",
                background:hasUnreadNote?"rgba(229,57,53,0.04)":C.s0,
                cursor:hasExpandable?"pointer":"default",
                transition:"border-color .2s,background .2s",
                animation:"fadeIn .18s ease"
              }}>
              <div style={{display:"grid",gridTemplateColumns:"44px 1fr 1fr 1fr 1fr 260px",gridTemplateRows:"auto auto",columnGap:10,rowGap:9,alignItems:"center"}}>
                {/* Mood — spans both rows, no text */}
                <div style={{gridRow:"1/3",display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {e.mood&&e.mood>=1&&e.mood<=5
                    ?<MoodFace idx={e.mood-1} color={MOODS[e.mood-1].c} size={32}/>
                    :<div style={{width:28,height:28,borderRadius:"50%",border:`1px solid ${C.border}`,opacity:0.25}}/>}
                </div>
                {/* Row 1: Name | Project | Task (spans 2 cols) */}
                <span style={{gridColumn:2,gridRow:1,...T.m,fontSize:FS.b,color:C.ivory,fontWeight:500,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{person?.name||"—"}</span>
                <span style={{gridColumn:3,gridRow:1,...T.m,fontSize:FS.s,color:C.dim,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{proj?.name||"Samostatný úkol"}</span>
                <span style={{gridColumn:"4/6",gridRow:1,...T.m,fontSize:FS.s,color:taskForE?C.hi:C.dim,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{taskForE?.title||e.description||"—"}</span>
                {/* Progress bar — col 6, spans both rows, horizontal */}
                <div style={{gridColumn:6,gridRow:"1/3",display:"flex",alignItems:"center",gap:8,padding:"4px 0"}}>
                  <span style={{fontFamily:"'Teko',sans-serif",fontSize:18,fontWeight:400,color:delta>0?C.merlot:C.dim,minWidth:48,flexShrink:0,lineHeight:1}}>{delta>0?`+${delta}%`:""}</span>
                  <div style={{flex:1,height:9,background:C.s2,borderRadius:5,overflow:"hidden",position:"relative"}}>
                    {prevProg>0&&<div style={{position:"absolute",left:0,top:0,height:"100%",width:`${prevProg}%`,background:C.mBorder}}/>}
                    {delta>0&&<div style={{position:"absolute",left:`${prevProg}%`,top:0,height:"100%",width:`${delta}%`,background:C.merlot}}/>}
                    {!delta&&curProg>0&&<div style={{position:"absolute",left:0,top:0,height:"100%",width:`${curProg}%`,background:C.mBorder}}/>}
                  </div>
                  <span style={{fontFamily:"'Teko',sans-serif",fontSize:18,fontWeight:400,color:curProg>0?C.ivory:C.dim,minWidth:42,flexShrink:0,textAlign:"right",lineHeight:1}}>{curProg>0?`${curProg}%`:""}</span>
                </div>
                {/* Row 2: Čas | Příjem | Výplata | Profit */}
                {[
                  {l:"Čas",v:fmtMins(e.minutes),c:C.ivory},
                  {l:"Příjem",v:FMT(compVal),c:C.blue},
                  {l:"Výplata",v:FMT(persVal),c:persColor},
                  {l:"Profit",v:margin>0?FMT(margin):"—",c:margin>0?C.green:C.dim},
                ].map((col,i)=><div key={col.l} style={{gridColumn:i+2,gridRow:2,display:"flex",alignItems:"baseline",gap:5}}>
                  <span style={{fontFamily:"'Montserrat',sans-serif",fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",flexShrink:0}}>{col.l}</span>
                  <span style={{fontFamily:"'Teko',sans-serif",fontSize:18,fontWeight:400,color:col.c,lineHeight:1.1}}>{col.v}</span>
                </div>)}
              </div>
              {/* Expanded: poznámka + pauzy */}
              {isExpanded&&hasExpandable&&<div style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${C.border}`,animation:"fadeIn .15s ease",display:"flex",flexDirection:"column",gap:10}}>
                {hasNote&&<div>
                  <div style={{...T.m,fontSize:8,color:C.dim,letterSpacing:"0.1em",marginBottom:5,textTransform:"uppercase"}}>Poznámka</div>
                  <div style={{...T.m,fontSize:FS.b,color:C.hi,lineHeight:1.8,whiteSpace:"pre-wrap"}}>{e.taskNote}</div>
                </div>}
                {pausesForEntry.length>0&&<div>
                  <div style={{...T.m,fontSize:8,color:C.dim,letterSpacing:"0.1em",marginBottom:6,textTransform:"uppercase"}}>
                    Přestávky — celkem {fmtMins(pausesForEntry.reduce((s,p)=>s+(p.minutes||0),0))}
                  </div>
                  {pausesForEntry.map(p=>(
                    <div key={p.id} style={{display:"flex",alignItems:"center",gap:10,padding:"5px 0",borderBottom:`1px solid ${C.border+"44"}`}}>
                      <span style={{...T.m,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.08em"}}>⏸</span>
                      <span style={{...T.t,fontSize:14,fontWeight:300,color:C.dim}}>{fmtMins(p.minutes||0)}</span>
                      <span style={{...T.m,fontSize:FS.s,color:C.dim,flex:1}}>{p.description?.replace(/^\[Přestávka\] /,"")}</span>
                    </div>
                  ))}
                </div>}
              </div>}
            </div>;
          })}
        </div>;
      })}
  </div>{CtxMenu}
  {editDraft&&<div style={STY.overlay} onClick={()=>setEditDraft(null)}>
    <div onClick={e=>e.stopPropagation()} style={{background:C.s1,border:`1px solid ${C.bHi}`,borderRadius:6,padding:"28px 32px",maxWidth:520,width:"95%",maxHeight:"90vh",overflowY:"auto",animation:"scaleIn .2s cubic-bezier(.22,1,.36,1)"}}>
      <div style={{...T.t,fontSize:20,fontWeight:700,letterSpacing:"0.15em",color:C.ivory,marginBottom:22}}>UPRAVIT ZÁZNAM</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px 14px",marginBottom:14}}>
        <div>
          <div style={{...T.m,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Datum</div>
          <input type="date" value={editDraft.date||""} onChange={e=>setEditDraft(d=>({...d,date:e.target.value}))} style={{width:"100%",background:C.s2,border:`1px solid ${C.border}`,borderRadius:4,padding:"8px 12px",color:C.ivory,...T.m,fontSize:FS.b,outline:"none"}}/>
        </div>
        <div>
          <div style={{...T.m,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Osoba</div>
          <select value={editDraft.personId||""} onChange={e=>setEditDraft(d=>({...d,personId:e.target.value}))} style={{width:"100%",background:C.s2,border:`1px solid ${C.border}`,borderRadius:4,padding:"8px 12px",color:C.ivory,...T.m,fontSize:FS.b,outline:"none"}}>
            {people.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </div>
        <div>
          <div style={{...T.m,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Projekt</div>
          <select value={editDraft.projectId||""} onChange={e=>{const pid=e.target.value;const projRate=projects.find(p=>p.id===pid)?.billingRate||0;setEditDraft(d=>({...d,projectId:pid,billingRate:projRate||d.billingRate||0}));}} style={{width:"100%",background:C.s2,border:`1px solid ${C.border}`,borderRadius:4,padding:"8px 12px",color:C.ivory,...T.m,fontSize:FS.b,outline:"none"}}>
            <option value="">Bez projektu</option>
            {projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </div>
        <div>
          <div style={{...T.m,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Čas — <span style={{color:C.ivory}}>{fmtMins(editDraft.minutes||0)}</span></div>
          <div style={{display:"flex",gap:6}}>
            <input type="number" min="0" max="23" placeholder="hod" value={Math.floor((editDraft.minutes||0)/60)||""} onChange={e=>setEditDraft(d=>({...d,minutes:Math.max(0,(parseInt(e.target.value)||0)*60+(d.minutes||0)%60)}))} style={{flex:1,background:C.s2,border:`1px solid ${C.border}`,borderRadius:4,padding:"8px 10px",color:C.ivory,...T.m,fontSize:FS.b,outline:"none",minWidth:0}}/>
            <input type="number" min="0" max="59" placeholder="min" value={(editDraft.minutes||0)%60||""} onChange={e=>setEditDraft(d=>({...d,minutes:Math.max(1,Math.floor((d.minutes||0)/60)*60+(parseInt(e.target.value)||0))}))} style={{flex:1,background:C.s2,border:`1px solid ${C.border}`,borderRadius:4,padding:"8px 10px",color:C.ivory,...T.m,fontSize:FS.b,outline:"none",minWidth:0}}/>
          </div>
        </div>
      </div>
      <div style={{marginBottom:12}}>
        <div style={{...T.m,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Popis</div>
        <input type="text" value={editDraft.description||""} onChange={e=>setEditDraft(d=>({...d,description:e.target.value}))} placeholder="Popis práce" style={{width:"100%",background:C.s2,border:`1px solid ${C.border}`,borderRadius:4,padding:"8px 12px",color:C.ivory,...T.m,fontSize:FS.b,outline:"none"}}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px 14px",marginBottom:14}}>
        <div>
          <div style={{...T.m,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>
            Sazba projektu (Kč/h) <span style={{color:C.blue}}>→ Příjem</span>
          </div>
          <input type="number" min="0" value={editDraft.billingRate??0} onChange={e=>setEditDraft(d=>({...d,billingRate:parseFloat(e.target.value)||0}))}
            style={{width:"100%",background:C.s2,border:`1px solid ${C.blue}44`,borderRadius:4,padding:"8px 12px",color:C.ivory,...T.m,fontSize:FS.b,outline:"none"}}/>
          <div style={{...T.m,fontSize:8,color:C.dim,marginTop:3}}>
            Příjem: {FMT(Math.round(((editDraft.billingRate||0)*(editDraft.minutes||0)/60)*10)/10)} Kč
          </div>
        </div>
        <div>
          <div style={{...T.m,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>
            Sazba osoby (Kč/h) <span style={{color:C.amber}}>→ Výplata</span>
          </div>
          <input type="number" min="0" value={editDraft.rate??people.find(p=>p.id===editDraft.personId)?.rate??0} onChange={e=>setEditDraft(d=>({...d,rate:parseFloat(e.target.value)||0}))}
            style={{width:"100%",background:C.s2,border:`1px solid ${C.amber}44`,borderRadius:4,padding:"8px 12px",color:C.ivory,...T.m,fontSize:FS.b,outline:"none"}}/>
          <div style={{...T.m,fontSize:8,color:C.dim,marginTop:3}}>
            Výplata: {FMT(Math.round(((editDraft.rate??people.find(p=>p.id===editDraft.personId)?.rate??0)*(editDraft.minutes||0)/60)*10)/10)} Kč
          </div>
        </div>
      </div>
      <div style={{marginBottom:14}}>
        <div style={{...T.m,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>Nálada</div>
        <div style={{display:"flex",gap:6}}>
          {[1,2,3,4,5].map(i=><button key={i} onClick={()=>setEditDraft(d=>({...d,mood:d.mood===i?null:i}))} style={{flex:1,padding:"7px 4px",background:editDraft.mood===i?"rgba(229,57,53,0.12)":"transparent",border:`1px solid ${editDraft.mood===i?C.merlot:C.border}`,borderRadius:4,cursor:"pointer",...T.m,fontSize:8,color:editDraft.mood===i?C.ivory:C.dim,transition:"all .12s",textAlign:"center"}}>{MOODS[i-1].l}</button>)}
        </div>
      </div>
      <div style={{marginBottom:editDraft.taskId?14:20}}>
        <div style={{...T.m,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Poznámka k úkolu</div>
        <textarea value={editDraft.taskNote||""} onChange={e=>setEditDraft(d=>({...d,taskNote:e.target.value||null}))} rows={3} placeholder="Poznámka…" style={{width:"100%",background:C.s2,border:`1px solid ${C.border}`,borderRadius:4,padding:"8px 12px",color:C.ivory,...T.m,fontSize:FS.b,outline:"none",resize:"vertical"}}/>
      </div>
      {editDraft.taskId&&<div style={{marginBottom:20}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
          <div style={{...T.m,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em"}}>Postup úkolu</div>
          <div style={{...T.m,fontSize:9,color:C.ivory,fontWeight:600}}>{editDraft.taskProgress||0}%</div>
        </div>
        <input type="range" min="0" max="100" step="5" value={editDraft.taskProgress||0} onChange={e=>setEditDraft(d=>({...d,taskProgress:parseInt(e.target.value)}))} className="profile-slider" style={{background:`linear-gradient(to right,${C.merlot} ${editDraft.taskProgress||0}%,${C.s2} ${editDraft.taskProgress||0}%)`}}/>
      </div>}
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <button onClick={()=>setEditDraft(null)} style={{...T.m,background:"transparent",border:`1px solid ${C.bHi}`,borderRadius:4,padding:"9px 18px",cursor:"pointer",fontSize:10,letterSpacing:"0.14em",textTransform:"uppercase",color:C.hi}}>Zrušit</button>
        <button onClick={saveEdit} style={{...T.m,background:C.merlot,border:"none",borderRadius:4,padding:"9px 18px",cursor:"pointer",fontSize:10,letterSpacing:"0.14em",textTransform:"uppercase",color:C.ivory,fontWeight:500}}>Uložit změny</button>
      </div>
    </div>
  </div>}
  </>;
}

// Priorita 1–5 (zpětně kompatibilní se starými string hodnotami)
const prioNum=p=>{if(!p)return 3;if(typeof p==="number")return Math.max(1,Math.min(5,p));if(p==="Vysoká")return 5;if(p==="Střední")return 3;if(p==="Nízká")return 1;return 3;};
const PrioDots=({n,size=5,gap=2})=><div style={{display:"flex",gap,alignItems:"center"}}>{[1,2,3,4,5].map(i=><div key={i} style={{width:size,height:size,borderRadius:"50%",background:i<=n?"#E6E6E8":"#2A2A30",flexShrink:0}}/>)}</div>;
const fmtDeadline=dl=>{
  const today=toDay();
  if(!dl)return null;
  if(dl===today)return{l:"Dnes",c:C.merlot};
  const tom=new Date(today);tom.setDate(tom.getDate()+1);
  const tomStr=tom.toISOString().split("T")[0];
  if(dl===tomStr)return{l:"Zítra",c:C.amber};
  const d=new Date(dl);
  const days=["Ne","Po","Út","St","Čt","Pá","So"];
  const isOver=dl<today;
  return{l:`${days[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.`,c:isOver?C.merlot:C.dim};
};

/* ── Mood labels + colors (shared by TaskDetailPanel & HoursView) ── */
const MOODS=[{l:"Špatně",c:C.merlot},{l:"Nic moc",c:C.amber},{l:"OK",c:C.dim},{l:"Dobře",c:C.hi},{l:"Skvěle",c:C.green}];

/* ── Timer icon button ───────────────────────────────────────────── */
const TBtn=({onClick,title,c,children,sx})=><button onClick={onClick} title={title}
  style={{width:30,height:30,background:"none",border:`1px solid ${c||C.border}`,borderRadius:4,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:c||C.dim,flexShrink:0,transition:"background .12s",...(sx||{})}}

</button>;

/* ── Mood face SVG icons ─────────────────────────────────────────── */
const MoodFace=({idx,color,size=20})=>{
  const p={width:size,height:size,viewBox:"0 0 24 24",fill:"none",stroke:color,strokeWidth:"1.8",strokeLinecap:"round",strokeLinejoin:"round"};
  const ey=idx===4
    ?<><circle cx="8.5" cy="9" r="1.2" fill={color} stroke="none"/><circle cx="15.5" cy="9" r="1.2" fill={color} stroke="none"/></>
    :<><circle cx="8.5" cy="9.5" r="1" fill={color} stroke="none"/><circle cx="15.5" cy="9.5" r="1" fill={color} stroke="none"/></>;
  const mouths=["M7.5 16.5 Q12 12 16.5 16.5","M8.5 16 Q12 13.5 15.5 16",null,"M8.5 14.5 Q12 17.5 15.5 14.5","M7.5 13.5 Q12 18 16.5 13.5"];
  return <svg {...p}><circle cx="12" cy="12" r="9.5"/>{ey}{mouths[idx]?<path d={mouths[idx]}/>:<line x1="8.5" y1="15.5" x2="15.5" y2="15.5"/>}</svg>;
};

/* ── Task Detail Panel ───────────────────────────────────────────── */
function TaskDetailPanel({task,tasks,setTasks,timeEntries,setTimeEntries,people,projects,loggedInPerson,minimized,setMinimized,onClose}){
  const TKEY="liberti_panel_timer_"+task.id;
  const person=people.find(p=>p.id===task.assignedTo);
  const proj=projects.find(p=>p.id===task.projectId);
  const fd=fmtDeadline(task.deadline);
  const pn=prioNum(task.priority);
  // Timer (RAF-based, persists via localStorage)
  const [tcnt,setTick]=useState(0);
  const secsRef=useRef(0);const runRef=useRef(false);
  const rafRef=useRef(null);const startRef=useRef(null);const pausedRef=useRef(0);
  const tickRef=useRef(null);
  const lastPauseStartRef=useRef(null);
  tickRef.current=()=>{
    const s=pausedRef.current+Math.floor((Date.now()-startRef.current)/1000);
    secsRef.current=s;
    try{localStorage.setItem(TKEY,JSON.stringify({s,running:true,startTs:startRef.current,paused:pausedRef.current}));}catch(e){}
    setTick(t=>t+1);
    rafRef.current=requestAnimationFrame(tickRef.current);
  };
  const secs=secsRef.current;
  const tRunning=runRef.current;
  const startT=()=>{startRef.current=Date.now();pausedRef.current=secs;runRef.current=true;setTick(t=>t+1);try{localStorage.setItem(TKEY,JSON.stringify({s:secs,running:true,startTs:startRef.current,paused:pausedRef.current}));}catch(e){}rafRef.current=requestAnimationFrame(tickRef.current);};
  const pauseT=()=>{lastPauseStartRef.current=Date.now();pausedRef.current=secs;runRef.current=false;if(rafRef.current)cancelAnimationFrame(rafRef.current);try{localStorage.setItem(TKEY,JSON.stringify({s:secs,running:false,paused:secs}));}catch(e){}setTick(t=>t+1);};
  const resumeT=()=>{
    if(lastPauseStartRef.current){
      const pMs=Date.now()-lastPauseStartRef.current;
      const pMins=Math.round(pMs/60000);
      if(pMins>=1){const pid=loggedInPerson?.id||task.assignedTo||"";setTimeEntries([{id:uid(),personId:pid,projectId:task.projectId||"",taskId:task.id,date:toDay(),minutes:pMins,description:"[Přestávka] "+task.title,isPause:true,mood:null,taskProgress:null,taskNote:null,noteReadBy:[],rate:0,billed:false},...timeEntries]);}
      lastPauseStartRef.current=null;
    }
    startT();
  };
  const resetT=()=>{lastPauseStartRef.current=null;pausedRef.current=0;secsRef.current=0;runRef.current=false;if(rafRef.current)cancelAnimationFrame(rafRef.current);try{localStorage.removeItem(TKEY);}catch(e){}setTick(t=>t+1);};
  // Restore timer from localStorage on mount — if was running, resume with elapsed time
  useEffect(()=>{
    try{const saved=JSON.parse(localStorage.getItem(TKEY)||"null");
      if(saved){
        if(saved.running&&saved.startTs){
          const elapsed=Math.floor((Date.now()-saved.startTs)/1000);
          const total=(saved.paused||0)+elapsed;
          secsRef.current=total;pausedRef.current=total;
          startRef.current=Date.now();runRef.current=true;
          setTick(t=>t+1);rafRef.current=requestAnimationFrame(tickRef.current);
        } else if((saved.s||0)>0){
          secsRef.current=saved.s||0;pausedRef.current=saved.s||0;setTick(t=>t+1);
        }
      }
    }catch(e){}
    return()=>{if(rafRef.current)cancelAnimationFrame(rafRef.current);};
  },[]);
  const fmtT=s=>{const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);const sc=s%60;return(h>0?String(h).padStart(2,"0")+":":"")+String(m).padStart(2,"0")+":"+String(sc).padStart(2,"0");};
  // Panel animation state
  const [closing,setClosing]=useState(false);
  const [minimizing,setMinimizing]=useState(false);
  const [panelAnimKey,setPanelAnimKey]=useState(0);
  // Progress bar drag (pointer capture)
  const barRef=useRef(null);
  const barDragging=useRef(false);
  const calcProg=clientX=>{
    if(!barRef.current)return;
    const r=barRef.current.getBoundingClientRect();
    const p=Math.round(((clientX-r.left)/r.width)*100/5)*5;
    setProgress(Math.max(0,Math.min(100,p)));
  };
  // Wizard
  const [wizStep,setWizStep]=useState(0);
  const [mood,setMood]=useState(null);
  const [progress,setProgress]=useState(task.progress||0);
  const [noteText,setNoteText]=useState("");
  const [celebrating,setCelebrating]=useState(false);
  const [saved,setSaved]=useState(false);
  const handleStop=()=>{pauseT();if(secs>=10)setWizStep(1);};
  const handleMinimize=()=>{setMinimizing(true);setTimeout(()=>{setMinimizing(false);setMinimized(true);},240);};
  const doClose=()=>{setClosing(true);setTimeout(()=>onClose(),320);};
  const handleComplete=()=>{
    setCelebrating(true);
    setTasks(tasks.map(t=>t.id===task.id?{...t,status:"Hotovo",progress:100}:t));
    setTimeout(()=>{
      if(secs>=10){const mins=Math.max(1,Math.round(secs/60));const pid=loggedInPerson?.id||task.assignedTo||"";const rate=people.find(p=>p.id===pid)?.rate||0;const billingRate=(projects||[]).find(pr=>pr.id===task.projectId)?.billingRate||0;setTimeEntries([{id:uid(),personId:pid,projectId:task.projectId||"",taskId:task.id,date:toDay(),minutes:mins,description:noteText||task.title,mood,taskProgress:100,taskNote:noteText||null,noteReadBy:[],rate,billingRate,billed:false},...timeEntries]);}

    setTasks(tasks.map(t=>t.id===task.id?{...t,progress}:t));
    resetT();setMood(null);setNoteText("");

      <span style={{...T.t,fontSize:20,color:tRunning?C.merlot:secs>0?C.ivory:C.dim,fontVariantNumeric:"tabular-nums",letterSpacing:"0.04em",lineHeight:1}}>{secs>0||tRunning?fmtT(secs):"00:00"}</span>
    </div>,
    document.body
  );
  // Full panel
  const panelAnim=(closing||minimizing)?"slideOutRight .25s cubic-bezier(.22,1,.36,1) forwards":"slideInRight .25s cubic-bezier(.22,1,.36,1)";
  return ReactDOM.createPortal(
    <div key={panelAnimKey} style={{position:"fixed",top:94,right:0,bottom:0,width:420,background:C.s1,borderLeft:`1px solid ${C.border}`,zIndex:600,display:"flex",flexDirection:"column",boxShadow:"-8px 0 40px rgba(0,0,0,0.5)",animation:panelAnim,pointerEvents:(closing||minimizing)?"none":"auto"}}>
      {/* Header */}
      <div style={{padding:"14px 18px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"flex-start",gap:10}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{...T.m,fontSize:15,color:C.ivory,fontWeight:600,lineHeight:1.35,marginBottom:5}}>{task.title}</div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            {person&&<span style={{...T.m,fontSize:11,color:C.dim}}>{person.name}</span>}
            {proj&&<span style={{...T.m,fontSize:11,color:C.dim}}>· {proj.name}</span>}
            {fd&&<span style={{...T.m,fontSize:11,color:fd.c}}>· {fd.l}</span>}
            <span style={{marginLeft:"auto",flexShrink:0}}><PrioDots n={pn} size={6} gap={3}/></span>
          </div>
        </div>
        <div style={{display:"flex",gap:4,flexShrink:0}}>
          <button onClick={handleMinimize} title="Minimalizovat"
            style={{background:"none",border:`1px solid ${C.border}`,cursor:"pointer",color:C.dim,padding:"4px 8px",borderRadius:3,lineHeight:1,display:"flex",alignItems:"center",justifyContent:"center"}}
            onMouseEnter={e=>e.currentTarget.style.color=C.ivory} onMouseLeave={e=>e.currentTarget.style.color=C.dim}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button onClick={doClose} style={{background:"none",border:`1px solid ${C.border}`,cursor:"pointer",color:C.dim,padding:"4px 8px",borderRadius:3,fontSize:13,...T.m,lineHeight:1}}
            onMouseEnter={e=>e.currentTarget.style.color=C.ivory} onMouseLeave={e=>e.currentTarget.style.color=C.dim}>✕</button>
        </div>
      </div>
      {/* Body */}
      <div style={{flex:1,overflowY:"auto",padding:"16px 18px",display:"flex",flexDirection:"column",gap:14}}>
        {/* Timer — above description */}
        <div style={{background:C.s0,border:`1px solid ${tRunning?C.merlot:C.border}`,borderRadius:6,padding:"14px 16px",transition:"border-color .3s"}}>
          <div style={{...T.m,fontSize:9,color:C.dim,letterSpacing:"0.1em",marginBottom:10,textTransform:"uppercase"}}>Timer</div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>

              {tRunning&&<div style={{width:6,height:6,borderRadius:"50%",background:C.merlot,animation:"pulse 1.4s ease infinite"}}/>}
            </div>

                </TBtn>}
              {/* Running: pause */}
              {tRunning&&
                <TBtn title="Pozastavit" onClick={pauseT} c={C.merlot} sx={{width:42,height:42}}>

              {/* Paused: resume + save + reset */}

                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                </TBtn>
                <TBtn title="Resetovat" onClick={resetT} c={C.merlot} sx={{width:42,height:42}}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </TBtn>
              </>}
            </div>}
          </div>

        {/* Existing progress bar (read-only, only before wizard) */}
        {(task.progress||0)>0&&wizStep===0&&<div>

}

function TasksView({tasks,setTasks,projects,settings,teams=[],confirmFn,authUser,authRole,authPersonId,taskDetailId,onOpenTask}){

    (authPersonId&&p.id===authPersonId)||
    (p.username&&authUser&&p.username.toLowerCase()===authUser.toLowerCase())||
    (p.name&&authUser&&p.name.toLowerCase()===authUser.toLowerCase())

  const [ed,setEd]=useState(null);const [f,setF]=useState(null);
  const [projF,setProjF]=useState("all");const [statusF,setStatusF]=useState("active");const [q,setQ]=useState("");
  const [dragTask,setDragTask]=useState(null);
  const isDragging=useRef(false);
  const u=k=>v=>setF(p=>({...p,[k]:v}));
  const {openMenu,CtxMenu}=useCtxMenu();
  const save=()=>{if(!f.title)return;setTasks(ed==="new"?[f,...tasks]:tasks.map(x=>x.id===ed?f:x));setEd(null);setF(null);};
  const del=async id=>{if(await confirmFn("Smazat úkol?"))setTasks(tasks.filter(x=>x.id!==id));};
  const cycleStatus=id=>{const o=["Todo","Probíhá","Hotovo"];setTasks(tasks.map(t=>t.id===id?{...t,status:o[(o.indexOf(t.status)+1)%3]}:t));};
  const [konceptyOpen,setKonceptyOpen]=useState(true);

  const visibleProjects=projects.filter(proj=>{
    if(isCEO)return true;
    const vRoles=proj.visibleRoles||[];
    const vPersons=proj.visiblePersons||[];
    if(vRoles.length===0&&vPersons.length===0)return false; // default: neviditelný
    if(loggedInPerson&&vPersons.includes(loggedInPerson.id))return true;
    if(authRole&&vRoles.includes(authRole.v))return true;
    return false;
  });
  const visibleProjectIds=new Set(visibleProjects.map(p=>p.id));

  // Kanban derivations
  const today=toDay();
  const weekEnd=(()=>{const d=new Date();d.setDate(d.getDate()+7);return d.toISOString().split("T")[0];})();
  const draftTasks=isCEO?tasks.filter(t=>t.isDraft):[];
  const wallKanban=tasks.filter(t=>t.onWall&&!t.isDraft&&t.status!=="Hotovo");
  const activeTasks=tasks.filter(t=>!t.onWall&&!t.isDraft);
  const applyKF=list=>list.filter(t=>{
    const mP=projF==="all"||(t.projectId?t.projectId===projF:projF==="");
    const mS=statusF==="all"||t.status===statusF||(statusF==="active"&&t.status!=="Hotovo");
    // Projekt není viditelný — skryj POKUD task není přímo přiřazen přihlášenému uživateli
    if(t.projectId&&!visibleProjectIds.has(t.projectId)){
      const directlyMine=loggedInPerson&&(t.assignedTo===loggedInPerson.id||(t.assignedPersons||[]).includes(loggedInPerson.id));
      if(!directlyMine&&!isCEO)return false;
    }
    return mP&&mS;
  });
  const myKanbanTasks=applyKF(activeTasks.filter(t=>
    t.assignedTo===loggedInPerson?.id||(t.assignedPersons||[]).includes(loggedInPerson?.id)
  ));
  const othersKanbanTasks=isCEO?applyKF(activeTasks.filter(t=>
    t.assignedTo!==loggedInPerson?.id&&!(t.assignedPersons||[]).includes(loggedInPerson?.id)
  )):[];
  const nonCEOMyTasks=!isCEO?applyKF(activeTasks.filter(t=>{
    if(!loggedInPerson)return false;
    const myTeam=(teams||[]).some(tm=>tm.id===t.teamId&&(tm.memberIds||[]).includes(loggedInPerson.id));
    return t.assignedTo===loggedInPerson.id||(t.assignedPersons||[]).includes(loggedInPerson.id)||myTeam;
  })):[];
  // Stats — pro non-CEO pouze jeho úkoly, jinak vše
  const statsBase=(!isCEO&&loggedInPerson)
    ?tasks.filter(t=>t.assignedTo===loggedInPerson.id||(t.assignedPersons||[]).includes(loggedInPerson.id))
    :tasks;
  const statsActiveCnt=statsBase.filter(t=>!t.isDraft&&t.status!=="Hotovo").length;
  const statsTodayCnt=statsBase.filter(t=>!t.isDraft&&t.deadline===today&&t.status!=="Hotovo").length;
  const statsWeekCnt=statsBase.filter(t=>!t.isDraft&&t.deadline>=today&&t.deadline<=weekEnd&&t.status!=="Hotovo").length;
  const statsDoneCnt=statsBase.filter(t=>!t.isDraft&&t.status==="Hotovo").length;
  const statsDoneTodayCnt=statsBase.filter(t=>!t.isDraft&&t.status==="Hotovo"&&t.deadline===today).length;
  const statsDoneWeekCnt=statsBase.filter(t=>!t.isDraft&&t.status==="Hotovo"&&t.deadline>=today&&t.deadline<=weekEnd).length;
  const statsDraftCnt=draftTasks.length;
  const progressPct=statsActiveCnt+statsDoneCnt>0?Math.round(statsDoneCnt/(statsActiveCnt+statsDoneCnt)*100):0;
  const [wallQ,setWallQ]=useState("");const [mineQ,setMineQ]=useState("");const [othersQ,setOthersQ]=useState("");const [draftQ,setDraftQ]=useState("");
  const [colFilter,setColFilter]=useState({wall:{p:"",prio:"",dl:""},mine:{p:"",prio:"",dl:""},others:{p:"",prio:"",dl:""},draft:{p:"",prio:"",dl:""}});
  const [colFOpen,setColFOpen]=useState("");
  const hasFilter=key=>{const f=colFilter[key];return !!(f.p||f.prio||f.dl);};
  const applyColFilter=(list,key)=>{const f=colFilter[key];return list.filter(t=>{if(f.p&&t.assignedTo!==f.p&&!(t.assignedPersons||[]).includes(f.p))return false;if(f.prio){const pn=prioNum(t.priority);if(f.prio==="Vysoká"&&pn<4)return false;if(f.prio==="Střední"&&(pn<2||pn>3))return false;if(f.prio==="Nízká"&&pn>2)return false;}if(f.dl==="today"&&t.deadline!==today)return false;if(f.dl==="week"&&(!t.deadline||t.deadline<today||t.deadline>weekEnd))return false;if(f.dl==="overdue"&&(!t.deadline||t.deadline>=today))return false;return true;});};
  const wallFiltered=applyColFilter(wallKanban.filter(t=>!wallQ||t.title.toLowerCase().includes(wallQ.toLowerCase())),"wall");
  const mineFiltered=applyColFilter((isCEO?myKanbanTasks:nonCEOMyTasks).filter(t=>!mineQ||t.title.toLowerCase().includes(mineQ.toLowerCase())),"mine");
  const othersFiltered=applyColFilter(othersKanbanTasks.filter(t=>!othersQ||t.title.toLowerCase().includes(othersQ.toLowerCase())),"others");
  const draftFiltered=applyColFilter(draftTasks.filter(t=>!draftQ||t.title.toLowerCase().includes(draftQ.toLowerCase())),"draft");
  const doneTasks=tasks.filter(t=>t.status==="Hotovo"&&!t.isDraft);
  const quickAdd=ov=>{setF({...blank,id:uid(),...ov});setEd("new");};

  // fmtDeadline is now a global (see below prioNum/PrioDots)

  // Column header helper — no count badge, with filter sort dropdown
  const colH=(title,cnt,searchVal,setSearch,onAdd,sortKey,rightEl=null)=>(
    <div style={{padding:"16px 18px 12px",borderBottom:`1px solid ${C.border}`}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
        <div>
          <span style={{...T.t,fontSize:15,letterSpacing:"0.15em",color:C.ivory,fontWeight:600}}>{title}</span>
          <div style={{width:32,height:2,background:C.merlot,borderRadius:1,marginTop:6}}/>
        </div>
        {rightEl}
      </div>
      <div style={{display:"flex",gap:6}}>
        <div style={{position:"relative",flex:1}}>
          <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:C.dim,fontSize:13,pointerEvents:"none"}}>⌕</span>
          <input value={searchVal} onChange={e=>setSearch(e.target.value)} placeholder="Hledat…"
            style={{...T.m,fontSize:FS.s,width:"100%",background:C.s0,border:`1px solid ${C.border}`,borderRadius:4,padding:"7px 10px 7px 26px",color:C.ivory,outline:"none",boxSizing:"border-box",transition:"border-color .15s"}}
            onFocus={e=>e.target.style.borderColor=C.merlot}
            onBlur={e=>e.target.style.borderColor=C.border}/>
        </div>
        {/* Filter button — visibility filter (Osoba / Priorita / Termín) */}
        <div style={{position:"relative",flexShrink:0}}>
          <button onClick={()=>setColFOpen(colFOpen===sortKey?"":sortKey)}
            style={{width:30,height:30,background:hasFilter(sortKey)?C.mDark:C.s0,border:`1px solid ${hasFilter(sortKey)?C.merlot:C.border}`,borderRadius:4,cursor:"pointer",color:hasFilter(sortKey)?C.merlot:C.dim,display:"flex",alignItems:"center",justifyContent:"center",transition:"all .15s"}}
            onMouseEnter={e=>{if(!hasFilter(sortKey)){e.currentTarget.style.borderColor=C.bHi;e.currentTarget.style.color=C.ivory;}}}
            onMouseLeave={e=>{if(!hasFilter(sortKey)){e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.dim;}}}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
            </svg>
          </button>
          {colFOpen===sortKey&&(()=>{
            const cf=colFilter[sortKey];
            const setCF=upd=>setColFilter(prev=>({...prev,[sortKey]:{...prev[sortKey],...upd}}));
            const prioC={Vysoká:C.merlot,Střední:C.amber,Nízká:C.green};
            const Chip=({active,color,onClick:oc,label})=>(
              <button onClick={oc} style={{...T.m,fontSize:10,padding:"3px 9px",borderRadius:3,cursor:"pointer",
                background:active?(color+"22"):"transparent",border:`1px solid ${active?color:C.border}`,
                color:active?color:C.dim,transition:"all .12s",whiteSpace:"nowrap"}}>
                {label}
              </button>
            );
            return <div style={{position:"absolute",right:0,top:"calc(100% + 4px)",background:C.s1,border:`1px solid ${C.border}`,borderRadius:5,zIndex:30,width:214,boxShadow:"0 6px 20px rgba(0,0,0,.5)",padding:"12px 12px 10px"}}>
              {people.filter(p=>p.active!==false).length>0&&<>
                <div style={{...T.m,fontSize:8,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6}}>Osoba</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:10}}>
                  {people.filter(p=>p.active!==false).map(p=>(
                    <Chip key={p.id} active={cf.p===p.id} color={p.color||C.bHi}
                      onClick={()=>setCF({p:cf.p===p.id?"":p.id})} label={p.name.split(" ")[0]}/>
                  ))}
                </div>
              </>}
              <div style={{...T.m,fontSize:8,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6}}>Priorita</div>
              <div style={{display:"flex",gap:4,marginBottom:10}}>
                {["Vysoká","Střední","Nízká"].map(pr=>(
                  <Chip key={pr} active={cf.prio===pr} color={prioC[pr]}
                    onClick={()=>setCF({prio:cf.prio===pr?"":pr})} label={pr}/>
                ))}
              </div>
              <div style={{...T.m,fontSize:8,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6}}>Termín</div>
              <div style={{display:"flex",gap:4,marginBottom:hasFilter(sortKey)?8:0}}>
                {[{v:"today",l:"Dnes"},{v:"week",l:"Týden"},{v:"overdue",l:"Prošlé"}].map(d=>(
                  <Chip key={d.v} active={cf.dl===d.v} color={d.v==="overdue"?C.merlot:C.bHi}
                    onClick={()=>setCF({dl:cf.dl===d.v?"":d.v})} label={d.l}/>
                ))}
              </div>
              {hasFilter(sortKey)&&<button onClick={()=>setColFilter(prev=>({...prev,[sortKey]:{p:"",prio:"",dl:""}}))}
                style={{...T.m,fontSize:10,width:"100%",padding:"6px",background:"none",border:`1px solid ${C.border}`,borderRadius:3,cursor:"pointer",color:C.dim,transition:"color .12s"}}
                onMouseEnter={e=>e.currentTarget.style.color=C.merlot}
                onMouseLeave={e=>e.currentTarget.style.color=C.dim}>✕ Zrušit filtry</button>}
            </div>;
          })()}
        </div>
        {/* Add button */}
        <button onClick={onAdd}
          style={{width:30,height:30,background:C.s0,border:`1px solid ${C.border}`,borderRadius:4,cursor:"pointer",color:C.dim,fontSize:18,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,lineHeight:1}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=C.merlot;e.currentTarget.style.color=C.ivory;}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.dim;}}>+</button>
      </div>
    </div>
  );

  // Kanban card — bez levé tečky, bez ○N, jméno šedé, priorita 1-5 tečky vpravo dole
  const renderKanbanCard=(t,isWall=false,showPerson=true,compact=false)=>{
    const person=people.find(p=>p.id===t.assignedTo);
    const pn=prioNum(t.priority);
    const fd=fmtDeadline(t.deadline);
    const isActive=taskDetailId===t.id;
    return <div key={t.id}
      draggable
      onDragStart={e=>{e.dataTransfer.effectAllowed="move";isDragging.current=true;setDragTask(t.id);}}
      onDragEnd={()=>{isDragging.current=false;setDragTask(null);}}
      onDragOver={e=>{e.preventDefault();e.stopPropagation();}}
      onContextMenu={e=>openMenu(e,[{l:"Upravit",a:()=>{setF({...t});setEd(t.id);}},{sep:true},{l:"Smazat",a:()=>del(t.id),danger:true}])}
      style={{background:isActive?C.s2:dragTask===t.id?C.s2:C.s0,
        border:`1px solid ${isActive?C.bHi:dragTask===t.id?C.merlot:C.border}`,
        borderRadius:5,marginBottom:compact?0:6,padding:"10px 14px",cursor:"pointer",
        opacity:t.status==="Hotovo"?0.5:1,transition:"background .12s,border-color .12s"}}
      onClick={()=>onOpenTask(isActive?null:t.id)}
      onMouseEnter={e=>{if(!isActive&&dragTask!==t.id){e.currentTarget.style.background=C.s2;e.currentTarget.style.borderColor=C.bHi;}}}
      onMouseLeave={e=>{if(!isActive&&dragTask!==t.id){e.currentTarget.style.background=C.s0;e.currentTarget.style.borderColor=C.border;}}}>
      {/* Název */}
      <div style={{...T.m,fontSize:FS.b,color:t.status==="Hotovo"?C.dim:C.ivory,
        textDecoration:t.status==="Hotovo"?"line-through":"none",fontWeight:500,lineHeight:1.3,
        overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:6}}>{t.title}</div>
      {/* Spodní řádek: jméno | tečky | datum */}
      <div style={{display:"grid",gridTemplateColumns:"1fr auto auto",gap:8,alignItems:"center"}}>
        <div style={{display:"flex",gap:6,alignItems:"center",overflow:"hidden"}}>
          {showPerson&&person&&<span style={{...T.m,fontSize:10,color:C.dim,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{person.name}</span>}
          {isWall&&loggedInPerson&&<button onClick={e=>{e.stopPropagation();setTasks(tasks.map(tk=>tk.id===t.id?{...tk,onWall:false,assignedTo:loggedInPerson.id}:tk));}}
            style={{...T.m,fontSize:10,background:C.s2,border:`1px solid ${C.bHi}`,borderRadius:3,padding:"1px 6px",cursor:"pointer",color:C.hi,flexShrink:0}}
            onMouseEnter={e=>e.currentTarget.style.borderColor=C.merlot}
            onMouseLeave={e=>e.currentTarget.style.borderColor=C.bHi}>Vzít</button>}
        </div>
        <PrioDots n={pn} size={5} gap={2}/>
        {fd?<span style={{...T.m,fontSize:10,color:fd.c,lineHeight:1,whiteSpace:"nowrap"}}>{fd.l}</span>:<span/>}
      </div>
    </div>;
  };

  // Koncept row — list style (simpler, no card border)
  const renderKonceptRow=t=>{
    const prioColor=t.priority==="Vysoká"?C.merlot:t.priority==="Střední"?C.amber:C.green;
    return <div key={t.id}
      draggable
      onDragStart={()=>{isDragging.current=true;setDragTask(t.id);}}
      onDragEnd={()=>{isDragging.current=false;setDragTask(null);}}
      onContextMenu={e=>openMenu(e,[{l:"Upravit",a:()=>{setF({...t});setEd(t.id);}},{l:"Přesunout do aktiv.",a:()=>setTasks(tasks.map(x=>x.id===t.id?{...x,isDraft:false}:x))},{sep:true},{l:"Smazat",a:()=>del(t.id),danger:true}])}
      style={{display:"flex",alignItems:"flex-start",gap:8,padding:"9px 2px",borderBottom:`1px solid ${C.border}`,cursor:"grab",opacity:dragTask===t.id?0.5:1,transition:"opacity .12s"}}>
      <span style={{color:C.dim,fontSize:10,marginTop:3,flexShrink:0,letterSpacing:"0.05em",cursor:"grab",userSelect:"none"}}>⋮⋮</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{...T.m,fontSize:FS.b,color:C.ivory,fontWeight:500,lineHeight:1.3}}>{t.title}</div>
        <div style={{marginTop:4}}><PrioDots n={prioNum(t.priority)} size={5} gap={2}/></div>
      </div>
    </div>;
  };

  return <><div className="anim-fadein">
    {/* Formulář */}
    {ed&&f&&<Card sx={{padding:16,marginBottom:16,borderColor:C.mBorder}}>
      <SH c={ed==="new"?"Nový úkol":"Upravit úkol"}/>
      <div className="grid-2-inp">
        <div style={{gridColumn:"1/-1"}}><Inp lbl="Název" val={f.title} onChange={u("title")} ph="Co je potřeba udělat…"/></div>
        <div style={{gridColumn:"1/-1"}}><Inp lbl="Popis" val={f.description||""} onChange={u("description")} ml rows={2} ph="Detailnější popis úkolu…"/></div>
        <Inp lbl="Projekt" val={f.projectId} onChange={u("projectId")}
          opts={[{v:"",l:"— bez projektu —"},...(isCEO?projects:visibleProjects).map(p=>({v:p.id,l:p.name}))]}/>
        <Inp lbl="Přiřadit osobě" val={f.assignedTo} onChange={u("assignedTo")}
          opts={[{v:"",l:"— nepřiřazeno —"},...people.filter(p=>p.active!==false).map(p=>({v:p.id,l:p.name}))]}/>
        {(teams||[]).length>0&&<Inp lbl="Přiřadit týmu" val={f.teamId||""} onChange={u("teamId")}
          opts={[{v:"",l:"— bez týmu —"},...(teams||[]).map(tm=>({v:tm.id,l:tm.name}))]}/>}
        <Inp lbl="Status" val={f.status} onChange={u("status")} opts={["Todo","Probíhá","Hotovo"].map(v=>({v,l:v}))}/>
        <div><Lbl c="Priorita"/><div style={{display:"flex",gap:6,alignItems:"center",padding:"6px 0"}}>{[1,2,3,4,5].map(i=>{const cur=prioNum(f.priority);return <div key={i} onClick={()=>u("priority")(i)} style={{width:14,height:14,borderRadius:"50%",background:i<=cur?"#E6E6E8":"#2A2A30",cursor:"pointer",border:`1px solid ${i<=cur?"#E6E6E8":"#3A3A42"}`,transition:"background .12s,border-color .12s",flexShrink:0}} onMouseEnter={e=>{e.currentTarget.style.background=i<=cur?"#E6E6E8":"#3A3A42";}} onMouseLeave={e=>{e.currentTarget.style.background=i<=cur?"#E6E6E8":"#2A2A30";}}/>;})} <span style={{...T.m,fontSize:11,color:C.dim,marginLeft:4}}>{prioNum(f.priority)}/5</span></div></div>
        <Inp lbl="Deadline" type="date" val={f.deadline} onChange={u("deadline")}/>
        <div style={{gridColumn:"1/-1"}}>
          <Lbl c="Přiřadit více lidem"/>

            {(f.assignedPersons||[]).map(pid=>{const pp=people.find(x=>x.id===pid);return <div key={pid} style={{display:"flex",alignItems:"center",gap:4,background:C.s2,border:`1px solid ${C.border}`,borderRadius:4,padding:"2px 8px"}}>
              <span style={{...T.m,fontSize:FS.s,color:C.ivory}}>{pp?.name||pid}</span>
              <span onClick={()=>u("assignedPersons")((f.assignedPersons||[]).filter(x=>x!==pid))} style={{cursor:"pointer",color:C.dim,fontWeight:600,lineHeight:1,marginLeft:2}}>×</span>
            </div>;})}
          </div>
          <Sel value="" ph="+ Přidat osobu…" onChange={v=>{if(v&&!(f.assignedPersons||[]).includes(v))u("assignedPersons")([...(f.assignedPersons||[]),v]);}} opts={people.filter(p=>p.active!==false&&!(f.assignedPersons||[]).includes(p.id)).map(p=>({v:p.id,l:p.name}))} sx={{padding:"8px 10px"}}/>
        </div>
        <div style={{gridColumn:"1/-1"}}><ChkRow label="Připnout na zeď" note="Úkol uvidí všichni — kdokoliv si ho může vzít" checked={!!f.onWall} onChange={v=>setF(p=>({...p,onWall:v,isDraft:v?false:p.isDraft}))}/></div>
        {isCEO&&<div style={{gridColumn:"1/-1"}}><ChkRow label="Koncept" note="Uložit jako koncept — nebude viditelný ostatním" checked={!!f.isDraft} onChange={v=>setF(p=>({...p,isDraft:v,onWall:v?false:p.onWall}))}/></div>}
        <div style={{gridColumn:"1/-1"}}><Inp lbl="Poznámka" val={f.note} onChange={u("note")} ml rows={2}/></div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:12}}><Btn ch="Uložit" onClick={save}/><Btn ch="Zrušit" onClick={()=>{setEd(null);setF(null);}} v="g"/></div>
    </Card>}

    {/* Project filter — small row above grid */}
    <div style={{display:"flex",justifyContent:"flex-end",marginBottom:8}}>
      <Sel value={projF} onChange={v=>setProjF(v)} opts={[{v:"all",l:"Všechny projekty"},...(isCEO?projects:visibleProjects).map(p=>({v:p.id,l:p.name}))]} sx={{padding:"5px 10px",minWidth:140,fontSize:FS.s}}/>
    </div>

    {/* Stats row — same grid as kanban, 2 stat blocks per column */}
    {(()=>{
      const SI=(path,extra="")=><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{__html:path}}/>;
      const Stat=({icon,label,value,border=true})=>(
        <div style={{flex:1,display:"flex",alignItems:"center",gap:10,padding:"14px 16px",...(border?{borderRight:`1px solid ${C.border}`}:{})}}>
          <span style={{color:C.dim,lineHeight:0,flexShrink:0}}>{icon}</span>
          <div>
            <div style={{...T.t,fontSize:26,fontWeight:700,color:C.ivory,lineHeight:1}}>{value}</div>
            <div style={{...T.m,fontSize:8,color:C.dim,textTransform:"uppercase",letterSpacing:"0.07em",marginTop:4,lineHeight:1.35}}>{label}</div>
          </div>
        </div>
      );
      const cardSx={background:C.s1,border:`1px solid ${C.border}`,borderRadius:6,display:"flex",overflow:"hidden"};
      const gc=isCEO?(konceptyOpen?"1fr 1fr 1fr 230px":"1fr 1fr 1fr 32px"):"1fr 1fr";
      return <div style={{display:"grid",gridTemplateColumns:gc,gap:14,marginBottom:14}}>

        {/* Card 1 — nad ZEĎ */}
        <div style={cardSx}>
          <div style={{flex:1,padding:"14px 16px",borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",justifyContent:"center"}}>
            <div style={{...T.m,fontSize:8,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>TÝDENNÍ PROGRESS</div>
            <div style={{...T.t,fontSize:26,fontWeight:700,color:C.ivory,lineHeight:1,marginBottom:7}}>{progressPct} %</div>
            <div style={{height:3,background:C.s2,borderRadius:2,overflow:"hidden"}}>
              <div style={{width:`${progressPct}%`,height:"100%",background:C.merlot,borderRadius:2,transition:"width .4s"}}/>
            </div>
          </div>
          <Stat border={false} value={statsActiveCnt} label="ZBÝVAJÍCÍ"
            icon={<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M5 4H4a2 2 0 00-2 2v14a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2h-1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>}/>
        </div>

        onDragOver={e=>e.preventDefault()}

        {colH("PŘIDĚLENÉ ÚKOLY",othersFiltered.length,othersQ,setOthersQ,()=>quickAdd({}),"others")}
        <div style={{overflowY:"auto",maxHeight:"60vh",padding:"10px 12px"}}
          onDragOver={e=>e.preventDefault()}>
          {othersFiltered.length===0&&<div style={{...T.m,fontSize:FS.s,color:C.dim,textAlign:"center",padding:"24px 0",opacity:0.6}}>Žádné přidělené úkoly</div>}
          {othersFiltered.map(t=>renderKanbanCard(t,false,true))}
        </div>
      </div>}

      {/* ── KONCEPTY — CEO only, rightmost ── */}

          onDragOver={e=>e.preventDefault()}
          onDrop={e=>{e.preventDefault();if(dragTask)setTasks(tasks.map(t=>t.id===dragTask?{...t,isDraft:true,onWall:false}:t));setDragTask(null);}}>
          {colH("KONCEPTY",draftFiltered.length,draftQ,setDraftQ,()=>quickAdd({isDraft:true}),"draft",
            <button onClick={()=>setKonceptyOpen(false)}
              style={{width:26,height:26,background:"none",border:"none",cursor:"pointer",color:C.dim,display:"flex",alignItems:"center",justifyContent:"center",borderRadius:3,flexShrink:0,transition:"color .15s"}}
              onMouseEnter={e=>e.currentTarget.style.color=C.ivory}
              onMouseLeave={e=>e.currentTarget.style.color=C.dim}
              title="Skrýt koncepty">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </button>)}
          <div style={{overflowY:"auto",maxHeight:"60vh",padding:"10px 12px"}}
            onDragOver={e=>e.preventDefault()}>
            {draftFiltered.length===0&&<div style={{...T.m,fontSize:FS.s,color:C.dim,textAlign:"center",padding:"24px 0",opacity:0.6}}>Žádné koncepty</div>}

          onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
          <span style={{...T.t,fontSize:10,color:C.dim,writingMode:"vertical-rl",textOrientation:"mixed",transform:"rotate(180deg)",letterSpacing:"0.18em",lineHeight:1}}>KONCEPTY</span>
        </div>
      )}
    </div>

    {/* ── HOTOVÉ — collapsible strip below kanban ── */}

        <div style={{padding:"12px 18px 10px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <span style={{...T.t,fontSize:15,letterSpacing:"0.15em",color:C.dim,fontWeight:600}}>HOTOVÉ ÚKOLY</span>
            <div style={{width:32,height:2,background:C.green,borderRadius:1,marginTop:6}}/>
          </div>
          <button onClick={()=>setDoneOpen(false)}
            style={{width:26,height:26,background:"none",border:"none",cursor:"pointer",color:C.dim,display:"flex",alignItems:"center",justifyContent:"center",borderRadius:3,transition:"color .15s"}}
            onMouseEnter={e=>e.currentTarget.style.color=C.ivory} onMouseLeave={e=>e.currentTarget.style.color=C.dim}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div style={{padding:"10px 12px",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:6,maxHeight:"40vh",overflowY:"auto"}}>
          {doneTasks.length===0
            ?<div style={{...T.m,fontSize:FS.s,color:C.dim,padding:"20px 0",opacity:0.6,gridColumn:"1/-1",textAlign:"center"}}>Žádné hotové úkoly</div>
            :doneTasks.map(t=>renderKanbanCard(t,false,true,true))}
        </div>
      </div>
      :<div onClick={()=>setDoneOpen(true)}
        style={{marginTop:14,background:C.s0,border:`1px solid ${C.border}`,borderRadius:6,cursor:"pointer",padding:"10px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",transition:"border-color .15s"}}
        onMouseEnter={e=>e.currentTarget.style.borderColor=C.bHi}
        onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
        <span style={{...T.t,fontSize:11,color:C.dim,letterSpacing:"0.18em"}}>HOTOVÉ ÚKOLY</span>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {doneTasks.length>0&&<span style={{...T.t,fontSize:13,color:C.green,fontWeight:300}}>{doneTasks.length}</span>}
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{color:C.dim}}><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>}

    <div style={{...T.m,fontSize:FS.s,color:C.dim,textAlign:"center",marginTop:20,opacity:0.55}}>
      Přetáhni úkol mezi panely
    </div>
  </div>{CtxMenu}
  </>;
}


function ProjectDetail({proj,tasks,setTasks,timeEntries,expenses,clients,settings,invoices,onInvoice,onBack,confirmFn}){
  const people=settings.people||[];
  const cl=clients.find(c=>c.id===proj.clientId);
  const pTasks=tasks.filter(t=>t.projectId===proj.id);
  const pEntries=timeEntries.filter(e=>e.projectId===proj.id);
  const pExp=expenses.filter(e=>e.projectId===proj.id);
  const pInv=invoices.filter(i=>i.projectId===proj.id);
  const unbilled=pEntries.filter(e=>!e.billed);
  const unbilledVal=unbilled.reduce((s,e)=>s+calcEntryVal(e,people),0);
  const billedInvVal=pInv.reduce((s,i)=>s+calcInv(i.items,i.vatEnabled,i.vatRate,i.discount).tot,0);
  const [newTask,setNewTask]=useState("");const [assignTo,setAssignTo]=useState("");
  const addTask=()=>{if(!newTask.trim())return;setTasks([...tasks,{id:uid(),projectId:proj.id,title:newTask,assignedTo:assignTo,status:"Todo",priority:"Střední",deadline:"",note:""}]);setNewTask("");};
  const cycleStatus=id=>{const o=["Todo","Probíhá","Hotovo"];setTasks(tasks.map(t=>t.id===id?{...t,status:o[(o.indexOf(t.status)+1)%3]}:t));};
  const statC={Todo:C.dim,"Probíhá":C.blue,Hotovo:C.green};
  return <div className="anim-fadein">
    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20,flexWrap:"wrap"}}>
      <button onClick={onBack} style={{...T.m,background:"transparent",border:`1px solid ${C.border}`,borderRadius:3,padding:"6px 12px",cursor:"pointer",fontSize:9,letterSpacing:"0.12em",textTransform:"uppercase",color:C.dim}} onMouseEnter={e=>e.currentTarget.style.color=C.ivory} onMouseLeave={e=>e.currentTarget.style.color=C.dim}>← Projekty</button>
      <div style={{display:"flex",alignItems:"center",gap:10,flex:1,minWidth:0}}>
        <div style={{width:12,height:12,borderRadius:2,background:proj.color||C.merlot,flexShrink:0}}/>
        <div style={{...T.t,fontSize:22,fontWeight:300,letterSpacing:"0.1em",color:C.ivory}}>{proj.name}</div>
        {cl&&<span style={{...T.m,fontSize:FS.b,color:C.hi}}>{cl.name||cl.company}</span>}
      </div>
      {unbilled.length>0&&<Btn ch={`Fakturovat ${unbilled.length}× (${FMT(unbilledVal)})`} onClick={()=>onInvoice(proj,unbilled,people)} sx={{background:C.merlot,border:"none"}}/>}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:16}} className="grid-kpi">
      {[{l:"Hodiny",v:fmtMins(pEntries.reduce((s,e)=>s+(e.minutes||0),0)),c:C.ivory},{l:"Hodnota hodin",v:FMT(pEntries.reduce((s,e)=>s+calcEntryVal(e,people),0)),c:C.blue},{l:"Vyfakturováno",v:FMT(billedInvVal),c:C.green},{l:"Výdaje",v:FMT(pExp.reduce((s,e)=>s+(parseFloat(e.amount)||0),0)),c:C.merlot}].map(s=><Card key={s.l} sx={{padding:"10px 14px"}}><Lbl c={s.l} s={{fontSize:7.5,marginBottom:3}}/><div style={{...T.t,fontSize:17,fontWeight:300,color:s.c}}>{s.v}</div></Card>)}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}} className="grid-fin-2">
      <Card sx={{padding:"14px 18px"}}>
        <SH c="Úkoly"/>
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <input value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTask()} placeholder="Přidat úkol…" style={{flex:1,background:C.s2,border:`1px solid ${C.border}`,borderRadius:3,padding:"8px 10px",color:C.ivory,...T.m,fontSize:FS.b,outline:"none"}}/>
          <div style={{width:90,flexShrink:0}}><Sel value={assignTo} onChange={v=>setAssignTo(v)} ph="Kdo" opts={[{v:"",l:"Kdo"},...people.filter(p=>p.active!==false).map(p=>({v:p.id,l:p.name}))]} sx={{padding:"8px",fontSize:FS.s}}/></div>
          <Btn ch="+" onClick={addTask} sx={{padding:"8px 12px"}}/>
        </div>
        {pTasks.length===0?<div style={{...T.m,fontSize:FS.b,color:C.dim,textAlign:"center",padding:"8px 0"}}>Žádné úkoly</div>
          :pTasks.map((t,i)=>{const person=people.find(p=>p.id===t.assignedTo);
            return <div key={t.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:i<pTasks.length-1?`1px solid ${C.border}`:"none"}}>
              <button onClick={()=>cycleStatus(t.id)} style={{width:16,height:16,borderRadius:"50%",border:`2px solid ${statC[t.status]||C.dim}`,background:t.status==="Hotovo"?statC[t.status]:"transparent",cursor:"pointer",flexShrink:0}}/>
              <span style={{...T.m,fontSize:FS.b,color:t.status==="Hotovo"?C.dim:C.ivory,flex:1,textDecoration:t.status==="Hotovo"?"line-through":"none"}}>{t.title}</span>
              {person&&<span style={{...T.m,fontSize:FS.s,color:person.color}}>{person.name}</span>}
              <span style={{...T.m,fontSize:FS.s,color:statC[t.status]||C.dim}}>{t.status}</span>
            </div>;})}
      </Card>
      <Card sx={{padding:"14px 18px"}}>
        <SH c="Záznamy hodin"/>
        {pEntries.length===0?<div style={{...T.m,fontSize:FS.b,color:C.dim,textAlign:"center",padding:"8px 0"}}>Žádné záznamy</div>
          :[...pEntries].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,10).map((e,i)=>{
            const person=people.find(p=>p.id===e.personId);
            return <div key={e.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:i<Math.min(pEntries.length,10)-1?`1px solid ${C.border}`:"none"}}>
              <div style={{width:4,height:4,borderRadius:"50%",background:person?.color||C.merlot,flexShrink:0}}/>
              <div style={{flex:1,minWidth:0}}>
                {person&&<span style={{...T.m,fontSize:FS.b,color:person.color,marginRight:6}}>{person.name}</span>}
                <span style={{...T.m,fontSize:FS.b,color:C.hi,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",display:"inline-block",maxWidth:110}}>{e.description||"—"}</span>
              </div>
              <span style={{...T.m,fontSize:FS.s,color:C.dim,flexShrink:0}}>{fmtD(e.date)}</span>
              <span style={{...T.t,fontSize:12,fontWeight:300,color:e.billed?C.green:C.ivory,flexShrink:0}}>{fmtMins(e.minutes)}</span>
            </div>;})}
      </Card>
    </div>
  </div>;
}

function ProjectsView({projects,setProjects,tasks,setTasks,timeEntries,expenses,clients,settings,invoices,onInvoice,confirmFn}){

    const proj=projects.find(p=>p.id===detail);

            {(f.visiblePersons||[]).map(pid=>{
              const person=(settings.people||[]).find(p=>p.id===pid);
              return <div key={pid} style={{display:"flex",alignItems:"center",gap:4,background:C.s2,border:`1px solid ${C.border}`,borderRadius:4,padding:"2px 8px"}}>
                <span style={{...T.m,fontSize:FS.s,color:C.ivory}}>{person?.name||pid}</span>
                <span onClick={()=>u("visiblePersons")((f.visiblePersons||[]).filter(x=>x!==pid))} style={{cursor:"pointer",color:C.dim,fontWeight:600,lineHeight:1}}>×</span>
              </div>;
            })}
          </div>
          <Sel value="" ph="+ Přidat osobu…" onChange={v=>{if(v&&!(f.visiblePersons||[]).includes(v))u("visiblePersons")([...(f.visiblePersons||[]),v]);}} opts={(settings.people||[]).filter(p=>p.active!==false&&!(f.visiblePersons||[]).includes(p.id)).map(p=>({v:p.id,l:p.name}))} sx={{padding:"8px 10px"}}/>
        </div>
      </div>
      <div style={{gridColumn:"1/-1",marginTop:4,...T.m,fontSize:FS.s,color:C.dim}}>
        Pokud nejsou vybrány žádné role ani osoby → projekt vidí jen CEO a Admin
      </div>

      <div style={{display:"flex",gap:10,marginTop:14}}><Btn ch="Uložit" onClick={save}/><Btn ch="Zrušit" onClick={()=>{setEd(null);setF(null);}} v="g"/></div>
    </Card>}
    <div style={{marginBottom:12}}><SearchBar value={q} onChange={setQ} ph="Hledat projekty…"/></div>
    {filtered.length===0&&!ed
      ?<div style={{border:`1px dashed ${C.border}`,borderRadius:4,padding:"56px 0",textAlign:"center"}}>
          <div style={{...T.t,fontSize:20,letterSpacing:"0.2em",color:C.dim,marginBottom:14}}>ŽÁDNÉ PROJEKTY</div>
          <Btn ch="+ Nový projekt" onClick={()=>{setF({...blank,id:uid()});setEd("new");}}/>
        </div>
      :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:10}}>
        {filtered.map(p=>{
          const cl=clients.find(c=>c.id===p.clientId);
          const openT=tasks.filter(t=>t.projectId===p.id&&t.status!=="Hotovo").length;
          const pHours=timeEntries.filter(e=>e.projectId===p.id).reduce((s,e)=>s+(e.minutes||0),0);
          const pInvV=invoices.filter(i=>i.projectId===p.id).reduce((s,i)=>s+calcInv(i.items,i.vatEnabled,i.vatRate,i.discount).tot,0);
          const pExpV=expenses.filter(e=>e.projectId===p.id).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
          const overdue=p.deadline&&new Date(p.deadline)<new Date()&&p.status==="Aktivní";
          return <Card key={p.id} sx={{padding:"16px 18px",cursor:"pointer",transition:"border-color .15s,background .15s"}}
            onClick={()=>setDetail(p.id)}
            onContextMenu={e=>openMenu(e,[{l:"Otevřít projekt",a:()=>setDetail(p.id)},{l:"Upravit projekt",a:()=>{setF({...p});setEd(p.id);}},{sep:true},{l:"Smazat projekt",a:()=>del(p.id),danger:true}])}
            onMouseEnter={e=>{e.currentTarget.style.borderColor=p.color||C.merlot;e.currentTarget.style.background=C.s0;}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.background=C.s1;}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
              <div style={{display:"flex",alignItems:"center",gap:8,minWidth:0}}>
                <div style={{width:8,height:32,borderRadius:2,background:p.color||C.merlot,flexShrink:0}}/>
                <div><div style={{...T.t,fontSize:16,fontWeight:300,color:C.ivory,letterSpacing:"0.08em"}}>{p.name}</div>
                  {cl&&<div style={{...T.m,fontSize:FS.s,color:C.hi,marginTop:1}}>{cl.name||cl.company}</div>}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
                <span style={{...T.m,fontSize:FS.s,letterSpacing:"0.08em",textTransform:"uppercase",color:stC[p.status]||C.dim,border:"1px solid currentColor",borderRadius:3,padding:"1px 6px",whiteSpace:"nowrap"}}>{p.status}</span>
                {overdue&&<span style={{...T.m,fontSize:FS.s,color:C.merlot}}>⚠ po deadline</span>}
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5,marginBottom:10}}>
              {[{l:"Úkoly",v:openT>0?openT+" otevřených":"—"},{l:"Hodiny",v:pHours>0?fmtMins(pHours):"—"},{l:"Vyfakturováno",v:pInvV>0?FMT(pInvV):"—"},{l:"Výdaje",v:pExpV>0?FMT(pExpV):"—"}].map(s=><div key={s.l} style={{background:C.s2,borderRadius:3,padding:"4px 8px"}}>
                <div style={{...T.m,fontSize:FS.s,color:C.dim,marginBottom:1}}>{s.l}</div>
                <div style={{...T.m,fontSize:FS.b,color:C.ivory}}>{s.v}</div>
              </div>)}
            </div>
            {p.deadline&&<div style={{...T.m,fontSize:FS.s,color:overdue?C.merlot:C.dim}}>{fmtD(p.deadline)}</div>}
          </Card>;
        })}
      </div>}
  </div>{CtxMenu}</>;
}
